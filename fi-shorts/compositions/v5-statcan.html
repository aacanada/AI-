<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="v5-statcan-template">
      <link rel="stylesheet" href="assets/shared.css" />
      <style>
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--bg);
          color: var(--ink);
          font-family: "Pretendard", sans-serif;
        }
        .v5-scene { position: absolute; inset: 0; }
        .v5-kick {
          position: absolute; left: 70px; top: 210px;
          display: inline-flex; align-items: center; gap: 12px;
          padding: 10px 22px; border-radius: 999px; background: var(--ink); color: var(--bg);
          font-size: 32px; font-weight: 800;
        }
        .v5-title {
          position: absolute; left: 70px; right: 70px; top: 290px;
          font-size: 76px; font-weight: 900; line-height: 1.18; letter-spacing: -0.035em;
        }
        .v5-src { font-size: 26px; font-weight: 500; color: var(--ink-soft); }
        .v5-card {
          position: relative; padding: 12px; background: #fff; border-radius: 6px;
          box-shadow: 0 22px 44px rgba(60, 45, 20, 0.22), 0 2px 6px rgba(60, 45, 20, 0.12);
        }
        .v5-card img { display: block; }

        #v5-big { position: absolute; left: 70px; right: 70px; top: 290px; display: flex; align-items: baseline; gap: 24px; }
        #v5-big b { font-family: "Inter", sans-serif; font-size: 150px; font-weight: 800; line-height: 1; color: var(--fi); letter-spacing: -0.04em; }
        #v5-big .lbl { font-size: 44px; font-weight: 800; line-height: 1.25; }
        #v5-ct { position: absolute; left: 70px; right: 70px; top: 480px; display: flex; justify-content: space-between; align-items: baseline; }
        #v5-ct b { font-size: 38px; font-weight: 800; }
        #v5-leg { font-size: 30px; font-weight: 700; }
        #v5-leg i { display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin: 0 8px 0 18px; vertical-align: -3px; }
        #v5-rows { position: absolute; left: 70px; right: 70px; top: 560px; height: 700px; }
        .v5-row { position: absolute; left: 0; width: 940px; height: 66px; }
        .v5-name { position: absolute; left: 0; top: 14px; font-size: 32px; font-weight: 700; white-space: nowrap; }
        .v5-line { position: absolute; top: 31px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--tdsb), var(--fi)); transform-origin: left center; }
        .v5-dot { position: absolute; top: 18px; width: 32px; height: 32px; margin-left: -16px; border-radius: 50%; border: 4px solid var(--bg); }
        .v5-num { position: absolute; top: 14px; font-family: "Inter", sans-serif; font-size: 30px; font-weight: 800; white-space: nowrap; }
        #v5-tag { position: absolute; top: 10px; padding: 6px 16px; border-radius: 999px; background: var(--red); color: #fff; font-size: 28px; font-weight: 800; white-space: nowrap; }
        #v5-src { position: absolute; left: 70px; top: 1250px; }

      </style>

      <div id="root" data-composition-id="v5-statcan" data-width="1080" data-height="1920">
        <div class="v5-scene" id="v5-scene">

          <div class="v5-kick" id="v5-kick">캐나다 통계청 · 2000년 읽기 평가</div>
          <div id="v5-big"><b><span id="v5-98">0</span>%</b><span class="lbl">이머전 학생이 영어로 시험</span></div>
          <div id="v5-ct"><b>주별 읽기 평균 점수</b><div id="v5-leg"><i style="background: var(--fi)"></i>이머전<i style="background: var(--tdsb)"></i>비이머전</div></div>
          <div id="v5-rows"></div>
          <div class="v5-src" id="v5-src">출처: Statistics Canada, Education Quarterly Review (2004)</div>

        </div>
      </div>

      <script>
        (function () {
          const N = window.__NARR["v5-statcan"], L = N.L, END = N.dur;
          const tl = gsap.timeline({ paused: true });

          const DATA = [["BC","브리티시컬럼비아",610,537],["NL","뉴펀들랜드",608,510],["AB","앨버타",601,548],["ON","온타리오",570,533],["SK","서스캐처원",570,529],["NS","노바스코샤",567,517],["QC","퀘벡",566,537],["PE","PEI",558,509],["NB","뉴브런즈윅",550,495],["MB","매니토바",533,533]];
          const X0 = 300, W = 500, LO = 490, HI = 620;
          const px = (v) => X0 + ((v - LO) / (HI - LO)) * W;
          const rows = document.getElementById("v5-rows");
          DATA.forEach(function (d, i) {
            const r = document.createElement("div");
            r.className = "v5-row"; r.id = "v5-row-" + d[0]; r.style.top = i * 66 + "px";
            const a = px(d[3]), b = px(d[2]);
            let h = '<div class="v5-name">' + d[1] + "</div>";
            if (d[2] !== d[3]) {
              h += '<span class="v5-line" style="left:' + a + "px;width:" + (b - a) + 'px"></span>';
              h += '<span class="v5-dot v5-non" style="left:' + a + 'px;background:var(--tdsb)"></span>';
              h += '<span class="v5-dot v5-imm" style="left:' + b + 'px;background:var(--fi)"></span>';
              h += '<span class="v5-num" style="left:' + (b + 24) + 'px;color:var(--fi)">' + d[2] + "</span>";
            } else {
              h += '<span class="v5-dot v5-imm" style="left:' + b + 'px;background:var(--fi);box-shadow:0 0 0 4px var(--tdsb)"></span>';
              h += '<span class="v5-num" style="left:' + (b + 24) + 'px">' + d[2] + "</span>";
              h += '<span id="v5-tag" style="left:' + (b + 104) + 'px">유일한 동점</span>';
            }
            r.innerHTML = h; rows.appendChild(r);
          });
          tl.fromTo("#v5-kick", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4 }, 0.05);
          tl.fromTo("#v5-big", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.2);
          const big = document.getElementById("v5-98"), st = { v: 0 };
          tl.fromTo(st, { v: 0 }, { v: 98, duration: 1.0, ease: "power2.out", onUpdate: function () { big.textContent = Math.round(st.v); } }, 0.3);
          tl.fromTo(["#v5-ct", "#v5-src"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
          tl.set([".v5-name", ".v5-dot", ".v5-num", "#v5-tag"], { opacity: 0 }, 0);
          tl.set(".v5-line", { scaleX: 0 }, 0);
          DATA.forEach(function (d, i) {
            const at = 1.0 + i * 0.28, row = "#v5-row-" + d[0];
            tl.to(row + " .v5-name", { opacity: 1, duration: 0.25 }, at);
            if (d[2] !== d[3]) {
              tl.to(row + " .v5-non", { opacity: 1, duration: 0.2 }, at);
              tl.to(row + " .v5-line", { scaleX: 1, duration: 0.45, ease: "power2.out" }, at + 0.05);
            }
            tl.to(row + " .v5-imm", { opacity: 1, duration: 0.2 }, at + 0.35);
            tl.to(row + " .v5-num", { opacity: 1, duration: 0.25 }, at + 0.4);
          });
          tl.fromTo("#v5-tag", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(2)" }, L[1] + 0.3);

          tl.to("#v5-scene", { opacity: 0, duration: 0.3, ease: "power2.in" }, END - 0.3);
          window.__timelines["v5-statcan"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
