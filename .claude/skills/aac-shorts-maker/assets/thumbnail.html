<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url("fonts/Pretendard-Medium.woff2")}
@font-face{font-family:P;font-weight:700;src:url("fonts/Pretendard-Bold.woff2")}
@font-face{font-family:P;font-weight:800;src:url("fonts/Pretendard-ExtraBold.woff2")}
@font-face{font-family:P;font-weight:900;src:url("fonts/Pretendard-Black.woff2")}
:root{--bg:#fdfae7;--ink:#111;--blue:#1e2bfa;--red:#dc2626;--muted:#6b6b6b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--bg);font-family:P,sans-serif;color:var(--ink)}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.band{position:absolute;left:-20%;width:140%;height:34%;top:52%;background:rgba(30,43,250,.07);transform:rotate(-12deg)}
.dots{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.6)}
.dots i{width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:rgba(30,43,250,.35);display:block}
.ring{position:absolute;border:2px solid rgba(30,43,250,.10);border-radius:50%}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--u)*6)}
.badge{align-self:flex-start;background:var(--blue);color:#fff;font-weight:800;font-size:calc(var(--u)*3.2);padding:calc(var(--u)*.9) calc(var(--u)*2.4);border-radius:999px;margin-bottom:calc(var(--u)*3)}
.strike{font-weight:900;font-size:calc(var(--u)*6);color:#9a9a9a;position:relative;align-self:flex-start;margin-bottom:calc(var(--u)*1.5)}
.strike:after{content:"";position:absolute;left:-2%;right:-2%;top:52%;height:calc(var(--u)*1.1);background:var(--red);transform:rotate(-3deg)}
.title{font-weight:900;font-size:calc(var(--u)*var(--ts));line-height:1.12;letter-spacing:-.03em;word-break:keep-all}
.title b{color:var(--blue)}
.big{white-space:nowrap;font-weight:900;color:var(--blue);font-size:calc(var(--u)*var(--bs));line-height:1;letter-spacing:-.04em;margin-top:calc(var(--u)*2)}
.big small{font-size:.32em;color:var(--ink);margin-left:.2em;letter-spacing:0}
.sub{font-weight:700;font-size:calc(var(--u)*3.6);color:var(--muted);margin-top:calc(var(--u)*2.4);word-break:keep-all}
.brand{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*4);font-weight:900;font-size:calc(var(--u)*3.4)}
.brand span{color:var(--blue)}
.wide .content{padding-right:42%}
.wide .bigside{position:absolute;right:calc(var(--u)*5);top:50%;transform:translateY(-50%);text-align:right}
</style></head>
<body><div class="stage" id="stage"></div>
<script>
const s = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const wide = s.width > s.height;
document.documentElement.style.setProperty('--w', s.width+'px');
document.documentElement.style.setProperty('--h', s.height+'px');
document.documentElement.style.setProperty('--u', (Math.min(s.width,s.height)/100)+'px');
document.documentElement.style.setProperty('--ts', s.titleSize || (wide?11:10));
document.documentElement.style.setProperty('--bs', s.bigSize || (wide?22:24));
const st = document.getElementById('stage'); if (wide) st.classList.add('wide');
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl = t => esc(t).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const dots = '<i></i>'.repeat(9);
const big = s.big ? `<div class="big">${esc(s.big)}${s.bigUnit?`<small>${esc(s.bigUnit)}</small>`:''}</div>` : '';
st.innerHTML = `<div class="band"></div>
<div class="ring" style="width:140%;aspect-ratio:1;left:-20%;top:${wide?'-60%':'10%'}"></div>
<div class="dots" style="left:6%;top:5%">${dots}</div><div class="dots" style="right:6%;top:${wide?'70%':'78%'}">${dots}</div>
<div class="content">
 ${s.badge?`<div class="badge">${esc(s.badge)}</div>`:''}
 ${s.strike?`<div class="strike">${esc(s.strike)}</div>`:''}
 <div class="title">${(s.title||[]).map(hl).join('<br>')}</div>
 ${wide?'':big}
 ${s.sub?`<div class="sub">${hl(s.sub)}</div>`:''}
</div>
${wide&&big?`<div class="bigside">${big}</div>`:''}
<div class="brand">AA <span>Canada</span></div>`;
document.fonts.ready.then(()=>document.body.dataset.ready='1');
</script></body></html>
