      <script>
        (function () {
          // VIDEO_BRIEF.md §2 table1_K6_2011
          const D = {
            p1: { fi: 67, ef: 40, td: 46 },
            p2: { fi: 7, ef: 26, td: 18 },
          };

          // Zoom targets: row centres in the displayed 900px image (source 743x364, x1.2113),
          // relative to the card centre, then rotated by the card's -2deg tilt.
          const IMG_CX = 450,
            IMG_CY = 220.5,
            K = 900 / 743;
          const ROW_X = 320; // a bit right of the marked cells so the card fills the frame
          const TILT = (-2 * Math.PI) / 180;
          function target(rowSrcY) {
            const ox = ROW_X - IMG_CX,
              oy = rowSrcY * K - IMG_CY;
            return {
              x: -(ox * Math.cos(TILT) - oy * Math.sin(TILT)),
              y: -(ox * Math.sin(TILT) + oy * Math.cos(TILT)),
            };
          }
          const ENG = target(165),
            OUT = target(224.5),
            ARR = target(254.5);
          const Z = 1.5;

          const tl = gsap.timeline({ paused: true });

          function countUp(id, to, at) {
            const el = document.getElementById(id);
            const st = { v: 0 };
            tl.fromTo(
              st,
              { v: 0 },
              {
                v: to,
                duration: 0.9,
                ease: "power2.out",
                onUpdate: function () {
                  el.textContent = Math.round(st.v);
                },
              },
              at,
            );
          }
          function bars(p, at) {
            tl.fromTo(
              ["#s03-" + p + "-bar-fi", "#s03-" + p + "-bar-ef", "#s03-" + p + "-bar-td"],
              { scaleY: 0 },
              { scaleY: 1, duration: 0.9, ease: "power2.out", stagger: 0.15 },
              at,
            );
            countUp("s03-" + p + "-fi", D[p].fi, at);
            countUp("s03-" + p + "-ef", D[p].ef, at + 0.15);
            countUp("s03-" + p + "-td", D[p].td, at + 0.3);
            tl.fromTo("#s03-" + p + "-badge", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 1.0);
          }

          // Open
          tl.fromTo("#s03-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#s03-viewport", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
          tl.fromTo("#s03-card", { y: 60, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: -2, duration: 0.7, ease: "power3.out" }, 0.25);
          tl.fromTo("#s03-source", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
          tl.fromTo("#s03-p0", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.set(["#s03-hl-eng", "#s03-hl-out", "#s03-hl-arr"], { scaleX: 0 }, 0);

          // ① English at home (narration 2.84s)
          tl.to("#s03-p0", { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" }, 2.6);
          tl.fromTo("#s03-zoom-outer", { scale: 1 }, { scale: Z, duration: 1.2, ease: "power2.inOut" }, 2.7);
          tl.fromTo("#s03-zoom-inner", { x: 0, y: 0 }, { x: ENG.x, y: ENG.y, duration: 1.2, ease: "power2.inOut" }, 2.7);
          tl.to("#s03-hl-eng", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.7);
          tl.fromTo("#s03-p1", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.3);
          bars("p1", 3.7);

          // ② Born outside Canada (narration 7.10s)
          tl.to("#s03-p1", { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" }, 6.9);
          tl.to("#s03-zoom-inner", { x: OUT.x, y: OUT.y, duration: 0.9, ease: "power2.inOut" }, 6.9);
          tl.to("#s03-hl-out", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 7.7);
          tl.fromTo("#s03-p2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.35);
          bars("p2", 7.7);

          // ③ Recent arrivals (narration 11.54s)
          tl.to("#s03-p2", { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" }, 11.35);
          tl.to("#s03-zoom-inner", { x: ARR.x, y: ARR.y, duration: 0.8, ease: "power2.inOut" }, 11.35);
          tl.to("#s03-hl-arr", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 12.05);
          tl.fromTo("#s03-p3", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 11.75);
          tl.fromTo(
            ["#s03-chip-fi", "#s03-chip-ef", "#s03-chip-td"],
            { opacity: 0, scale: 0.7 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)", stagger: 0.18 },
            12.0,
          );

          // ④ Takeaway (narration 14.90s): pull back to the whole table, all three rows marked.
          tl.to("#s03-p3", { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" }, 14.75);
          tl.to("#s03-zoom-outer", { scale: 1, duration: 1.1, ease: "power2.inOut" }, 14.75);
          tl.to("#s03-zoom-inner", { x: 0, y: 0, duration: 1.1, ease: "power2.inOut" }, 14.75);
          tl.fromTo("#s03-p4", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 15.1);
          tl.fromTo(
            "#s03-p4 .s03-recap div",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.2 },
            15.8,
          );

          // Exit
          tl.to("#s03-scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 20.7);

          window.__timelines["s03-tdsb-language"] = tl;
        })();
      </script>
