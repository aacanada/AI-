<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s01-hook-template">
      <link rel="stylesheet" href="assets/shared.css" />
      <style>
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--bg);
          color: var(--ink);
          font-family: "Pretendard", sans-serif;
        }
        #s01-ghost {
          position: absolute;
          left: 0;
          right: 0;
          top: 300px;
          text-align: center;
          font-family: "Inter", sans-serif;
          font-weight: 800;
          font-size: 360px;
          letter-spacing: -0.04em;
          color: var(--fi);
          opacity: 0.07;
          filter: blur(6px);
          white-space: nowrap;
        }
        #s01-ghost .vs {
          font-size: 160px;
          color: var(--tdsb-ink);
          margin: 0 40px;
        }
        #s01-content {
          position: absolute;
          inset: 0;
          padding: 0 160px 150px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
        }
        #s01-kicker {
          display: flex;
          gap: 14px;
          align-items: center;
          font-size: 34px;
          font-weight: 600;
          color: var(--ink-soft);
        }
        #s01-kicker .dot {
          display: block;
          width: 18px;
          height: 18px;
          border-radius: 50%;
        }
        .s01-line {
          display: flex;
          flex-wrap: wrap;
          gap: 0 28px;
          font-size: 132px;
          font-weight: 800;
          line-height: 1.18;
          letter-spacing: -0.035em;
        }
        #s01-line1 {
          margin-top: 48px;
        }
        .s01-word {
          display: inline-block;
        }
        #s01-eng {
          display: inline-block;
          position: relative;
          isolation: isolate;
          color: var(--red);
        }
        #s01-mark {
          position: absolute;
          left: -8px;
          right: -8px;
          bottom: 14px;
          height: 46px;
          background: var(--marker);
          opacity: 0.85;
          transform-origin: left center;
        }
        #s01-sources {
          margin-top: 64px;
          display: flex;
          gap: 22px;
        }
        .s01-chip {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 16px 28px;
          border-radius: 999px;
          background: var(--paper);
          border: 2px solid #ddd5c6;
          font-size: 32px;
          font-weight: 600;
          color: var(--ink);
        }
        .s01-chip small {
          font-family: "Inter", sans-serif;
          font-size: 26px;
          font-weight: 600;
          color: var(--ink-soft);
        }
      </style>

      <div id="root" data-composition-id="s01-hook" data-width="1920" data-height="1080">
        <div id="s01-ghost"><span>570</span><span class="vs">vs</span><span>533</span></div>

        <div id="s01-content">
          <div id="s01-kicker">
            <span class="dot" style="background: var(--fi)"></span>
            <span class="dot" style="background: var(--ef)"></span>
            <span class="dot" style="background: var(--tdsb)"></span>
            <span>온타리오 불어교육 · 데이터로 보기</span>
          </div>
          <div class="s01-line" id="s01-line1">
            <span class="s01-word">불어</span><span class="s01-word">학교</span><span class="s01-word">다닌</span><span class="s01-word">아이가</span>
          </div>
          <div class="s01-line" id="s01-line2">
            <span class="s01-word"><span id="s01-eng"><span id="s01-mark"></span><span style="position: relative">영어</span></span>를</span><span class="s01-word">더</span><span class="s01-word">잘한다?</span>
          </div>
          <div id="s01-sources">
            <div class="s01-chip">토론토 교육청 TDSB <small>2006–2012</small></div>
            <div class="s01-chip">캐나다 통계청 <small>2000</small></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const N = window.__NARR["s01-hook"], L = N.L, END = N.dur;
          const tl = gsap.timeline({ paused: true });
          const words = gsap.utils.toArray("[data-composition-id='s01-hook'] .s01-word");

          tl.fromTo("#s01-ghost", { opacity: 0, scale: 1.08 }, { opacity: 0.07, scale: 1, duration: 2.4, ease: "power2.out" }, 0);
          tl.fromTo("#s01-ghost", { x: 0 }, { x: -60, duration: END, ease: "none", immediateRender: false }, 0);
          tl.fromTo("#s01-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
          tl.fromTo(
            words,
            { opacity: 0, y: 70, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)", stagger: 0.16 },
            0.5,
          );
          // "영어" lands with the marker sweep under it.
          tl.fromTo("#s01-mark", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 2.0);
          tl.fromTo("#s01-eng", { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 2.0);
          // Second narration line (5.06s): the two sources.
          tl.fromTo(
            ".s01-chip",
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.35 },
            L[1],
          );
          // Exit
          tl.to("#s01-content", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, END - 0.4);
          tl.to("#s01-ghost", { opacity: 0, duration: 0.4 }, END - 0.4);

          window.__timelines["s01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
