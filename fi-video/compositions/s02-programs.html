<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s02-programs-template">
      <link rel="stylesheet" href="assets/shared.css" />
      <style>
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--bg);
          color: var(--ink);
          font-family: "Pretendard", sans-serif;
        }
        #s02-wrap {
          position: absolute;
          inset: 0;
          padding: 0 120px 150px;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        #s02-head {
          display: flex;
          align-items: baseline;
          gap: 28px;
        }
        #s02-title {
          font-size: 80px;
          font-weight: 800;
          letter-spacing: -0.03em;
        }
        #s02-sub {
          font-size: 36px;
          font-weight: 500;
          color: var(--ink-soft);
        }
        #s02-cards {
          margin-top: 56px;
          display: grid;
          grid-template-columns: 1fr 1fr 1.12fr;
          gap: 36px;
          align-items: end;
        }
        .s02-card {
          position: relative;
          background: var(--paper);
          border-radius: 28px;
          padding: 44px 44px 48px;
          box-shadow: 0 18px 40px rgba(60, 45, 20, 0.1);
          border: 2px solid #e6dfd1;
        }
        #s02-fi {
          border-color: var(--fi);
          padding-top: 66px;
          padding-bottom: 70px;
        }
        .s02-tag {
          display: inline-block;
          padding: 8px 20px;
          border-radius: 999px;
          font-family: "Inter", sans-serif;
          font-size: 28px;
          font-weight: 700;
          color: #fff;
        }
        .s02-name {
          margin-top: 22px;
          font-family: "Inter", sans-serif;
          font-size: 44px;
          font-weight: 800;
          letter-spacing: -0.02em;
          white-space: nowrap;
        }
        .s02-ko {
          margin-top: 6px;
          font-size: 32px;
          font-weight: 500;
          color: var(--ink-soft);
        }
        .s02-detail {
          margin-top: 40px;
        }
        .s02-share {
          font-size: 46px;
          font-weight: 700;
        }
        .s02-track {
          margin-top: 26px;
          height: 32px;
          width: 100%;
          border-radius: 16px;
          background: #ece6da;
          overflow: hidden;
        }
        .s02-fill {
          display: block;
          height: 100%;
          border-radius: 13px;
          transform-origin: left center;
        }
        .s02-hours {
          margin-top: 18px;
          display: flex;
          align-items: baseline;
          gap: 12px;
        }
        .s02-num {
          font-family: "Inter", sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 84px;
          font-weight: 800;
          letter-spacing: -0.02em;
        }
        .s02-unit {
          font-size: 32px;
          font-weight: 600;
          color: var(--ink-soft);
        }
        #s02-legend {
          margin-top: 50px;
          align-self: center;
          display: flex;
          align-items: center;
          gap: 40px;
          padding: 18px 40px;
          border-radius: 999px;
          background: var(--paper);
          border: 2px solid #e6dfd1;
          font-size: 30px;
          font-weight: 600;
        }
        #s02-legend .lbl {
          color: var(--ink-soft);
          font-weight: 500;
        }
        .s02-key {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .s02-key i {
          display: block;
          width: 22px;
          height: 22px;
          border-radius: 50%;
        }
      </style>

      <div id="root" data-composition-id="s02-programs" data-width="1920" data-height="1080">
        <div id="s02-wrap">
          <div id="s02-head">
            <div id="s02-title">온타리오의 세 가지 불어교육</div>
            <div id="s02-sub">불어 수업 비중에 따라</div>
          </div>

          <div id="s02-cards">
            <div class="s02-card" id="s02-core">
              <span class="s02-tag" style="background: var(--tdsb-ink)">일반 학교</span>
              <div class="s02-name">Core French</div>
              <div class="s02-ko">코어 프렌치</div>
              <div class="s02-detail" id="s02-core-detail">
                <div class="s02-share">불어 주 40분</div>
                <div class="s02-track"><span class="s02-fill" id="s02-core-fill" style="background: var(--tdsb); width: 100%"></span></div>
                <div class="s02-hours"><span class="s02-num" id="s02-core-num">0</span><span class="s02-unit">시간 누적</span></div>
              </div>
            </div>

            <div class="s02-card" id="s02-ef">
              <span class="s02-tag" style="background: var(--ef)">EF</span>
              <div class="s02-name">Extended French</div>
              <div class="s02-ko">익스텐디드 프렌치</div>
              <div class="s02-detail" id="s02-ef-detail">
                <div class="s02-share">불어 비중 25%</div>
                <div class="s02-track"><span class="s02-fill" id="s02-ef-fill" style="background: var(--ef); width: 100%"></span></div>
                <div class="s02-hours"><span class="s02-num" id="s02-ef-num">0</span><span class="s02-unit">시간 누적</span></div>
              </div>
            </div>

            <div class="s02-card" id="s02-fi">
              <span class="s02-tag" style="background: var(--fi)">FI</span>
              <div class="s02-name">French Immersion</div>
              <div class="s02-ko">프렌치 이머전</div>
              <div class="s02-detail" id="s02-fi-detail">
                <div class="s02-share">불어 50% 이상</div>
                <div class="s02-track"><span class="s02-fill" id="s02-fi-fill" style="background: var(--fi); width: 100%"></span></div>
                <div class="s02-hours"><span class="s02-num" id="s02-fi-num" style="color: var(--fi)">0</span><span class="s02-unit">시간 누적</span></div>
              </div>
            </div>
          </div>

          <div id="s02-legend">
            <span class="lbl">이후 영상 표기</span>
            <span class="s02-key"><i style="background: var(--fi)"></i>FI 이머전</span>
            <span class="s02-key"><i style="background: var(--ef)"></i>EF 익스텐디드</span>
            <span class="s02-key"><i style="background: var(--tdsb)"></i>TDSB 전체(일반학교 중심)</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // VIDEO_BRIEF.md §2 programHours
          const HOURS = { core: 600, ef: 1260, fi: 3800 };
          const MAX = 3800;
          // Narration line starts within this scene (timing.json)
          const N = window.__NARR["s02-programs"], L = N.L, END = N.dur;
          const AT = { core: L[1], ef: L[2], fi: L[3] };

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s02-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
          tl.fromTo(
            ["#s02-core", "#s02-ef", "#s02-fi"],
            { opacity: 0, y: 60, rotation: -1.5 },
            { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "power3.out", stagger: 0.18 },
            0.9,
          );

          ["core", "ef", "fi"].forEach(function (k) {
            const t = AT[k];
            tl.fromTo("#s02-" + k + "-detail", { opacity: 0.18 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, t - 0.1);
            tl.fromTo("#s02-" + k, { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, t);
            tl.fromTo(
              "#s02-" + k + "-fill",
              { scaleX: 0 },
              { scaleX: HOURS[k] / MAX, duration: 1.4, ease: "power2.out" },
              t + 0.6,
            );
            const num = document.getElementById("s02-" + k + "-num");
            const state = { v: 0 };
            tl.fromTo(
              state,
              { v: 0 },
              {
                v: HOURS[k],
                duration: 1.4,
                ease: "power2.out",
                onUpdate: function () {
                  num.textContent = Math.round(state.v).toLocaleString("en-US");
                },
              },
              t + 0.6,
            );
          });

          tl.fromTo("#s02-legend", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, L[3] + 3.5);
          tl.to("#s02-wrap", { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, END - 0.4);

          window.__timelines["s02-programs"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
