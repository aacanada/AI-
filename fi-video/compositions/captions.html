        <div id="cap-s01-1" class="clip cap" data-start="0.500" data-duration="5.310" data-track-index="1"><span>불어로 수업 듣는 아이들이, 오히려 영어 시험을 더 잘 본다면 믿어지시나요?</span></div>
        <div id="cap-s01-2" class="clip cap" data-start="5.810" data-duration="4.387" data-track-index="1"><span>오늘은 토론토 교육청과 캐나다 통계청 자료로 확인해 보겠습니다.</span></div>
        <div id="cap-s02-1" class="clip cap" data-start="11.097" data-duration="3.116" data-track-index="1"><span>온타리오주 학교는 불어 비중에 따라 세 가지로 나뉩니다.</span></div>
        <div id="cap-s02-2" class="clip cap" data-start="14.213" data-duration="4.065" data-track-index="1"><span>일반 학교의 Core French는 주 40분 정도, 누적 600시간.</span></div>

        <div id="cap-s03-3" class="clip cap" data-start="36.359" data-duration="4.570" data-track-index="1"><span>캐나다 밖에서 태어난 학생은 이머전이 7%로 가장 적었습니다.</span></div>

        <div id="cap-s03-5" class="clip cap" data-start="44.819" data-duration="5.200" data-track-index="1"><span>즉, French Immersion은 캐나다 토박이, 영어 가정 아이들이 주로 가는 곳이라는 거죠.</span></div>
        <div id="cap-s04-1" class="clip cap" data-start="50.919" data-duration="2.446" data-track-index="1"><span>흥미로운 건 동아시아계 학생입니다.</span></div>
        <div id="cap-s04-2" class="clip cap" data-start="53.365" data-duration="4.251" data-track-index="1"><span>이머전보다 Extended French 비율이 18%로 가장 높아요.</span></div>

        <div id="cap-s05-4" class="clip cap" data-start="76.502" data-duration="5.470" data-track-index="1"><span>그런데 Extended French는 부모 모두 해외 출생인 비율이 66%.</span></div>

        <div id="cap-s07-1" class="clip cap" data-start="103.717" data-duration="3.467" data-track-index="1"><span>정리하면, 이머전은 캐나다 태생 고소득 가정,</span></div>

        <div id="cap-s07-3" class="clip cap" data-start="111.054" data-duration="2.608" data-track-index="1"><span>두 그룹 모두 성취도가 뛰어납니다.</span></div>

        <div id="cap-s08-4" class="clip cap" data-start="128.329" data-duration="4.393" data-track-index="1"><span>물론 원래 학업 역량이 높은 아이들이 모였다는 점도 함께 봐야 합니다.</span></div>
        <div id="cap-s09-1" class="clip cap" data-start="133.622" data-duration="1.749" data-track-index="1"><span>문제는 입학 타이밍이에요.</span></div>

        <div id="cap-s10-1" class="clip cap" data-start="147.877" data-duration="3.470" data-track-index="1"><span>그래서 추천드리는 루트가 몬트리올을 거치는 겁니다.</span></div>
