        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;

  <body>
    <div

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 6);
        tl.fromTo("#el-02-two-pillars", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 6);
        tl.addLabel("hf:transition:01-hook:02-two-pillars:push-slide", 6);
        tl.to("#el-02-two-pillars", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 11);
        tl.fromTo("#el-03-pcap", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 11);
        tl.addLabel("hf:transition:02-two-pillars:03-pcap:push-slide", 11);
        tl.to("#el-03-pcap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-math-chart", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.addLabel("hf:transition:03-pcap:04-math-chart:crossfade", 18);
        tl.to("#el-04-math-chart", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 26);
        tl.fromTo("#el-05-bilingual", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 26);
        tl.addLabel("hf:transition:04-math-chart:05-bilingual:push-slide", 26);
        tl.to("#el-05-bilingual", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 33);
        tl.fromTo("#el-06-investment", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 33);
        tl.addLabel("hf:transition:05-bilingual:06-investment:push-slide", 33);
        tl.to("#el-06-investment", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 41);
        tl.fromTo("#el-07-verdict", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 41);
        tl.addLabel("hf:transition:06-investment:07-verdict:zoom-through", 41);
        tl.to("#el-07-verdict", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 46);
        tl.fromTo("#el-08-cheapest", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 46);
        tl.addLabel("hf:transition:07-verdict:08-cheapest:crossfade", 46);
        tl.to("#el-08-cheapest", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 53);
        tl.fromTo("#el-09-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 53);
        tl.addLabel("hf:transition:08-cheapest:09-cta:zoom-through", 53);
        tl.to({}, { duration: 58 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
