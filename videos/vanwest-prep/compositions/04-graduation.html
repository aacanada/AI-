<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

@font-face{font-family:Pretendard;font-weight:500;src:url(assets/fonts/Pretendard-Medium.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;src:url(assets/fonts/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:800;src:url(assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(assets/fonts/Pretendard-Black.woff2) format("woff2")}
@font-face{font-family:Yellowtail;font-weight:400;src:url(assets/fonts/Yellowtail-Regular.ttf) format("truetype")}


#s04{position:absolute;inset:0;overflow:hidden;background:#FAF6EF;color:#16324F;font-family:Pretendard,sans-serif}
#s04 *{box-sizing:border-box}
#s04 .bg{position:absolute;inset:0;background:#FAF6EF}
#s04 .grain{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(22,50,79,.07) 1.2px,transparent 1.3px);background-size:9px 9px}
#s04 .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(31,138,153,.20) 0%,rgba(31,138,153,0) 70%)}
#s04 .glow.warm{background:radial-gradient(circle,rgba(232,87,43,.14) 0%,rgba(232,87,43,0) 70%)}
#s04 .ghost{position:absolute;font-weight:900;color:rgba(22,50,79,.07);font-size:300px;letter-spacing:-.04em;white-space:nowrap;line-height:1}
#s04 .stage{position:absolute;inset:0}
#s04 .abs{position:absolute}
#s04 .h{font-weight:900;letter-spacing:-.03em;line-height:1.1}
#s04 .hd{font-weight:800;letter-spacing:-.02em;line-height:1.2}
#s04 .b{font-weight:500;line-height:1.45}
#s04 .l{font-weight:700;letter-spacing:.08em}
#s04 .script{font-family:Yellowtail,cursive;line-height:1.05;white-space:nowrap}
#s04 .sticker{position:absolute;background:#E8572B;color:#fff;font-weight:800;font-size:24px;letter-spacing:.12em;padding:10px 24px;border-radius:99px;white-space:nowrap}
#s04 .chip{position:absolute;background:#FAF6EF;border:3px solid #16324F;border-radius:99px;padding:10px 24px;font-weight:700;font-size:28px;white-space:nowrap;color:#16324F}
#s04 .chip.lake{border-color:#1F8A99;color:#146A77}
#s04 .chip.solid{background:#16324F;color:#FAF6EF}
#s04 .chip.sand{background:#F3C969;border-color:#F3C969}
#s04 .pol{position:absolute;background:#fff;padding:16px 16px 60px;box-shadow:0 20px 44px rgba(22,50,79,.26)}
#s04 .pol .ph{position:relative;width:100%;height:100%;overflow:hidden}
#s04 .pol img,#s04 .ph img{display:block;width:100%;height:100%;object-fit:cover}
#s04 .pol .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:Yellowtail,cursive;font-size:32px;color:#16324F}
#s04 .card{position:absolute;background:#fff;border:3px solid rgba(22,50,79,.14);border-radius:24px;box-shadow:0 12px 30px rgba(22,50,79,.13)}
#s04 .panel{position:absolute;background:rgba(22,50,79,.93);border-radius:28px;color:#FAF6EF}
#s04 .full{position:absolute;inset:0;overflow:hidden}
#s04 .full img{width:100%;height:100%;object-fit:cover;display:block}
#s04 .hlbar{position:absolute;background:#F3C969;height:22px;transform-origin:0 50%}
#s04 .wipe{position:absolute;inset:0;background:#1F8A99;z-index:50}
#s04 .flash{position:absolute;inset:0;background:#FAF6EF;z-index:60;opacity:0}

#s04 .seg{position:absolute;top:0;height:120px;transform-origin:0 50%}
#s04 .sl{position:absolute;top:150px;font-weight:700;font-size:28px;white-space:nowrap}

      </style>
      <div id="s04" data-composition-id="s04" data-width="1920" data-height="1080" data-duration="12.58">
        <div class="bg"></div>
        <div class="grain"></div>

        <div class="stage">

          <div class="sticker" id="s04-st" style="left:120px;top:96px">추천 포인트 02</div>
          <div class="abs hd" id="s04-t" style="left:120px;top:150px;font-size:66px">졸업까지의 시간</div>
          <div class="abs h" id="s04-n" style="left:1500px;top:130px;font-size:120px;color:#146A77;font-variant-numeric:tabular-nums">0</div>
          <div class="abs hd" id="s04-nl" style="left:1500px;top:270px;font-size:30px">BC주 졸업 학점</div>
          <div class="abs" id="s04-bar" style="left:120px;top:400px;width:1680px;height:120px">
            <div class="abs" id="s04-frame" style="inset:0;border:4px solid #16324F;border-radius:18px"></div>
            <div class="seg" id="s04-a" style="left:0;width:840px;background:#1F8A99;border-radius:16px 0 0 16px"></div>
            <div class="seg" id="s04-b" style="left:840px;width:336px;background:#7FB236"></div>
            <div class="seg" id="s04-c" style="left:1176px;width:336px;background:#4E8A1E"></div>
            <div class="seg" id="s04-d" style="left:1512px;width:168px;background:#3A7016;border-radius:0 16px 16px 0"></div>
            <div class="abs h" id="s04-at" style="left:40px;top:26px;font-size:56px;color:#fff">≈ 40</div>
            <div class="sl" id="s04-al" style="left:0;color:#146A77">한국 고1 성적으로 인정</div>
            <div class="sl" id="s04-bl" style="left:860px">1학기 16</div>
            <div class="sl" id="s04-cl" style="left:1196px">2학기 16</div>
            <div class="sl" id="s04-dl" style="left:1520px">3학기</div>
          </div>
          <div class="abs h" id="s04-k" style="left:120px;top:680px;font-size:88px">계산상 <span style="color:#3A7016">3학기</span>면 졸업 요건 충족</div>
        </div>
      </div>
      <script>
        (function () {
          const root = document.getElementById("s04");
          const D = 12.58;
          const R = [0.88, 3.86];

const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const tl=gsap.timeline({paused:true});
function inn(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,x:o.x||0,y:(o.y===undefined?30:o.y),scale:(o.s===undefined?1:o.s),rotation:(o.r0===undefined?(o.r||0):o.r0)},
  {opacity:1,x:0,y:0,scale:1,rotation:o.r||0,duration:o.d||0.6,ease:o.e||'power3.out'},at);}
function outt(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.to(el,{opacity:0,y:o.y||0,x:o.x||0,scale:(o.s===undefined?1:o.s),duration:o.d||0.45,ease:'power2.in'},at);}
function pol(el,at,rot){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,y:-180,rotation:rot*2.4,scale:1.06},{opacity:1,y:0,rotation:rot,scale:1,duration:0.85,ease:'power3.out'},at);}
function kb(el,at,dur,a,b){if(typeof el==='string')el=q(el);a=a||{};b=b||{};
  tl.fromTo(el,{scale:a.s||1,xPercent:a.x||0,yPercent:a.y||0},{scale:b.s||1.07,xPercent:b.x||0,yPercent:b.y||0,duration:dur,ease:'none'},at);}
function count(el,from,to,at,dur,fmt){if(typeof el==='string')el=q(el);const st={v:from};
  tl.fromTo(st,{v:from},{v:to,duration:dur,ease:'power2.out',immediateRender:false,onUpdate:()=>{el.textContent=fmt(st.v);}},at);}
function grow(el,at,d,origin){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{scaleX:0,opacity:0,transformOrigin:origin||'0% 50%'},{scaleX:1,opacity:1,duration:d||0.8,ease:'power3.inOut'},at);}
function draw(path,at,d){if(typeof path==='string')path=q(path);const L=path.getTotalLength();
  path.style.strokeDasharray=L;tl.fromTo(path,{opacity:0},{opacity:1,duration:0.05},at);tl.fromTo(path,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||1,ease:'power2.inOut'},at);}
function ambient(){
  qa('.ghost').forEach((g,i)=>tl.fromTo(g,{x:0},{x:(i%2?160:-160),duration:D,ease:'none'},0));
  qa('.glow').forEach((g,i)=>{const c=4+i;const n=Math.max(0,Math.floor(D/c)-1);
    tl.fromTo(g,{scale:0.92},{scale:1.08,duration:c/2,ease:'sine.inOut',yoyo:true,repeat:n},0);});
  tl.fromTo(q('.stage'),{opacity:0},{opacity:1,duration:0.45,ease:'power1.out'},0);
  tl.fromTo(q('.stage'),{scale:1,transformOrigin:'50% 45%'},{scale:1.03,duration:D,ease:'none'},0);
  if(q('.wipe'))tl.fromTo(q('.wipe'),{xPercent:0},{xPercent:-101,duration:0.75,ease:'power3.inOut'},0.05);
  tl.to(q('.stage'),{opacity:0,duration:0.5,ease:'power1.in'},D-0.55);
}

const M={"40": 5.28, "16": 8.44, "three": 9.88};

inn('#s04-st',R[0]-0.3,{r0:-14,r:-4,s:0.6,y:0});inn('#s04-t',R[0],{y:24});
inn('#s04-frame',R[0]+0.4,{y:0,s:0.98});inn('#s04-n',R[0]+0.4,{y:20});count('#s04-n',0,80,R[0]+0.6,1.6,v=>Math.round(v));inn('#s04-nl',R[0]+1.0,{y:10});
grow('#s04-a',M['40']-0.2,0.9);inn('#s04-at',M['40']+0.5,{y:10});inn('#s04-al',M['40']+0.6,{y:10});
grow('#s04-b',M['16'],0.6);inn('#s04-bl',M['16']+0.3,{y:10});
grow('#s04-c',M['16']+0.8,0.6);inn('#s04-cl',M['16']+1.1,{y:10});
grow('#s04-d',M.three-0.2,0.6);inn('#s04-dl',M.three+0.1,{y:10});
inn('#s04-k',M.three+0.6,{y:30});

          ambient();
          window.__timelines["s04"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
