#s05 .res{position:absolute;font-weight:900;font-size:56px;white-space:nowrap}

      </style>

          <div class="abs hd" id="s05-t" style="left:120px;top:92px;font-size:66px">ESL이 정규 과목 자리를 차지하면</div>
          <div class="rl" id="s05-la" style="top:290px"><div class="k">한 학기 4과목</div><div class="v">영어 준비가<br />된 경우</div></div>
          <div class="rl" id="s05-lb" style="top:590px"><div class="k">레벨에 따라</div><div class="v">ESL을<br />들어야 하는 경우</div></div>
          <div class="sem" id="s05-a0" style="left:520px;top:260px"><div class="slot" style="top:0px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div><div class="slot" style="top:52px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div><div class="slot" style="top:104px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div><div class="slot" style="top:156px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div></div>

          <div class="sem" id="s05-b3" style="left:1240px;top:560px"><div class="slot" style="top:0px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div><div class="slot" style="top:52px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div><div class="slot" style="top:104px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div><div class="slot" style="top:156px"><span class="sa">정규 과목</span><span class="sb">ESL</span></div></div>

          <div class="abs l" id="s05-yrl" style="left:520px;top:800px;font-size:24px;color:#E8572B">최대 1년 · ESL 2과목</div>

      <script>
        (function () {
          const root = document.getElementById("s05");
          const D = 18.7;
          const R = [0.9, 7.74];

const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const tl=gsap.timeline({paused:true});
function inn(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,x:o.x||0,y:(o.y===undefined?30:o.y),scale:(o.s===undefined?1:o.s),rotation:(o.r0===undefined?(o.r||0):o.r0)},
  {opacity:1,x:0,y:0,scale:1,rotation:o.r||0,duration:o.d||0.6,ease:o.e||'power3.out'},at);}
function outt(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.to(el,{opacity:0,y:o.y||0,x:o.x||0,scale:(o.s===undefined?1:o.s),duration:o.d||0.45,ease:'power2.in'},at);}
function pol(el,at,rot){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,y:-180,rotation:rot*2.4,scale:1.06},{opacity:1,y:0,rotation:rot,scale:1,duration:0.85,ease:'power3.out'},at);}
function kb(el,at,dur,a,b){if(typeof el==='string')el=q(el);a=a||{};b=b||{};
  tl.fromTo(el,{scale:a.s||1,xPercent:a.x||0,yPercent:a.y||0},{scale:b.s||1.07,xPercent:b.x||0,yPercent:b.y||0,duration:dur,ease:'none'},at);}
function count(el,from,to,at,dur,fmt){if(typeof el==='string')el=q(el);const st={v:from};
  tl.fromTo(st,{v:from},{v:to,duration:dur,ease:'power2.out',immediateRender:false,onUpdate:()=>{el.textContent=fmt(st.v);}},at);}
function grow(el,at,d,origin){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{scaleX:0,opacity:0,transformOrigin:origin||'0% 50%'},{scaleX:1,opacity:1,duration:d||0.8,ease:'power3.inOut'},at);}
function draw(path,at,d){if(typeof path==='string')path=q(path);const L=path.getTotalLength();
  path.style.strokeDasharray=L;tl.fromTo(path,{opacity:0},{opacity:1,duration:0.05},at);tl.fromTo(path,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||1,ease:'power2.inOut'},at);}
function ambient(){
  qa('.ghost').forEach((g,i)=>tl.fromTo(g,{x:0},{x:(i%2?160:-160),duration:D,ease:'none'},0));
  qa('.glow').forEach((g,i)=>{const c=4+i;const n=Math.max(0,Math.floor(D/c)-1);
    tl.fromTo(g,{scale:0.92},{scale:1.08,duration:c/2,ease:'sine.inOut',yoyo:true,repeat:n},0);});
  tl.fromTo(q('.stage'),{opacity:0},{opacity:1,duration:0.45,ease:'power1.out'},0);
  tl.fromTo(q('.stage'),{scale:1,transformOrigin:'50% 45%'},{scale:1.03,duration:D,ease:'none'},0);
  if(q('.wipe'))tl.fromTo(q('.wipe'),{xPercent:0},{xPercent:-101,duration:0.75,ease:'power3.inOut'},0.05);
  tl.to(q('.stage'),{opacity:0,duration:0.5,ease:'power1.in'},D-0.55);
}

const M={"esl": 3.74, "lvl": 7.74, "three": 13.68, "two": 15.4};

inn('#s05-t',R[0]-0.2,{y:24});
inn('#s05-la',R[0]+0.6,{x:-30,y:0});
['#s05-a0','#s05-a1','#s05-a2'].forEach((s,i)=>inn(s,R[0]+0.9+i*0.25,{y:30}));
inn('#s05-lb',M.esl-0.4,{x:-30,y:0});
inn('#s05-b0',M.esl-0.2,{y:30});
const e0=qa('#s05-b0 .slot.esl');
function flip(el,at){tl.to(el,{backgroundColor:'#E8572B',duration:0.3},at);tl.to(el.querySelector('.sa'),{opacity:0,duration:0.2},at);tl.to(el.querySelector('.sb'),{opacity:1,duration:0.2},at+0.1);}
flip(e0[0],M.esl+0.3);
['#s05-b1','#s05-b2','#s05-b3'].forEach((s,i)=>inn(s,M.lvl+i*0.3,{y:30}));
qa('#s05-b0 .slot.esl,#s05-b1 .slot.esl').forEach((el,i)=>{if(el!==e0[0])flip(el,M.lvl+1.4+i*0.25);});
grow('#s05-yr',M.lvl+2.4,0.8);inn('#s05-yrl',M.lvl+2.8,{y:10});
inn('#s05-ra',M.three,{x:-30,y:0});
inn('#s05-rb',M.two,{x:-30,y:0});

          ambient();
          window.__timelines["s05"] = tl;
        })();
      </script>
