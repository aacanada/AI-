<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

@font-face{font-family:Pretendard;font-weight:500;src:url(assets/fonts/Pretendard-Medium.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;src:url(assets/fonts/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:800;src:url(assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(assets/fonts/Pretendard-Black.woff2) format("woff2")}
@font-face{font-family:Yellowtail;font-weight:400;src:url(assets/fonts/Yellowtail-Regular.ttf) format("truetype")}


#s13{position:absolute;inset:0;overflow:hidden;background:#FAF6EF;color:#16324F;font-family:Pretendard,sans-serif}
#s13 *{box-sizing:border-box}
#s13 .bg{position:absolute;inset:0;background:#FAF6EF}
#s13 .grain{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(22,50,79,.07) 1.2px,transparent 1.3px);background-size:9px 9px}
#s13 .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(31,138,153,.20) 0%,rgba(31,138,153,0) 70%)}
#s13 .glow.warm{background:radial-gradient(circle,rgba(232,87,43,.14) 0%,rgba(232,87,43,0) 70%)}
#s13 .ghost{position:absolute;font-weight:900;color:rgba(22,50,79,.07);font-size:300px;letter-spacing:-.04em;white-space:nowrap;line-height:1}
#s13 .stage{position:absolute;inset:0}
#s13 .abs{position:absolute}
#s13 .h{font-weight:900;letter-spacing:-.03em;line-height:1.1}
#s13 .hd{font-weight:800;letter-spacing:-.02em;line-height:1.2}
#s13 .b{font-weight:500;line-height:1.45}
#s13 .l{font-weight:700;letter-spacing:.08em}
#s13 .script{font-family:Yellowtail,cursive;line-height:1.05;white-space:nowrap}
#s13 .sticker{position:absolute;background:#E8572B;color:#fff;font-weight:800;font-size:24px;letter-spacing:.12em;padding:10px 24px;border-radius:99px;white-space:nowrap}
#s13 .chip{position:absolute;background:#FAF6EF;border:3px solid #16324F;border-radius:99px;padding:10px 24px;font-weight:700;font-size:28px;white-space:nowrap;color:#16324F}
#s13 .chip.lake{border-color:#1F8A99;color:#146A77}
#s13 .chip.solid{background:#16324F;color:#FAF6EF}
#s13 .chip.sand{background:#F3C969;border-color:#F3C969}
#s13 .pol{position:absolute;background:#fff;padding:16px 16px 60px;box-shadow:0 20px 44px rgba(22,50,79,.26)}
#s13 .pol .ph{position:relative;width:100%;height:100%;overflow:hidden}
#s13 .pol img,#s13 .ph img{display:block;width:100%;height:100%;object-fit:cover}
#s13 .pol .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:Yellowtail,cursive;font-size:32px;color:#16324F}
#s13 .card{position:absolute;background:#fff;border:3px solid rgba(22,50,79,.14);border-radius:24px;box-shadow:0 12px 30px rgba(22,50,79,.13)}
#s13 .panel{position:absolute;background:rgba(22,50,79,.93);border-radius:28px;color:#FAF6EF}
#s13 .full{position:absolute;inset:0;overflow:hidden}
#s13 .full img{width:100%;height:100%;object-fit:cover;display:block}
#s13 .hlbar{position:absolute;background:#F3C969;height:22px;transform-origin:0 50%}
#s13 .wipe{position:absolute;inset:0;background:#1F8A99;z-index:50}
#s13 .flash{position:absolute;inset:0;background:#FAF6EF;z-index:60;opacity:0}

#s13 .dt{position:absolute;width:30px;height:30px;border-radius:50%}
#s13 .stp{position:absolute;top:330px;width:400px;height:190px;border-radius:26px;color:#fff;padding:32px 34px}
#s13 .stp .k{font-weight:700;font-size:26px;letter-spacing:.06em;opacity:.9}
#s13 .stp .v{font-weight:800;font-size:42px;margin-top:10px;line-height:1.25}
#s13 .uni{position:absolute;left:1580px;width:260px;height:110px;border-radius:22px;background:#FAF6EF;border:4px solid #16324F;text-align:center;font-weight:900;font-size:38px;line-height:102px}

      </style>
      <div id="s13" data-composition-id="s13" data-width="1920" data-height="1080" data-duration="20.24">
        <div class="bg"></div>
        <div class="grain"></div>

        <div class="stage">

          <div class="abs" id="s13-mix" style="left:0;top:0;width:1920px;height:1080px">
            <div class="abs hd" style="left:120px;top:92px;font-size:66px">함께 공부하는 친구들</div>
            <div class="abs" id="s13-dots" style="left:124px;top:260px;width:600px;height:300px"></div>
            <div class="abs hd" style="left:124px;top:560px;font-size:34px"><span style="color:#1F8A99">●</span> 일본 학생 &nbsp; <span style="color:#E8572B">●</span> 한국 학생</div>
            <div class="abs" id="s13-stamp" style="left:960px;top:280px;width:820px;height:260px;border:8px solid #16324F;border-radius:30px;padding:46px 50px">
              <div class="hd" style="font-size:52px;line-height:1.3">학생 수가 적어도<br /><span style="color:#E8572B">약속한 과정은 그대로</span></div></div>
            <div class="pol" id="s13-ph" style="left:1320px;top:590px;width:420px;height:300px"><div class="ph"><img src="assets/photos/62-campus-hallway.jpg" alt="" /></div><div class="cap">VanWest Kelowna</div></div>
          </div>
          <div class="abs" id="s13-road" style="left:0;top:0;width:1920px;height:1080px">
            <div class="abs hd" style="left:120px;top:92px;font-size:66px">큰 그림</div>
          <div class="stp" id="s13-s0" style="left:120px;background:#1F8A99"><div class="k">켈로나</div><div class="v">밴웨스트 영어 준비</div></div>
          <div class="stp" id="s13-s1" style="left:590px;background:#16324F"><div class="k">버논</div><div class="v">공립고 11학년 입학</div></div>
          <div class="stp" id="s13-s2" style="left:1060px;background:#4E8A1E"><div class="k">버논</div><div class="v">12학년 졸업</div></div>
            <svg class="abs" style="left:0;top:0;width:1920px;height:1080px" viewBox="0 0 1920 1080">
              <path id="s13-a0" d="M528 425 H582" stroke="#16324F" stroke-width="8" stroke-linecap="round"/>
              <path id="s13-a1" d="M998 425 H1052" stroke="#16324F" stroke-width="8" stroke-linecap="round"/>
              <path id="s13-f0" d="M1470 425 C 1520 425, 1520 300, 1570 300" fill="none" stroke="#E8572B" stroke-width="8" stroke-linecap="round"/>
              <path id="s13-f1" d="M1470 425 C 1520 425, 1520 560, 1570 560" fill="none" stroke="#E8572B" stroke-width="8" stroke-linecap="round"/>
            </svg>
            <div class="uni" id="s13-u0" style="top:245px">한국 대학</div>
            <div class="uni" id="s13-u1" style="top:505px">영어권 대학</div>
            <div class="abs h" id="s13-k" style="left:120px;top:680px;font-size:72px">영어 기초가 탄탄하면, <span style="color:#146A77">선택의 폭이 넓어집니다</span></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const root = document.getElementById("s13");
          const D = 20.24;
          const R = [0.96, 7.92, 13.9];

const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const tl=gsap.timeline({paused:true});
function inn(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,x:o.x||0,y:(o.y===undefined?30:o.y),scale:(o.s===undefined?1:o.s),rotation:(o.r0===undefined?(o.r||0):o.r0)},
  {opacity:1,x:0,y:0,scale:1,rotation:o.r||0,duration:o.d||0.6,ease:o.e||'power3.out'},at);}
function outt(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.to(el,{opacity:0,y:o.y||0,x:o.x||0,scale:(o.s===undefined?1:o.s),duration:o.d||0.45,ease:'power2.in'},at);}
function pol(el,at,rot){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,y:-180,rotation:rot*2.4,scale:1.06},{opacity:1,y:0,rotation:rot,scale:1,duration:0.85,ease:'power3.out'},at);}
function kb(el,at,dur,a,b){if(typeof el==='string')el=q(el);a=a||{};b=b||{};
  tl.fromTo(el,{scale:a.s||1,xPercent:a.x||0,yPercent:a.y||0},{scale:b.s||1.07,xPercent:b.x||0,yPercent:b.y||0,duration:dur,ease:'none'},at);}
function count(el,from,to,at,dur,fmt){if(typeof el==='string')el=q(el);const st={v:from};
  tl.fromTo(st,{v:from},{v:to,duration:dur,ease:'power2.out',immediateRender:false,onUpdate:()=>{el.textContent=fmt(st.v);}},at);}
function grow(el,at,d,origin){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{scaleX:0,opacity:0,transformOrigin:origin||'0% 50%'},{scaleX:1,opacity:1,duration:d||0.8,ease:'power3.inOut'},at);}
function draw(path,at,d){if(typeof path==='string')path=q(path);const L=path.getTotalLength();
  path.style.strokeDasharray=L;tl.fromTo(path,{opacity:0},{opacity:1,duration:0.05},at);tl.fromTo(path,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||1,ease:'power2.inOut'},at);}
function ambient(){
  qa('.ghost').forEach((g,i)=>tl.fromTo(g,{x:0},{x:(i%2?160:-160),duration:D,ease:'none'},0));
  qa('.glow').forEach((g,i)=>{const c=4+i;const n=Math.max(0,Math.floor(D/c)-1);
    tl.fromTo(g,{scale:0.92},{scale:1.08,duration:c/2,ease:'sine.inOut',yoyo:true,repeat:n},0);});
  tl.fromTo(q('.stage'),{opacity:0},{opacity:1,duration:0.45,ease:'power1.out'},0);
  tl.fromTo(q('.stage'),{scale:1,transformOrigin:'50% 45%'},{scale:1.03,duration:D,ease:'none'},0);
  if(q('.wipe'))tl.fromTo(q('.wipe'),{xPercent:0},{xPercent:-101,duration:0.75,ease:'power3.inOut'},0.05);
  tl.to(q('.stage'),{opacity:0,duration:0.5,ease:'power1.in'},D-0.55);
}

const M={"few": 5.14, "adm": 10.92, "grad": 12.28, "kor": 15.86, "eng": 16.66};

(function(){const g=q('#s13-dots');for(let i=0;i<40;i++){const d=document.createElement('div');d.className='dt';d.style.background=(i%10)<5?'#1F8A99':'#E8572B';d.style.left=(i%10)*58+'px';d.style.top=Math.floor(i/10)*58+'px';g.appendChild(d);}})();
qa('#s13-dots .dt').forEach((d,i)=>tl.fromTo(d,{scale:0},{scale:1,duration:0.3,ease:'back.out(2)'},R[0]+0.3+(i%10)*0.06+Math.floor(i/10)*0.05));
inn('#s13-stamp',M.few-0.4,{s:1.4,y:0,d:0.45,e:'power4.out'});
pol('#s13-ph',M.few+1.2,3);
tl.to('#s13-mix',{opacity:0,duration:0.5},R[1]-0.4);
tl.fromTo('#s13-road',{opacity:0},{opacity:1,duration:0.4},R[1]-0.2);
inn('#s13-s0',R[1],{y:40});
draw('#s13-a0',M.adm-0.6,0.4);inn('#s13-s1',M.adm-0.4,{y:40});
draw('#s13-a1',M.grad-0.6,0.4);inn('#s13-s2',M.grad-0.4,{y:40});
draw('#s13-f0',M.kor-0.4,0.6);inn('#s13-u0',M.kor,{x:-20,y:0});
draw('#s13-f1',M.eng-0.4,0.6);inn('#s13-u1',M.eng,{x:-20,y:0});
inn('#s13-k',M.eng+1.0,{y:24});

          ambient();
          window.__timelines["s13"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
