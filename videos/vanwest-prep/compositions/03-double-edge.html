<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

@font-face{font-family:Pretendard;font-weight:500;src:url(assets/fonts/Pretendard-Medium.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;src:url(assets/fonts/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:800;src:url(assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(assets/fonts/Pretendard-Black.woff2) format("woff2")}
@font-face{font-family:Yellowtail;font-weight:400;src:url(assets/fonts/Yellowtail-Regular.ttf) format("truetype")}


#s03{position:absolute;inset:0;overflow:hidden;background:#FAF6EF;color:#16324F;font-family:Pretendard,sans-serif}
#s03 *{box-sizing:border-box}
#s03 .bg{position:absolute;inset:0;background:#FAF6EF}
#s03 .grain{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(22,50,79,.07) 1.2px,transparent 1.3px);background-size:9px 9px}
#s03 .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(31,138,153,.20) 0%,rgba(31,138,153,0) 70%)}
#s03 .glow.warm{background:radial-gradient(circle,rgba(232,87,43,.14) 0%,rgba(232,87,43,0) 70%)}
#s03 .ghost{position:absolute;font-weight:900;color:rgba(22,50,79,.07);font-size:300px;letter-spacing:-.04em;white-space:nowrap;line-height:1}
#s03 .stage{position:absolute;inset:0}
#s03 .abs{position:absolute}
#s03 .h{font-weight:900;letter-spacing:-.03em;line-height:1.1}
#s03 .hd{font-weight:800;letter-spacing:-.02em;line-height:1.2}
#s03 .b{font-weight:500;line-height:1.45}
#s03 .l{font-weight:700;letter-spacing:.08em}
#s03 .script{font-family:Yellowtail,cursive;line-height:1.05;white-space:nowrap}
#s03 .sticker{position:absolute;background:#E8572B;color:#fff;font-weight:800;font-size:24px;letter-spacing:.12em;padding:10px 24px;border-radius:99px;white-space:nowrap}
#s03 .chip{position:absolute;background:#FAF6EF;border:3px solid #16324F;border-radius:99px;padding:10px 24px;font-weight:700;font-size:28px;white-space:nowrap;color:#16324F}
#s03 .chip.lake{border-color:#1F8A99;color:#146A77}
#s03 .chip.solid{background:#16324F;color:#FAF6EF}
#s03 .chip.sand{background:#F3C969;border-color:#F3C969}
#s03 .pol{position:absolute;background:#fff;padding:16px 16px 60px;box-shadow:0 20px 44px rgba(22,50,79,.26)}
#s03 .pol .ph{position:relative;width:100%;height:100%;overflow:hidden}
#s03 .pol img,#s03 .ph img{display:block;width:100%;height:100%;object-fit:cover}
#s03 .pol .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:Yellowtail,cursive;font-size:32px;color:#16324F}
#s03 .card{position:absolute;background:#fff;border:3px solid rgba(22,50,79,.14);border-radius:24px;box-shadow:0 12px 30px rgba(22,50,79,.13)}
#s03 .panel{position:absolute;background:rgba(22,50,79,.93);border-radius:28px;color:#FAF6EF}
#s03 .full{position:absolute;inset:0;overflow:hidden}
#s03 .full img{width:100%;height:100%;object-fit:cover;display:block}
#s03 .hlbar{position:absolute;background:#F3C969;height:22px;transform-origin:0 50%}
#s03 .wipe{position:absolute;inset:0;background:#1F8A99;z-index:50}
#s03 .flash{position:absolute;inset:0;background:#FAF6EF;z-index:60;opacity:0}

#s03 .pan{position:absolute;top:470px;width:520px;height:190px;border-radius:26px;padding:26px 30px;color:#fff}
#s03 .pan .k{font-weight:700;font-size:24px;letter-spacing:.08em;opacity:.9}
#s03 .pan .v{font-weight:800;font-size:40px;line-height:1.3;margin-top:8px}

      </style>
      <div id="s03" data-composition-id="s03" data-width="1920" data-height="1080" data-duration="15.69">
        <div class="bg"></div>
        <div class="grain"></div>
        <div class="abs" style="inset:0;opacity:.10"><img src="assets/photos/16-classroom-overhead.jpg" alt="" style="width:100%;height:100%;object-fit:cover;filter:blur(16px)" /></div>
        <div class="stage">

          <div class="abs hd" id="s03-t" style="left:120px;top:92px;font-size:66px">장점이자, 숙제</div>
          <div class="abs" id="s03-post" style="left:952px;top:330px;width:16px;height:420px;background:#16324F;border-radius:8px"></div>
          <div class="abs" id="s03-base" style="left:820px;top:740px;width:280px;height:22px;background:#16324F;border-radius:11px"></div>
          <div class="abs" id="s03-beam" style="left:400px;top:318px;width:1120px;height:18px;background:#16324F;border-radius:9px"></div>
          <div class="abs" id="s03-cap" style="left:930px;top:298px;width:60px;height:60px;border-radius:50%;background:#E8572B"></div>
          <div class="pan" id="s03-L" style="left:220px;background:#4E8A1E"><div class="k">MERIT</div><div class="v">영어가 가장 빨리<br />느는 환경</div></div>
          <div class="pan" id="s03-Rp" style="left:1180px;background:#E8572B"><div class="k">CHALLENGE</div><div class="v">준비 없이 가면<br />첫 몇 달은 혼자</div></div>
          <div class="abs" id="s03-w" style="left:760px;top:150px;width:400px;height:120px;border-radius:24px;background:#1F8A99;color:#fff;text-align:center;padding-top:26px"><div class="hd" style="font-size:46px">출발 전 영어 준비</div></div>
          <div class="abs h" id="s03-k" style="left:120px;top:800px;width:1680px;text-align:center;font-size:58px">초기 적응을 <span style="background:linear-gradient(transparent 60%,#F3C969 60%)">좌우합니다</span></div>
        </div>
      </div>
      <script>
        (function () {
          const root = document.getElementById("s03");
          const D = 15.69;
          const R = [1.02, 3.92, 9.6];

const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const tl=gsap.timeline({paused:true});
function inn(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,x:o.x||0,y:(o.y===undefined?30:o.y),scale:(o.s===undefined?1:o.s),rotation:(o.r0===undefined?(o.r||0):o.r0)},
  {opacity:1,x:0,y:0,scale:1,rotation:o.r||0,duration:o.d||0.6,ease:o.e||'power3.out'},at);}
function outt(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.to(el,{opacity:0,y:o.y||0,x:o.x||0,scale:(o.s===undefined?1:o.s),duration:o.d||0.45,ease:'power2.in'},at);}
function pol(el,at,rot){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,y:-180,rotation:rot*2.4,scale:1.06},{opacity:1,y:0,rotation:rot,scale:1,duration:0.85,ease:'power3.out'},at);}
function kb(el,at,dur,a,b){if(typeof el==='string')el=q(el);a=a||{};b=b||{};
  tl.fromTo(el,{scale:a.s||1,xPercent:a.x||0,yPercent:a.y||0},{scale:b.s||1.07,xPercent:b.x||0,yPercent:b.y||0,duration:dur,ease:'none'},at);}
function count(el,from,to,at,dur,fmt){if(typeof el==='string')el=q(el);const st={v:from};
  tl.fromTo(st,{v:from},{v:to,duration:dur,ease:'power2.out',immediateRender:false,onUpdate:()=>{el.textContent=fmt(st.v);}},at);}
function grow(el,at,d,origin){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{scaleX:0,opacity:0,transformOrigin:origin||'0% 50%'},{scaleX:1,opacity:1,duration:d||0.8,ease:'power3.inOut'},at);}
function draw(path,at,d){if(typeof path==='string')path=q(path);const L=path.getTotalLength();
  path.style.strokeDasharray=L;tl.fromTo(path,{opacity:0},{opacity:1,duration:0.05},at);tl.fromTo(path,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||1,ease:'power2.inOut'},at);}
function ambient(){
  qa('.ghost').forEach((g,i)=>tl.fromTo(g,{x:0},{x:(i%2?160:-160),duration:D,ease:'none'},0));
  qa('.glow').forEach((g,i)=>{const c=4+i;const n=Math.max(0,Math.floor(D/c)-1);
    tl.fromTo(g,{scale:0.92},{scale:1.08,duration:c/2,ease:'sine.inOut',yoyo:true,repeat:n},0);});
  tl.fromTo(q('.stage'),{opacity:0},{opacity:1,duration:0.45,ease:'power1.out'},0);
  tl.fromTo(q('.stage'),{scale:1,transformOrigin:'50% 45%'},{scale:1.03,duration:D,ease:'none'},0);
  if(q('.wipe'))tl.fromTo(q('.wipe'),{xPercent:0},{xPercent:-101,duration:0.75,ease:'power3.inOut'},0.05);
  tl.to(q('.stage'),{opacity:0,duration:0.5,ease:'power1.in'},D-0.55);
}

const M={"alone": 8.24};

const L=560;function tilt(deg,at,d){const r=deg*Math.PI/180;
  tl.to('#s03-beam',{rotation:deg,transformOrigin:'50% 50%',duration:d,ease:'power2.inOut'},at);
  tl.to('#s03-L',{y:-Math.sin(r)*L,duration:d,ease:'power2.inOut'},at);
  tl.to('#s03-Rp',{y:Math.sin(r)*L,duration:d,ease:'power2.inOut'},at);}
inn('#s03-t',R[0]-0.2,{y:24});
inn(['#s03-post','#s03-base','#s03-beam','#s03-cap'],R[0],{y:30});
inn('#s03-L',R[0]+0.6,{y:-60});
tilt(-7,R[0]+1.0,0.9);
inn('#s03-Rp',R[1],{y:-60});
tilt(9,M.alone-0.6,1.0);
inn('#s03-w',R[2],{y:-120,d:0.7,e:'bounce.out'});
tilt(0,R[2]+0.6,1.0);
inn('#s03-k',R[2]+2.0,{y:24});

          ambient();
          window.__timelines["s03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
