<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SGA Thumbnail</title>
<style>
@font-face{font-family:Pretendard;font-weight:800;src:url(../assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(../assets/fonts/Pretendard-Black.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#14254a;font-family:Pretendard,sans-serif}
.ph{position:absolute;inset:0}
.ph img{width:100%;height:100%;object-fit:cover;object-position:60% 40%;filter:brightness(.4) saturate(.8)}
.grad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,37,74,.97) 0%,rgba(20,37,74,.88) 38%,rgba(20,37,74,.25) 72%,rgba(20,37,74,0) 100%)}
.brand{position:absolute;left:56px;top:44px;color:rgba(255,255,255,.92);font-weight:800;font-size:26px;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.brand i{display:block;width:13px;height:13px;border-radius:50%;background:#c8102e;box-shadow:19px 0 0 #e8b931;margin-right:18px}
.t{position:absolute;left:52px;top:150px;color:#fff;font-weight:900;font-size:108px;line-height:1.12;letter-spacing:-.035em;text-shadow:0 6px 24px rgba(0,0,0,.45)}
.t .r{color:#ff3b4f}
.pill{position:absolute;left:56px;top:452px;background:#e8b931;color:#14254a;font-weight:900;font-size:38px;padding:14px 32px;border-radius:99px}
.crest{position:absolute;right:46px;top:514px;width:150px;height:170px}
.crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
.sub{position:absolute;left:58px;top:560px;color:rgba(255,255,255,.85);font-weight:800;font-size:30px}
</style>
</head>
<body>
<div class="ph"><img src="../assets/photos/grad-04-2025-group.jpg" alt="" /></div>
<div class="grad"></div>
<div class="brand"><i></i>AA CANADA · 토론토 조기유학</div>
<div class="t">공립 보냈다가<br /><span class="r">후회</span>하는 이유</div>
<div class="pill">2주마다 성적표 오는 토론토 사립고</div>
<div class="sub">노스욕 St. George Academy</div>
<div class="crest"><img src="../assets/photos/logo-crest.png" alt="" /></div>
</body>
</html>
