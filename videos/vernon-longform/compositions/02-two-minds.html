<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

@font-face{font-family:Pretendard;font-weight:500;src:url(assets/fonts/Pretendard-Medium.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;src:url(assets/fonts/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:800;src:url(assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(assets/fonts/Pretendard-Black.woff2) format("woff2")}
@font-face{font-family:Yellowtail;font-weight:400;src:url(assets/fonts/Yellowtail-Regular.ttf) format("truetype")}


#s02{position:absolute;inset:0;overflow:hidden;background:#FAF6EF;color:#16324F;font-family:Pretendard,sans-serif}
#s02 *{box-sizing:border-box}
#s02 .bg{position:absolute;inset:0;background:#FAF6EF}

#s02 .glow.warm{background:radial-gradient(circle,rgba(232,87,43,.14) 0%,rgba(232,87,43,0) 70%)}
#s02 .ghost{position:absolute;font-weight:900;color:rgba(22,50,79,.07);font-size:300px;letter-spacing:-.04em;white-space:nowrap;line-height:1}
#s02 .stage{position:absolute;inset:0}
#s02 .abs{position:absolute}
#s02 .h{font-weight:900;letter-spacing:-.03em;line-height:1.1}
#s02 .hd{font-weight:800;letter-spacing:-.02em;line-height:1.2}

#s02 .script{font-family:Yellowtail,cursive;line-height:1.05;white-space:nowrap}
#s02 .sticker{position:absolute;background:#E8572B;color:#fff;font-weight:800;font-size:24px;letter-spacing:.12em;padding:10px 24px;border-radius:99px;white-space:nowrap}
#s02 .chip{position:absolute;background:#FAF6EF;border:3px solid #16324F;border-radius:99px;padding:10px 24px;font-weight:700;font-size:28px;white-space:nowrap;color:#16324F}
#s02 .chip.lake{border-color:#1F8A99;color:#146A77}
#s02 .chip.solid{background:#16324F;color:#FAF6EF}
#s02 .chip.sand{background:#F3C969;border-color:#F3C969}
#s02 .pol{position:absolute;background:#fff;padding:16px 16px 60px;box-shadow:0 20px 44px rgba(22,50,79,.26)}
#s02 .pol .ph{position:relative;width:100%;height:100%;overflow:hidden}
#s02 .pol img,#s02 .ph img{display:block;width:100%;height:100%;object-fit:cover}
#s02 .pol .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:Yellowtail,cursive;font-size:32px;color:#16324F}
#s02 .card{position:absolute;background:#fff;border:3px solid rgba(22,50,79,.14);border-radius:24px;box-shadow:0 12px 30px rgba(22,50,79,.13)}
#s02 .panel{position:absolute;background:rgba(22,50,79,.93);border-radius:28px;color:#FAF6EF}
#s02 .full{position:absolute;inset:0;overflow:hidden}
#s02 .full img{width:100%;height:100%;object-fit:cover;display:block}
#s02 .hlbar{position:absolute;background:#F3C969;height:22px;transform-origin:0 50%}
#s02 .wipe{position:absolute;inset:0;background:#1F8A99;z-index:50}
#s02 .flash{position:absolute;inset:0;background:#FAF6EF;z-index:60;opacity:0}

      </style>
      <div id="s02" data-composition-id="s02" data-width="1920" data-height="1080" data-duration="22.44">
        <div class="bg"></div>
        <div class="grain"></div>
        <div class="glow" style="left:620px;top:200px;width:700px;height:700px"></div>
        <div class="stage">

          <div class="abs hd" id="s02-t" style="left:120px;top:92px;font-size:68px">부모님의 두 마음</div>
          <div class="pol" id="s02-a" style="left:150px;top:200px;width:500px;height:590px"><div class="ph"><img src="assets/photos/18-students-lockers.jpg" alt="" /></div><div class="cap">like a Canadian kid</div></div>
          <div class="abs hd" id="s02-al" style="left:170px;top:820px;font-size:44px">캐나다 아이처럼</div>
          <div class="chip lake" id="s02-ac1" style="left:690px;top:300px">현지 친구들과</div>
          <div class="chip lake" id="s02-ac2" style="left:690px;top:380px">부대끼며 자라는 유학</div>
          <div class="pol" id="s02-b" style="left:1270px;top:200px;width:500px;height:590px"><div class="ph"><img src="assets/photos/17-classroom-writing.jpg" alt="" /></div><div class="cap">a great university</div></div>
          <div class="abs hd" id="s02-bl" style="left:1290px;top:820px;font-size:44px">좋은 대학</div>
          <svg class="abs" id="s02-arrow" style="left:680px;top:430px;width:560px;height:280px" viewBox="0 0 560 280">
            <path id="s02-c1" d="M10 40 C 200 40, 230 140, 470 140" fill="none" stroke="#1F8A99" stroke-width="10" stroke-linecap="round"/>
            <path id="s02-c2" d="M10 240 C 200 240, 230 140, 470 140" fill="none" stroke="#1F8A99" stroke-width="10" stroke-linecap="round"/>
            <path id="s02-c3" d="M440 108 L500 140 L440 172" fill="none" stroke="#1F8A99" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="abs l" id="s02-same" style="left:760px;top:720px;width:400px;text-align:center;font-size:34px;color:#146A77">같은 방향</div>
        </div>
      </div>
      <script>
        (function () {
          const root = document.getElementById("s02");
          const D = 22.44;
          const R = [0.94, 4.66, 8.38, 13.4, 17.2];

const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const tl=gsap.timeline({paused:true});
function inn(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,x:o.x||0,y:(o.y===undefined?30:o.y),scale:(o.s===undefined?1:o.s),rotation:(o.r0===undefined?(o.r||0):o.r0)},
  {opacity:1,x:0,y:0,scale:1,rotation:o.r||0,duration:o.d||0.6,ease:o.e||'power3.out'},at);}
function outt(el,at,o){o=o||{};if(typeof el==='string')el=q(el);
  tl.to(el,{opacity:0,y:o.y||0,x:o.x||0,scale:(o.s===undefined?1:o.s),duration:o.d||0.45,ease:'power2.in'},at);}
function pol(el,at,rot){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{opacity:0,y:-180,rotation:rot*2.4,scale:1.06},{opacity:1,y:0,rotation:rot,scale:1,duration:0.85,ease:'power3.out'},at);}
function kb(el,at,dur,a,b){if(typeof el==='string')el=q(el);a=a||{};b=b||{};
  tl.fromTo(el,{scale:a.s||1,xPercent:a.x||0,yPercent:a.y||0},{scale:b.s||1.07,xPercent:b.x||0,yPercent:b.y||0,duration:dur,ease:'none'},at);}
function count(el,from,to,at,dur,fmt){if(typeof el==='string')el=q(el);const st={v:from};
  tl.fromTo(st,{v:from},{v:to,duration:dur,ease:'power2.out',immediateRender:false,onUpdate:()=>{el.textContent=fmt(st.v);}},at);}
function grow(el,at,d,origin){if(typeof el==='string')el=q(el);
  tl.fromTo(el,{scaleX:0,opacity:0,transformOrigin:origin||'0% 50%'},{scaleX:1,opacity:1,duration:d||0.8,ease:'power3.inOut'},at);}
function draw(path,at,d){if(typeof path==='string')path=q(path);const L=path.getTotalLength();
  path.style.strokeDasharray=L;tl.fromTo(path,{strokeDashoffset:L},{strokeDashoffset:0,duration:d||1,ease:'power2.inOut'},at);}
function ambient(){
  qa('.ghost').forEach((g,i)=>tl.fromTo(g,{x:0},{x:(i%2?160:-160),duration:D,ease:'none'},0));
  qa('.glow').forEach((g,i)=>{const c=4+i;const n=Math.max(0,Math.floor(D/c)-1);
    tl.fromTo(g,{scale:0.92},{scale:1.08,duration:c/2,ease:'sine.inOut',yoyo:true,repeat:n},0);});
  tl.fromTo(q('.stage'),{opacity:0},{opacity:1,duration:0.45,ease:'power1.out'},0);
  tl.fromTo(q('.stage'),{scale:1,transformOrigin:'50% 45%'},{scale:1.03,duration:D,ease:'none'},0);
  if(q('.wipe'))tl.fromTo(q('.wipe'),{xPercent:0},{xPercent:-101,duration:0.75,ease:'power3.inOut'},0.05);
  tl.to(q('.stage'),{opacity:0,duration:0.5,ease:'power1.in'},D-0.55);
}


inn('#s02-t',R[0],{y:30});
pol('#s02-a',R[1],-6);inn('#s02-al',R[1]+0.6,{y:16});
inn('#s02-ac1',R[2],{x:-30,y:0});inn('#s02-ac2',R[2]+0.5,{x:-30,y:0});
outt(['#s02-ac1','#s02-ac2'],R[3]-0.3);
pol('#s02-b',R[3],5);inn('#s02-bl',R[3]+0.6,{y:16});
draw('#s02-c1',R[4],1.1);draw('#s02-c2',R[4]+0.1,1.1);draw('#s02-c3',R[4]+1.1,0.4);
inn('#s02-same',R[4]+1.4,{y:16});
tl.to('#s02-a',{x:40,duration:1.2,ease:'power2.inOut'},R[4]+0.3);tl.to('#s02-b',{x:-40,duration:1.2,ease:'power2.inOut'},R[4]+0.3);

          ambient();
          window.__timelines["s02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
