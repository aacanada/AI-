<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>


      <style>
        #s01-root { position: absolute; inset: 0; }
        #s01-root .cal { position: absolute; left: 150px; top: 200px; width: 820px; padding: 34px 38px 40px; }
        #s01-root .cal .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
        #s01-root .cal .hd b { font-size: 40px; font-weight: 900; letter-spacing: -0.03em; }
        #s01-root .cal .hd .cnt { font-size: 56px; font-weight: 900; color: var(--red); min-width: 220px; text-align: right; }
        #s01-root .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        #s01-root .m { height: 82px; border-radius: 14px; background: #f1e7d6; position: relative; overflow: hidden; font-size: 22px; font-weight: 800; color: #a8977f; display: flex; align-items: flex-end; padding: 8px 12px; }
        #s01-root .m i { position: absolute; inset: 0; background: var(--red); opacity: 0; }
        #s01-root .m span { position: relative; }
        #s01-root .qcard { position: absolute; left: 1040px; top: 270px; width: 760px; padding: 44px 50px; }
        #s01-root .qcard .cup { width: 92px; height: 92px; }
        #s01-root .qcard .q { margin-top: 18px; font-size: 54px; font-weight: 900; line-height: 1.3; letter-spacing: -0.035em; }
        #s01-root .qmark { position: absolute; left: 1580px; top: 150px; font-size: 230px; font-weight: 900; color: var(--red); line-height: 1; }
        #s01-root .three { position: absolute; left: 0; right: 0; top: 230px; display: flex; justify-content: center; gap: 36px; }
        #s01-root .chip { padding: 26px 48px; font-size: 52px; font-weight: 900; letter-spacing: -0.03em; }
        #s01-root .chip.r { background: var(--red); color: #fff; }
        #s01-root .eceT { position: absolute; left: 0; right: 0; top: 430px; display: flex; justify-content: center; align-items: flex-end; gap: 22px; }
        #s01-root .blk { width: 190px; height: 190px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 130px; font-weight: 900; color: #fff;
          box-shadow: inset 0 -12px 0 rgba(0,0,0,0.14), 0 16px 30px rgba(80,50,20,0.18); }
        #s01-root .b1 { background: var(--red); } #s01-root .b2 { background: #e3a21a; } #s01-root .b3 { background: #2f8f5b; }
        #s01-root .eceSub { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-size: 64px; font-weight: 900; letter-spacing: -0.03em; }
        #s01-root .crayon { position: absolute; left: 1430px; top: 420px; width: 120px; }
        #s01-root .vs { position: absolute; left: 0; right: 0; top: 250px; display: flex; justify-content: center; align-items: center; gap: 60px; }
        #s01-root .side { width: 640px; height: 300px; padding: 40px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        #s01-root .side .t { font-size: 66px; font-weight: 900; letter-spacing: -0.04em; }
        #s01-root .side .s { margin-top: 14px; font-size: 38px; font-weight: 800; color: var(--muted); }
        #s01-root .side.p2 { border: 5px solid var(--red); }
        #s01-root .side.p2 .t { color: var(--red); }
        #s01-root .vsT { font-size: 110px; font-weight: 900; color: var(--ink); font-style: italic; }
        #s01-root .eight { position: absolute; left: 0; right: 0; top: 620px; display: flex; justify-content: center; align-items: center; gap: 18px; }
        #s01-root .eight .lb { font-size: 46px; font-weight: 900; margin-right: 16px; }
        #s01-root .eight .d { width: 70px; height: 70px; border-radius: 50%; background: var(--paper); border: 5px solid var(--red); color: var(--red); font-size: 34px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
      </style>
      <div id="s01-root" data-composition-id="s01" data-width="1920" data-height="1080">
        <div class="stage">
          <div class="g1">
            <div class="cal card">
              <div class="hd"><b>워킹홀리데이</b><span class="cnt">0개월</span></div>
              <div class="grid"></div>
            </div>
            <div class="qcard card">
              <svg class="cup" viewBox="0 0 24 24"><path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8zm12 2h2a2 2 0 0 1 0 4h-2" stroke="#2a221d" stroke-width="2" fill="none"/><path d="M8 3v3M12 3v3" stroke="#c8102e" stroke-width="2" stroke-linecap="round"/></svg>
              <div class="q">“워홀 끝나면<br />나한테 <span class="red">뭐가 남지?</span>”</div>
            </div>
            <div class="qmark">?</div>
          </div>
          <div class="three"><div class="chip card c1">자격증</div><div class="chip card c2">경력</div><div class="chip r card c3">영주권 가능성</div></div>
          <div class="eceT"><div class="blk b1">E</div><div class="blk b2">C</div><div class="blk b3">E</div></div>
          <svg class="crayon" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="40" y="8" width="20" height="70" rx="4" fill="#c8102e"/><path d="M40 78 L60 78 L50 96 Z" fill="#e8b4a0"/><path d="M46 88 L54 88 L50 96 Z" fill="#c8102e"/><rect x="40" y="20" width="20" height="8" fill="#9e0c24"/></g></svg>
          <div class="eceSub">바로 <span class="hl"><span class="hl-bg"></span>유아교육</span>, ECE</div>
          <div class="vs">
            <div class="side card p1"><div class="t">공립 컬리지</div><div class="s">안정성</div></div>
            <div class="vsT">VS</div>
            <div class="side card p2"><div class="t">사립 컬리지</div><div class="s">효율성</div></div>
          </div>
          <div class="eight"><span class="lb">8가지 포인트</span></div>
        </div>
      </div>
      <script>
        (function () {
          const C = {"c0": 1.5667, "cafe": 7.4667, "nam": 12.2333, "today": 13.3333, "cert": 14.7667, "career": 15.7667, "pr": 16.9667, "ece": 21.6667, "two": 23.0, "pub": 25.8, "pri": 26.8333, "eight": 27.9667, "L": [[1.5667, 6.4333], [7.4, 12.5333], [13.3333, 22.3667], [23.0, 30.2667]], "D": 31.6};
      const H = (function () {
        const fmtNum = (v, o) => {
          o = o || {};
          const d = o.dec || 0;
          let s = d ? v.toFixed(d) : Math.round(v).toString();
          if (o.comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return (o.pre || "") + s + (o.suf || "");
        };
        // schematic Canada map (concept diagram): province tiles in a 1600x430 box. returns city coords
        const CANADA = {
          tiles: [["BC", 0, 250, 40], ["AB", 258, 150, 30], ["SK", 416, 140, 30], ["MB", 564, 150, 30], ["ON", 722, 330, 70], ["QC", 1060, 320, 0], ["대서양", 1388, 212, 170]],
          city: { 밴쿠버: [70, 360], 캘거리: [335, 310], 토론토: [960, 385], 몬트리올: [1250, 345] },
          build(el, opts) {
            opts = opts || {};
            let h = '<svg viewBox="0 0 1600 430" width="1600" height="430" style="position:absolute;left:0;top:0;overflow:visible">';
            this.tiles.forEach(([n, x, w, t], i) => {
                const bc = n === "BC" && opts.bc;
                h += '<g class="tile tile-' + i + '"><rect x="' + x + '" y="' + t + '" width="' + w + '" height="' + (410 - t) + '" rx="22" fill="' + (bc ? "#c8102e" : "#efe3cf") + '" stroke="#fffdf8" stroke-width="4"/>' +
                  '<text x="' + (x + w / 2) + '" y="' + (t + 60) + '" text-anchor="middle" font-family="Pretendard" font-size="40" font-weight="900" fill="' + (bc ? "#fff" : "#a8977f") + '">' + n + "</text></g>";
            });
            h += "</svg>";
            el.insertAdjacentHTML("beforeend", h);
          },
        };
        return {
          canada: CANADA,
          // count-up number (seek-safe proxy, text written in onUpdate)
          count(tl, el, from, to, t, d, o) {
            const st = { v: from };
            el.textContent = fmtNum(from, o);
            tl.fromTo(st, { v: from }, { v: to, duration: d || 1.2, ease: "power2.out", onUpdate: () => (el.textContent = fmtNum(st.v, o)) }, t);
            tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: d || 1.2, ease: "power2.out" }, t);
          },
          pop(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.5, ease: o.ease || "back.out(1.8)", stagger: o.stagger || 0 }, t);
          },
          rise(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, y: o.y || 40 }, { opacity: 1, y: 0, duration: o.d || 0.55, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          slideX(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, x: o.x || -80 }, { opacity: 1, x: 0, duration: o.d || 0.6, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          out(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: o.y == null ? -30 : o.y, duration: o.d || 0.4, ease: "power2.in", immediateRender: false, stagger: o.stagger || 0 }, t);
          },
          fadeOut(tl, els, t, d) {
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: d || 0.4, ease: "power1.in", immediateRender: false }, t);
          },
          // marker sweep behind text: element .hl > .hl-bg
          mark(tl, el, t, d) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: "power2.inOut" }, t);
          },
          growX(tl, el, t, d, to) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: to == null ? 1 : to, duration: d || 1, ease: "power3.out" }, t);
          },
          growY(tl, el, t, d) {
            tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: d || 1, ease: "power3.out" }, t);
          },
          stamp(tl, el, t) {
            tl.fromTo(el, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, t);
          },
          // slow ambient breathing, finite repeats within scene duration
          breathe(tl, els, D, o) {
            o = o || {};
            const per = o.per || 3;
            const n = Math.max(1, Math.floor(D / per) - 1);
            tl.fromTo(els, { y: 0, rotation: 0 }, { y: o.y || -14, rotation: o.r || 0, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, 0.1);
          },
          // camera move on a capture: el is the inner image wrapper
          cam(tl, el, t, d, s, x, y) {
            tl.to(el, { scale: s, x: x, y: y, duration: d, ease: "power2.inOut" }, t);
          },
          // capture camera: move/zoom a .shot so a highlight band [x0,y0,x1,y1] (native px) is centred
          camTo(tl, shot, band, natH, s, t, d) {
            const k = 716 / 538, W = 716, HS = 520;
            if (!s) s = Math.max(1.12, Math.min(1.6, (0.94 * 538) / (band[2] - band[0])));
            const cx = ((band[0] + band[2]) / 2) * k, cy = ((band[1] + band[3]) / 2) * k;
            let x = W / 2 - cx * s, y = HS / 2 - cy * s;
            x = Math.min(0, Math.max(W - W * s, x));
            y = Math.min(0, Math.max(Math.min(0, HS - natH * k * s), y));
            const prev = shot.__cam || { scale: 1, x: 0, y: 0 };
            tl.fromTo(shot, { scale: prev.scale, x: prev.x, y: prev.y }, { scale: s, x: x, y: y, duration: d || 1.6, ease: "power2.inOut", immediateRender: !shot.__cam }, t);
            shot.__cam = { scale: s, x: x, y: y };
          },
          // red ring drawn around a highlight band inside a .shot
          ring(tl, shot, band, t) {
            const k = 716 / 538;
            const r = document.createElement("div");
            r.className = "ring";
            r.style.left = band[0] * k - 10 + "px";
            r.style.top = band[1] * k - 8 + "px";
            r.style.width = (band[2] - band[0]) * k + 20 + "px";
            r.style.height = (band[3] - band[1]) * k + 16 + "px";
            shot.appendChild(r);
            tl.fromTo(r, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
            return r;
          },
          draw(tl, path, t, d, len) {
            try { len = Math.ceil(path.getTotalLength()) + 4 || len; } catch (e) {}
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
            tl.fromTo(path, { strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 1, ease: "power2.inOut" }, t);
          },
          sceneIn(tl, root) {
            const k = root.querySelector(".kicker");
            if (k) {
              tl.fromTo(k.querySelector(".k-num"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
              tl.fromTo(k.querySelector(".k-title"), { opacity: 0, x: -20, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.18);
            }
          },
          sceneOut(tl, root, D) {
            const st = root.querySelector(".stage");
            if (st) tl.fromTo(st, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);
          },
        };
      })();

          const R = document.getElementById("s01-root");
          const $ = (s) => R.querySelectorAll(s);
          const $1 = (s) => R.querySelector(s);
          const grid = $1(".grid");
          for (let i = 1; i <= 24; i++) { const d = document.createElement("div"); d.className = "m"; d.innerHTML = "<i></i><span>" + i + "</span>"; grid.appendChild(d); }
          const ei = $1(".eight");
          for (let i = 1; i <= 8; i++) { const d = document.createElement("div"); d.className = "d"; d.textContent = i; ei.appendChild(d); }
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($1(".cal"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
          const cells = $(".m i");
          const fillEnd = C.nam - 0.3;
          const t0 = C.c0 + 0.6;
          tl.fromTo(cells, { opacity: 0 }, { opacity: 1, duration: 0.18, stagger: (fillEnd - t0) / 24 }, t0);
          const cnt = $1(".cnt"); const st = { v: 0 };
          tl.fromTo(st, { v: 0 }, { v: 24, duration: fillEnd - t0 + 0.2, ease: "none", onUpdate: () => (cnt.textContent = Math.round(st.v) + "개월") }, t0);
          tl.fromTo($(".m span"), { color: "#a8977f" }, { color: "#ffffff", duration: 0.18, stagger: (fillEnd - t0) / 24 }, t0 + 0.05);
          tl.fromTo($1(".cal"), { rotation: 0 }, { rotation: -2, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, C.nam);
          tl.fromTo($1(".qcard"), { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, C.cafe - 0.3);
          H.pop(tl, $1(".qmark"), C.nam, { from: 0.2, ease: "back.out(3)" });
          tl.fromTo($1(".qmark"), { rotation: 0 }, { rotation: 12, duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut" }, C.nam + 0.5);
          H.out(tl, $1(".g1"), C.today - 0.5);
          H.pop(tl, $1(".c1"), C.cert - 0.1);
          H.pop(tl, $1(".c2"), C.career - 0.1);
          H.pop(tl, $1(".c3"), C.pr - 0.1);
          // ECE blocks drop and stack
          tl.fromTo($(".blk"), { opacity: 0, y: -420, rotation: (i) => [-25, 18, -12][i] }, { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "bounce.out", stagger: 0.18 }, C.ece - 1.0);
          H.rise(tl, $1(".eceSub"), C.ece - 0.6);
          H.mark(tl, $1(".eceSub .hl-bg"), C.ece - 0.1);
          tl.fromTo($1(".crayon"), { opacity: 0, x: 120, rotation: 30 }, { opacity: 1, x: 0, rotation: 0, duration: 0.7, ease: "back.out(1.6)" }, C.ece);
          H.out(tl, $(".three, .eceT, .eceSub, .crayon"), C.two - 0.5);
          tl.fromTo($1(".p1"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, C.two + 0.1);
          tl.fromTo($1(".p2"), { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, C.two + 0.5);
          H.pop(tl, $1(".vsT"), C.two + 1.0, { from: 2.2 });
          H.rise(tl, $1(".eight .lb"), C.eight - 0.3);
          H.pop(tl, $(".eight .d"), C.eight, { stagger: 0.09 });
          H.sceneOut(tl, R, C.D);
          window.__timelines["s01"] = tl;
        })();
      </script>

    </template>
  </body>
</html>
