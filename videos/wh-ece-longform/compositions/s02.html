<!doctype html>

  <head><meta charset="UTF-8" /></head>
  <body>
    <template>


      <style>

        #s02-root .stat .d { margin-top: 20px; font-size: 40px; font-weight: 800; color: var(--muted); }
        #s02-root .stat .n { margin-top: 10px; display: flex; align-items: baseline; gap: 14px; }
        #s02-root .stat .n b { font-size: 170px; font-weight: 900; color: var(--red); letter-spacing: -0.05em; line-height: 1; transform-origin: left bottom; display: inline-block; }
        #s02-root .stat .n span { font-size: 60px; font-weight: 900; }
        #s02-root .stat .inv { font-size: 40px; font-weight: 800; }
      </style>
      <div id="s02-root" data-composition-id="s02" data-width="1920" data-height="1080">
        <div class="stage">
          <div class="kicker"><span class="k-num">WHY</span><span class="k-title">왜 유아교육인가</span></div>
          <div class="ph1">
            <div class="lead">
              <div class="badge card">
                <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 16.9 6.1 20.1l1.3-6.6L2.5 8.9l6.6-.8z" fill="#fff"/></svg></div>
                <div class="t">한국인들 사이에서<br />캐나다 <span class="hl"><span class="hl-bg"></span>취업률이 가장 높은</span><br />직종 중의 하나</div>
              </div>
              <div class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#c8102e"/></svg>한국인에게 특히 인기</div>
            </div>
            <div class="why">
              <div class="row card w1"><div class="ck">✓</div>데이캐어는 늘 사람이 필요</div>
              <div class="row card w2"><div class="ck">✓</div>자격증만 있으면 바로 일할 수 있음</div>
              <div class="row card w3"><div class="ck">✓</div>영주권과도 연결</div>
            </div>
          </div>
          <div class="ph2">
            <div class="map">
              <svg viewBox="0 0 720 680" width="720" height="680">
                <path class="bcp" d="M70 40 L470 40 L470 300 L640 470 L650 640 L150 640 L120 590 L60 570 L95 520 L30 480 L75 430 L20 380 L70 330 L25 270 L70 220 L35 160 L80 110 Z" fill="#c8102e" />
                <path class="isl" d="M40 560 L110 600 L140 650 L100 660 L30 610 Z" fill="#c8102e" />
              </svg>
              <div class="lbl">BC주</div>
            </div>
            <div class="stat card">
              <div class="k">BC PNP 유아교사 전용 추첨</div>
              <div class="h">주정부 이민 프로그램이<br />유아교사만 따로 뽑습니다</div>
              <div class="d">2026.11.13</div>
              <div class="n"><b>0</b><span>명</span><span class="inv">초청</span></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const C = {"rate": 3.5667, "pop": 8.6667, "need": 11.0, "cert": 13.5667, "pr": 16.1333, "bc": 18.6667, "draw": 23.1667, "date": 25.4, "num": 28.8333, "L": [[0.7667, 10.2667], [11.0, 17.8667], [18.6667, 30.7667]], "D": 32.1};
      const H = (function () {
        const fmtNum = (v, o) => {
          o = o || {};
          const d = o.dec || 0;
          let s = d ? v.toFixed(d) : Math.round(v).toString();
          if (o.comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return (o.pre || "") + s + (o.suf || "");
        };
        // schematic Canada map (concept diagram): province tiles in a 1600x430 box. returns city coords
        const CANADA = {
          tiles: [["BC", 0, 250, 40], ["AB", 258, 150, 30], ["SK", 416, 140, 30], ["MB", 564, 150, 30], ["ON", 722, 330, 70], ["QC", 1060, 320, 0], ["대서양", 1388, 212, 170]],
          city: { 밴쿠버: [70, 360], 캘거리: [335, 310], 토론토: [960, 385], 몬트리올: [1250, 345] },
          build(el, opts) {
            opts = opts || {};
            let h = '<svg viewBox="0 0 1600 430" width="1600" height="430" style="position:absolute;left:0;top:0;overflow:visible">';
            this.tiles.forEach(([n, x, w, t], i) => {
                const bc = n === "BC" && opts.bc;
                h += '<g class="tile tile-' + i + '"><rect x="' + x + '" y="' + t + '" width="' + w + '" height="' + (410 - t) + '" rx="22" fill="' + (bc ? "#c8102e" : "#efe3cf") + '" stroke="#fffdf8" stroke-width="4"/>' +
                  '<text x="' + (x + w / 2) + '" y="' + (t + 60) + '" text-anchor="middle" font-family="Pretendard" font-size="40" font-weight="900" fill="' + (bc ? "#fff" : "#a8977f") + '">' + n + "</text></g>";
            });
            h += "</svg>";
            el.insertAdjacentHTML("beforeend", h);
          },
        };
        return {
          canada: CANADA,
          // count-up number (seek-safe proxy, text written in onUpdate)
          count(tl, el, from, to, t, d, o) {
            const st = { v: from };
            el.textContent = fmtNum(from, o);
            tl.fromTo(st, { v: from }, { v: to, duration: d || 1.2, ease: "power2.out", onUpdate: () => (el.textContent = fmtNum(st.v, o)) }, t);
            tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: d || 1.2, ease: "power2.out" }, t);
          },
          pop(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.5, ease: o.ease || "back.out(1.8)", stagger: o.stagger || 0 }, t);
          },
          rise(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, y: o.y || 40 }, { opacity: 1, y: 0, duration: o.d || 0.55, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          slideX(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, x: o.x || -80 }, { opacity: 1, x: 0, duration: o.d || 0.6, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          out(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: o.y == null ? -30 : o.y, duration: o.d || 0.4, ease: "power2.in", immediateRender: false, stagger: o.stagger || 0 }, t);
          },
          fadeOut(tl, els, t, d) {
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: d || 0.4, ease: "power1.in", immediateRender: false }, t);
          },
          // marker sweep behind text: element .hl > .hl-bg
          mark(tl, el, t, d) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: "power2.inOut" }, t);
          },
          growX(tl, el, t, d, to) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: to == null ? 1 : to, duration: d || 1, ease: "power3.out" }, t);
          },
          growY(tl, el, t, d) {
            tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: d || 1, ease: "power3.out" }, t);
          },
          stamp(tl, el, t) {
            tl.fromTo(el, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, t);
          },
          // slow ambient breathing, finite repeats within scene duration
          breathe(tl, els, D, o) {
            o = o || {};
            const per = o.per || 3;
            const n = Math.max(1, Math.floor(D / per) - 1);
            tl.fromTo(els, { y: 0, rotation: 0 }, { y: o.y || -14, rotation: o.r || 0, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, 0.1);
          },
          // camera move on a capture: el is the inner image wrapper
          cam(tl, el, t, d, s, x, y) {
            tl.to(el, { scale: s, x: x, y: y, duration: d, ease: "power2.inOut" }, t);
          },
          // capture camera: move/zoom a .shot so a highlight band [x0,y0,x1,y1] (native px) is centred
          camTo(tl, shot, band, natH, s, t, d) {
            const k = 716 / 538, W = 716, HS = 520;
            if (!s) s = Math.max(1.12, Math.min(1.6, (0.94 * 538) / (band[2] - band[0])));
            const cx = ((band[0] + band[2]) / 2) * k, cy = ((band[1] + band[3]) / 2) * k;
            let x = W / 2 - cx * s, y = HS / 2 - cy * s;
            x = Math.min(0, Math.max(W - W * s, x));
            y = Math.min(0, Math.max(Math.min(0, HS - natH * k * s), y));
            const prev = shot.__cam || { scale: 1, x: 0, y: 0 };
            tl.fromTo(shot, { scale: prev.scale, x: prev.x, y: prev.y }, { scale: s, x: x, y: y, duration: d || 1.6, ease: "power2.inOut", immediateRender: !shot.__cam }, t);
            shot.__cam = { scale: s, x: x, y: y };
          },
          // red ring drawn around a highlight band inside a .shot
          ring(tl, shot, band, t) {
            const k = 716 / 538;
            const r = document.createElement("div");
            r.className = "ring";
            r.style.left = band[0] * k - 10 + "px";
            r.style.top = band[1] * k - 8 + "px";
            r.style.width = (band[2] - band[0]) * k + 20 + "px";
            r.style.height = (band[3] - band[1]) * k + 16 + "px";
            shot.appendChild(r);
            tl.fromTo(r, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
            return r;
          },
          draw(tl, path, t, d, len) {
            try { len = Math.ceil(path.getTotalLength()) + 4 || len; } catch (e) {}
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
            tl.fromTo(path, { strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 1, ease: "power2.inOut" }, t);
          },
          sceneIn(tl, root) {
            const k = root.querySelector(".kicker");
            if (k) {
              tl.fromTo(k.querySelector(".k-num"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
              tl.fromTo(k.querySelector(".k-title"), { opacity: 0, x: -20, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.18);
            }
          },
          sceneOut(tl, root, D) {
            const st = root.querySelector(".stage");
            if (st) tl.fromTo(st, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);
          },
        };
      })();

          const R = document.getElementById("s02-root");
          const $ = (s) => R.querySelectorAll(s);
          const $1 = (s) => R.querySelector(s);
          const map = $1(".map");
          const P = [[300,150],[200,260],[380,210],[150,400],[290,360],[420,330],[230,500],[370,470],[510,450],[150,560],[300,580],[470,580],[560,560],[110,300]];
          P.forEach(([x, y]) => { const d = document.createElement("div"); d.className = "pin"; d.style.left = x + "px"; d.style.top = y + "px";
            d.innerHTML = '<svg viewBox="0 0 40 40"><path d="M20 39s-13-12-13-22a13 13 0 0 1 26 0c0 10-13 22-13 22z" fill="#fffdf8" stroke="#2a221d" stroke-width="2"/><path d="M13 19l7-6 7 6v7H13z" fill="#e3a21a"/><path d="M20 24.5s-3-2-3-3.6a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 1.6-3 3.6-3 3.6z" fill="#c8102e"/></svg>';
            map.appendChild(d); });
          const tl = gsap.timeline({ paused: true });
          H.sceneIn(tl, R);
          tl.fromTo($1(".badge"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
          H.mark(tl, $1(".badge .hl-bg"), C.rate, 0.7);
          H.pop(tl, $1(".heart"), C.pop - 0.2);
          tl.fromTo($1(".heart svg"), { scale: 1 }, { scale: 1.25, duration: 0.35, yoyo: true, repeat: 5, ease: "sine.inOut" }, C.pop + 0.3);
          H.slideX(tl, $1(".w1"), C.need - 0.2, { x: 80 });
          H.slideX(tl, $1(".w2"), C.cert - 0.2, { x: 80 });
          H.slideX(tl, $1(".w3"), C.pr - 0.2, { x: 80 });
          H.pop(tl, $(".why .ck"), C.need, { stagger: { each: 0.01 } });
          H.out(tl, $1(".ph1"), C.bc - 0.5);
          tl.fromTo($1(".map svg"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", transformOrigin: "50% 50%" }, C.bc - 0.1);
          H.rise(tl, $1(".map .lbl"), C.bc + 0.3);
          tl.fromTo($(".pin"), { opacity: 0, y: -50, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.32 }, C.bc + 0.8);
          tl.fromTo($1(".stat"), { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, C.draw - 0.6);
          H.rise(tl, $1(".stat .d"), C.date - 0.2);
          H.count(tl, $1(".stat .n b"), 0, 153, C.num - 0.2, 1.4);
          H.sceneOut(tl, R, C.D);
          window.__timelines["s02"] = tl;
        })();
      </script>

    </template>
