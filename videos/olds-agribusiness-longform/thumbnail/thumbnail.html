<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Olds Thumbnail</title>
<style>
@font-face{font-family:Pretendard;font-weight:800;src:url(../assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(../assets/fonts/Pretendard-Black.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0f3d2e;font-family:Pretendard,sans-serif}
.ph{position:absolute;inset:0}
.ph img{width:100%;height:100%;object-fit:cover;object-position:70% 50%;filter:brightness(.45) saturate(.95)}
.grad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,61,46,.97) 0%,rgba(15,61,46,.88) 40%,rgba(15,61,46,.2) 75%,rgba(15,61,46,0) 100%)}
.brand{position:absolute;left:56px;top:44px;color:rgba(255,255,255,.92);font-weight:800;font-size:28px;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.brand i{display:block;width:13px;height:13px;border-radius:50%;background:#c8102e;box-shadow:19px 0 0 #00b373;margin-right:18px}
.t{position:absolute;left:52px;top:120px;color:#fff;font-weight:900;font-size:86px;line-height:1.18;letter-spacing:-.035em;text-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}
.t .g{color:#e8b931}
.t small{font-size:62px}
.band{position:absolute;left:52px;top:356px;max-width:1000px;background:rgba(6,30,22,.88);border-left:12px solid #e8b931;border-radius:14px;padding:18px 28px;color:#fff;font-weight:900;font-size:44px;line-height:1.3;white-space:nowrap}
.band .g{color:#e8b931}
.pill{position:absolute;left:56px;top:560px;background:#00b373;color:#0f3d2e;font-weight:900;font-size:34px;padding:12px 30px;border-radius:99px}
.map{position:absolute;right:50px;bottom:40px;width:110px;height:165px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
</style>
</head>
<body>
<div class="ph"><img id="bg" src="../assets/photos/sf-15-crop-research.jpg" alt="" /></div>
<div class="grad"></div>
<div class="brand"><i></i>AA CANADA</div>
<div class="t" id="t">1년 학업 + 8개월 실습<br /><small>→ 캐나다</small> <span class="g">농업경영학사</span> 취득</div>
<div class="band" id="band">최고 취업률 · 최고 연봉 → 캐나다가 원하는 인재<br /><span class="g">= 영주권</span></div>
<div class="pill">알버타 Olds College 농업경영 학사</div>
<svg class="map" viewBox="0 0 400 600"><path d="M40 4 L400 4 L400 600 L254 600 L246 572 L231 545 L210 520 L191 490 L165 462 L137 436 L112 410 L90 381 L62 360 L40 338 Z" fill="rgba(15,61,46,.75)" stroke="#00b373" stroke-width="16" stroke-linejoin="round"/><path d="M252 447 m0 -6 a44 44 0 1 0 0.1 0" fill="none"/><circle cx="252" cy="447" r="30" fill="#e8b931"/></svg>
<script>const b=new URLSearchParams(location.search).get('bg');if(b)document.getElementById('bg').src='../assets/photos/'+b+'.jpg';
if(new URLSearchParams(location.search).get('copy')==='safe')document.getElementById('band').innerHTML='취업 강한 농업 분야 → 캐나다가 원하는 인재<br /><span class="g">알버타 영주권 루트</span>';</script>
</body>
</html>
