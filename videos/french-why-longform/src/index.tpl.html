<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); font-weight: 900; }
      :root {
        --cream: #fbf6ec;
        --cream2: #f4ead8;
        --paper: #fffdf8;
        --ink: #2a221d;
        --muted: #6b5d53;
        --line: #e6dac6;
        --red: #c8102e;
        --red-dark: #9e0c24;
        --red-soft: #fbe2e5;
        --gold: #ffd75e;
        --green: #03c75a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      body { font-family: "Pretendard", sans-serif; color: var(--ink); word-break: keep-all; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--cream); }

      /* ---------- persistent background ---------- */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #bg .grain { position: absolute; inset: 0;
        background-image: radial-gradient(rgba(200, 16, 46, 0.07) 1.6px, transparent 1.8px);
        background-size: 46px 46px; }
      #bg .glow { position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 215, 94, 0.22), rgba(255, 215, 94, 0) 65%); }
      #bg .glow.g1 { left: -300px; top: -380px; }
      #bg .glow.g2 { right: -380px; bottom: -420px; background: radial-gradient(circle, rgba(200, 16, 46, 0.09), rgba(200, 16, 46, 0) 65%); }
      #bg .leaf { position: absolute; right: 70px; top: 150px; width: 520px; height: 520px; opacity: 0.045; }
      #topbar { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--red); }
      #brand { position: absolute; right: 56px; top: 34px; display: flex; align-items: center; gap: 12px;
        font-weight: 800; font-size: 26px; color: var(--ink); letter-spacing: -0.01em; }
      #brand .dot { width: 30px; height: 30px; border-radius: 8px; background: var(--red); display: flex; align-items: center; justify-content: center; }
      #brand .dot svg { width: 20px; height: 20px; }

      /* ---------- shared scene vocabulary (scene content mounts into this document) ---------- */
      .stage { position: absolute; inset: 0; }
      .kicker { position: absolute; left: 72px; top: 44px; display: flex; align-items: center; gap: 18px; }
      .kicker .k-num { background: var(--red); color: #fff; font-weight: 800; font-size: 26px; padding: 6px 16px; border-radius: 10px; letter-spacing: 0.02em; }
      .kicker .k-title { font-weight: 800; font-size: 34px; color: var(--ink); letter-spacing: -0.02em; }
      .card { background: var(--paper); border-radius: 28px; box-shadow: 0 18px 50px rgba(80, 50, 20, 0.12), 0 2px 0 rgba(80, 50, 20, 0.05); }
      .red { color: var(--red); }
      .muted { color: var(--muted); }
      .hl { position: relative; display: inline-block; isolation: isolate; }
      .hl > .hl-bg { position: absolute; left: -6px; right: -6px; bottom: 4%; height: 42%; background: var(--gold); z-index: -1; transform-origin: left center; border-radius: 6px; }
      .note { position: absolute; left: 50%; bottom: 196px; transform: translateX(-50%); width: 1640px; text-align: center;
        font-size: 28px; font-weight: 600; color: var(--muted); }
      .note b { color: var(--red); font-weight: 800; }
      .src { position: absolute; left: 72px; bottom: 160px; font-size: 26px; font-weight: 600; color: var(--muted); }
      .phone { position: absolute; width: 760px; height: 564px; border-radius: 40px; background: #1f1a17; padding: 22px; box-shadow: 0 30px 70px rgba(60, 30, 10, 0.25); }
      .phone .screen { position: relative; width: 716px; height: 520px; border-radius: 22px; overflow: hidden; background: #fff; }
      .phone .shot { position: absolute; left: 0; top: 0; width: 716px; transform-origin: 0 0; }
      .phone .shot img { display: block; width: 716px; }
      .phone .ring { position: absolute; border: 5px solid var(--red); border-radius: 10px; opacity: 0; }
      .cafe-label { position: absolute; z-index: 2; display: flex; align-items: center; gap: 10px; background: var(--paper); border: 3px solid var(--green);
        color: #027a37; font-weight: 800; font-size: 28px; padding: 8px 20px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); }
      .cafe-label i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); display: block; }

      /* ---------- footnote + captions ---------- */
      #footnote { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 24px; font-weight: 600; color: #66594f; }
      #captions { position: absolute; left: 0; right: 0; bottom: 66px; height: 84px; }
      .cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; opacity: 0; }
      .cap span { display: inline-block; max-width: 1640px; background: rgba(42, 34, 29, 0.9); color: #fff; font-weight: 700; font-size: 44px;
        line-height: 1.3; padding: 12px 34px 14px; border-radius: 18px; letter-spacing: -0.01em; white-space: nowrap; }

      /* ---------- seam wipe ---------- */
      .wipe { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; transform-origin: left center; transform: scaleX(0); }
      #wipeA { background: var(--red); }
      #wipeB { background: var(--cream2); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="0">
        <div class="grain"></div>
        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <svg class="leaf" viewBox="0 0 100 100"><path fill="#c8102e" d="M50 4 l7 14 9-4-3 20 13-14 3 8 13-3-5 15 6 3-21 17 3 8-22-4v22h-6V64l-22 4 3-8-21-17 6-3-5-15 13 3 3-8 13 14-3-20 9 4z"/></svg>
      </div>
__HOSTS__
      <div id="topbar" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="3"></div>
      <div id="brand" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="4">
        <div class="dot"><svg viewBox="0 0 100 100"><path fill="#fff" d="M50 4 l7 14 9-4-3 20 13-14 3 8 13-3-5 15 6 3-21 17 3 8-22-4v22h-6V64l-22 4 3-8-21-17 6-3-5-15 13 3 3-8 13 14-3-20 9 4z"/></svg></div>
        <span>AA Canada</span>
      </div>
      <div id="footnote" class="clip" data-start="__FN_START__" data-duration="__FN_DUR__" data-track-index="5">__FOOTNOTE__</div>
      <div id="captions" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="6">
__CAPTIONS__
      </div>
      <div id="wipes" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="7">
        <div class="wipe" id="wipeB"></div>
        <div class="wipe" id="wipeA"></div>
      </div>
      <audio id="mix" src="audio/mix.m4a" data-start="0" data-duration="__TOTAL__" data-track-index="8" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const TOTAL = __TOTAL__;
      // ambient background drift (finite)
      tl.fromTo("#bg .g1", { x: 0, y: 0 }, { x: 160, y: 90, duration: TOTAL / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#bg .g2", { x: 0, y: 0 }, { x: -140, y: -80, duration: TOTAL / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#bg .leaf", { rotation: -8 }, { rotation: 8, duration: TOTAL / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#bg .grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "46px 230px", duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#brand", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.4);
      tl.fromTo("#footnote", { opacity: 0 }, { opacity: 1, duration: 0.6 }, __FN_START__ + 0.3);
      // captions
      const CAPS = __CAPDATA__;
      CAPS.forEach(([a, b], i) => {
        const el = document.getElementById("cap-" + i);
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.14, ease: "power1.out" }, Math.max(0, a));
        tl.to(el, { opacity: 0, duration: 0.1, ease: "power1.in" }, b);
      });
      // seam wipes: red leads, cream follows, both exit to the right
      const SEAMS = __SEAMS__;
      SEAMS.forEach((s) => {
        tl.fromTo("#wipeA", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.26, ease: "power3.in", immediateRender: false }, s - 0.3);
        tl.fromTo("#wipeB", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.26, ease: "power3.in", immediateRender: false }, s - 0.24);
        tl.fromTo("#wipeA", { scaleX: 1, transformOrigin: "right center" }, { scaleX: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, s + 0.0);
        tl.fromTo("#wipeB", { scaleX: 1, transformOrigin: "right center" }, { scaleX: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, s + 0.06);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
