      </style>

            <div class="row card r2"><div class="no">둘째</div><div class="tx">고용주의 <span class="red">채용 제안</span> 필요</div><div class="ck">✓</div></div>
            <div class="row card r3"><div class="no">셋째</div><div class="tx">영주권 불어 추첨은 <span class="red">4영역 모두 7레벨</span></div><div class="ck">✓</div></div>
            <div class="row card r4"><div class="no">넷째</div><div class="tx">이민 제도는 바뀜 · <span class="red">신청 시점 기준 재확인</span></div><div class="ck">✓</div></div>
          </div>
          <div class="panel card">
            <div class="pv pv1">
              <div class="hd">공부는 퀘벡, 일은 다른 주</div>
              <div class="prov"><div class="w">BC</div><div class="w">AB</div><div class="w">SK</div><div class="w">MB</div><div class="w">ON</div><div class="qc">QC</div><div class="w">NB</div><div class="w">NS</div><div class="w">PE</div><div class="w">NL</div></div>
              <svg class="arc" viewBox="0 0 800 640"><path class="ap" d="M445 300 C 420 200, 300 190, 150 290" stroke="#c8102e" stroke-width="8" fill="none" stroke-linecap="round"/><path class="ah" d="M168 262 L148 292 L182 296" stroke="#c8102e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

              <svg class="cal" viewBox="0 0 100 100"><rect x="10" y="18" width="80" height="72" rx="10" fill="#fff" stroke="#2a221d" stroke-width="5"/><path d="M10 38h80M30 10v16M70 10v16" stroke="#2a221d" stroke-width="5" stroke-linecap="round"/><path class="rf" d="M36 66 a16 16 0 1 0 6-14" stroke="#c8102e" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M34 46 l8 6 -9 5" stroke="#c8102e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div class="tx">신청 시점의 기준을 <span class="red">다시 확인</span></div>

      <script>
        (function () {
          const C = {"a0": 0.6667, "c1": 3.4667, "out": 6.6, "learn": 9.2333, "work": 11.3333, "c2": 13.9667, "score": 17.4667, "c3": 20.6, "four": 23.0667, "c4": 29.5667, "chg": 30.3667, "chk": 34.0333, "L": [[0.6667, 2.7667], [3.4667, 13.0667], [13.9667, 19.8], [20.6, 28.7667], [29.5667, 35.1667]], "D": 36.3333};
      const H = (function () {
        const fmtNum = (v, o) => {
          o = o || {};
          const d = o.dec || 0;
          let s = d ? v.toFixed(d) : Math.round(v).toString();
          if (o.comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return (o.pre || "") + s + (o.suf || "");
        };
        return {
          // count-up number (seek-safe proxy, text written in onUpdate)
          count(tl, el, from, to, t, d, o) {
            const st = { v: from };
            el.textContent = fmtNum(from, o);
            tl.fromTo(st, { v: from }, { v: to, duration: d || 1.2, ease: "power2.out", onUpdate: () => (el.textContent = fmtNum(st.v, o)) }, t);
            tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: d || 1.2, ease: "power2.out" }, t);
          },
          pop(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.5, ease: o.ease || "back.out(1.8)", stagger: o.stagger || 0 }, t);
          },
          rise(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, y: o.y || 40 }, { opacity: 1, y: 0, duration: o.d || 0.55, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          slideX(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, x: o.x || -80 }, { opacity: 1, x: 0, duration: o.d || 0.6, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          out(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: o.y == null ? -30 : o.y, duration: o.d || 0.4, ease: "power2.in", immediateRender: false, stagger: o.stagger || 0 }, t);
          },
          fadeOut(tl, els, t, d) {
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: d || 0.4, ease: "power1.in", immediateRender: false }, t);
          },
          // marker sweep behind text: element .hl > .hl-bg
          mark(tl, el, t, d) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: "power2.inOut" }, t);
          },
          growX(tl, el, t, d, to) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: to == null ? 1 : to, duration: d || 1, ease: "power3.out" }, t);
          },
          growY(tl, el, t, d) {
            tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: d || 1, ease: "power3.out" }, t);
          },
          stamp(tl, el, t) {
            tl.fromTo(el, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, t);
          },
          // slow ambient breathing, finite repeats within scene duration
          breathe(tl, els, D, o) {
            o = o || {};
            const per = o.per || 3;
            const n = Math.max(1, Math.floor(D / per) - 1);
            tl.fromTo(els, { y: 0, rotation: 0 }, { y: o.y || -14, rotation: o.r || 0, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, 0.1);
          },
          // camera move on a capture: el is the inner image wrapper
          cam(tl, el, t, d, s, x, y) {
            tl.to(el, { scale: s, x: x, y: y, duration: d, ease: "power2.inOut" }, t);
          },
          // capture camera: move/zoom a .shot so a highlight band [x0,y0,x1,y1] (native px) is centred
          camTo(tl, shot, band, natH, s, t, d) {
            const k = 716 / 538, W = 716, HS = 520;
            if (!s) s = Math.max(1.12, Math.min(1.6, (0.94 * 538) / (band[2] - band[0])));
            const cx = ((band[0] + band[2]) / 2) * k, cy = ((band[1] + band[3]) / 2) * k;
            let x = W / 2 - cx * s, y = HS / 2 - cy * s;
            x = Math.min(0, Math.max(W - W * s, x));
            y = Math.min(0, Math.max(Math.min(0, HS - natH * k * s), y));
            const prev = shot.__cam || { scale: 1, x: 0, y: 0 };
            tl.fromTo(shot, { scale: prev.scale, x: prev.x, y: prev.y }, { scale: s, x: x, y: y, duration: d || 1.6, ease: "power2.inOut", immediateRender: !shot.__cam }, t);
            shot.__cam = { scale: s, x: x, y: y };
          },
          // red ring drawn around a highlight band inside a .shot
          ring(tl, shot, band, t) {
            const k = 716 / 538;
            const r = document.createElement("div");
            r.className = "ring";
            r.style.left = band[0] * k - 10 + "px";
            r.style.top = band[1] * k - 8 + "px";
            r.style.width = (band[2] - band[0]) * k + 20 + "px";
            r.style.height = (band[3] - band[1]) * k + 16 + "px";
            shot.appendChild(r);
            tl.fromTo(r, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
            return r;
          },
          draw(tl, path, t, d, len) {
            try { len = Math.ceil(path.getTotalLength()) + 4 || len; } catch (e) {}
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
            tl.fromTo(path, { strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 1, ease: "power2.inOut" }, t);
          },
          sceneIn(tl, root) {
            const k = root.querySelector(".kicker");
            if (k) {
              tl.fromTo(k.querySelector(".k-num"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
              tl.fromTo(k.querySelector(".k-title"), { opacity: 0, x: -20, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.18);
            }
          },
          sceneOut(tl, root, D) {
            const st = root.querySelector(".stage");
            if (st) tl.fromTo(st, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);
          },
        };
      })();

          const R = document.getElementById("s13-root");
          const $ = (s) => R.querySelectorAll(s);
          const $1 = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          H.sceneIn(tl, R);
          tl.fromTo($1(".panel"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, C.a0);
          tl.set($(".pv"), { opacity: 0 }, 0);
          const showPV = (k, t, prev) => {
            if (prev) tl.fromTo($1(".pv" + prev), { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, t - 0.3);
            tl.fromTo($1(".pv" + k), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
          };
          ["c1", "c2", "c3", "c4"].forEach((k, i) => {
            const row = $1(".r" + (i + 1));
            H.slideX(tl, row, C[k] - 0.3, { x: -60 });
            H.stamp(tl, row.querySelector(".ck"), C[k] + 0.2);
          });
          // 1: map arrow
          showPV(1, C.c1 - 0.1);
          H.pop(tl, $(".prov div"), C.c1 + 0.1, { stagger: 0.04, from: 0.5 });
          H.pop(tl, $1(".tagq"), C.learn - 0.1, { from: 0.7 });
          H.draw(tl, $1(".ap"), C.work - 0.3, 0.9, 360);
          tl.fromTo($1(".ah"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, C.work + 0.5);
          H.pop(tl, $1(".tagw"), C.work + 0.3, { from: 0.7 });
          tl.fromTo($(".prov .w"), { backgroundColor: "#fbe2e5" }, { backgroundColor: "#f5b5c0", duration: 0.3, stagger: 0.03, yoyo: true, repeat: 1 }, C.work + 0.5);
          // 2: job offer document
          showPV(2, C.c2, 1);
          tl.fromTo($1(".doc"), { rotation: -6, scale: 0.85 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, C.c2 + 0.1);
          H.draw(tl, $1(".sp"), C.c2 + 0.9, 0.9, 200);
          H.rise(tl, $1(".pv2 .nope"), C.score - 0.2, { y: 20 });
          // 3: all four areas at 7
          showPV(3, C.c3, 2);
          H.pop(tl, $(".four div"), C.four - 0.3, { stagger: 0.15, from: 0.5 });
          // 4: rules change
          showPV(4, C.c4, 3);
          tl.fromTo($1(".cal"), { rotation: 0 }, { rotation: 360, duration: 1.2, ease: "power2.inOut", transformOrigin: "50% 50%" }, C.chg);
          tl.fromTo($1(".pv4 .tx .red"), { color: "#2a221d" }, { color: "#c8102e", duration: 0.4 }, C.chk);
          H.sceneOut(tl, R, C.D);
          window.__timelines["s13"] = tl;
        })();
      </script>
