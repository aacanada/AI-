      </style>
      <div id="s11-root" data-composition-id="s11" data-width="1920" data-height="1080">

          <div class="grp gB">
            <div class="ppl card"><div class="hd"><span class="n n20">0</span>명 시작 →<span class="n n15">0</span>명 다음 단계로</div><div class="grid"></div></div>
            <div class="quote card"><div class="who">마지막 날 선생님</div><div class="q1">“한국어와 불어는 거리가 멀다”</div><div class="q2">“그래도 시간의 문제, 포기하지 마세요”</div></div>
          </div>
          <div class="anti">
            <div class="c card dark a1">“배워야 할 강한 동기가 없어서”</div>
            <div class="c card a2">→ 한 달 만에 그만둠</div>

          <div class="plan card">

            <div class="ln l1"><div class="ck">✓</div><span class="o">O</span>개월 차에 5레벨</div>

          </div>
          <div class="wk card"><div class="t">주</div><div class="n"><span class="h">22.5</span><small>시간</small></div><div class="t">수업을 빠지지 않고</div><div class="st">가장 확실한 방법</div></div>
        </div>
      </div>
      <script>
        (function () {
          const C = {"a0": 0.7667, "quit": 4.6, "fail": 7.5667, "stop": 10.4333, "rev": 12.9333, "n20": 16.2, "n15": 18.0333, "her": 21.9667, "tch": 24.2667, "time": 30.6667, "nogiv": 32.8333, "anti": 34.6667, "mo1": 37.8, "why": 41.4, "plan": 43.9667, "pl5": 48.4333, "test": 49.3333, "pl7": 50.6667, "h22": 52.0333, "best": 56.1333, "L": [[0.7667, 2.5333], [3.2333, 6.7667], [7.5667, 11.9667], [12.9333, 33.8], [34.6667, 43.3333], [43.9667, 51.6333], [52.0333, 57.5667]], "D": 58.9};
      const H = (function () {
        const fmtNum = (v, o) => {
          o = o || {};
          const d = o.dec || 0;
          let s = d ? v.toFixed(d) : Math.round(v).toString();
          if (o.comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return (o.pre || "") + s + (o.suf || "");
        };
        return {
          // count-up number (seek-safe proxy, text written in onUpdate)
          count(tl, el, from, to, t, d, o) {
            const st = { v: from };
            el.textContent = fmtNum(from, o);
            tl.fromTo(st, { v: from }, { v: to, duration: d || 1.2, ease: "power2.out", onUpdate: () => (el.textContent = fmtNum(st.v, o)) }, t);
            tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: d || 1.2, ease: "power2.out" }, t);
          },
          pop(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.5, ease: o.ease || "back.out(1.8)", stagger: o.stagger || 0 }, t);
          },
          rise(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, y: o.y || 40 }, { opacity: 1, y: 0, duration: o.d || 0.55, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          slideX(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, x: o.x || -80 }, { opacity: 1, x: 0, duration: o.d || 0.6, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          out(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: o.y == null ? -30 : o.y, duration: o.d || 0.4, ease: "power2.in", immediateRender: false, stagger: o.stagger || 0 }, t);
          },
          fadeOut(tl, els, t, d) {
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: d || 0.4, ease: "power1.in", immediateRender: false }, t);
          },
          // marker sweep behind text: element .hl > .hl-bg
          mark(tl, el, t, d) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: "power2.inOut" }, t);
          },
          growX(tl, el, t, d, to) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: to == null ? 1 : to, duration: d || 1, ease: "power3.out" }, t);
          },
          growY(tl, el, t, d) {
            tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: d || 1, ease: "power3.out" }, t);
          },
          stamp(tl, el, t) {
            tl.fromTo(el, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, t);
          },
          // slow ambient breathing, finite repeats within scene duration
          breathe(tl, els, D, o) {
            o = o || {};
            const per = o.per || 3;
            const n = Math.max(1, Math.floor(D / per) - 1);
            tl.fromTo(els, { y: 0, rotation: 0 }, { y: o.y || -14, rotation: o.r || 0, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, 0.1);
          },
          // camera move on a capture: el is the inner image wrapper
          cam(tl, el, t, d, s, x, y) {
            tl.to(el, { scale: s, x: x, y: y, duration: d, ease: "power2.inOut" }, t);
          },
          // capture camera: move/zoom a .shot so a highlight band [x0,y0,x1,y1] (native px) is centred
          camTo(tl, shot, band, natH, s, t, d) {
            const k = 716 / 538, W = 716, HS = 520;
            if (!s) s = Math.max(1.12, Math.min(1.6, (0.94 * 538) / (band[2] - band[0])));
            const cx = ((band[0] + band[2]) / 2) * k, cy = ((band[1] + band[3]) / 2) * k;
            let x = W / 2 - cx * s, y = HS / 2 - cy * s;
            x = Math.min(0, Math.max(W - W * s, x));
            y = Math.min(0, Math.max(Math.min(0, HS - natH * k * s), y));
            const prev = shot.__cam || { scale: 1, x: 0, y: 0 };
            tl.fromTo(shot, { scale: prev.scale, x: prev.x, y: prev.y }, { scale: s, x: x, y: y, duration: d || 1.6, ease: "power2.inOut", immediateRender: !shot.__cam }, t);
            shot.__cam = { scale: s, x: x, y: y };
          },
          // red ring drawn around a highlight band inside a .shot
          ring(tl, shot, band, t) {
            const k = 716 / 538;
            const r = document.createElement("div");
            r.className = "ring";
            r.style.left = band[0] * k - 10 + "px";
            r.style.top = band[1] * k - 8 + "px";
            r.style.width = (band[2] - band[0]) * k + 20 + "px";
            r.style.height = (band[3] - band[1]) * k + 16 + "px";
            shot.appendChild(r);
            tl.fromTo(r, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
            return r;
          },
          draw(tl, path, t, d, len) {
            try { len = Math.ceil(path.getTotalLength()) + 4 || len; } catch (e) {}
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
            tl.fromTo(path, { strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 1, ease: "power2.inOut" }, t);
          },
          sceneIn(tl, root) {
            const k = root.querySelector(".kicker");
            if (k) {
              tl.fromTo(k.querySelector(".k-num"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
              tl.fromTo(k.querySelector(".k-title"), { opacity: 0, x: -20, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.18);
            }
          },
          sceneOut(tl, root, D) {
            const st = root.querySelector(".stage");
            if (st) tl.fromTo(st, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);
          },
        };
      })();

          const R = document.getElementById("s11-root");
          const $ = (s) => R.querySelectorAll(s);
          const $1 = (s) => R.querySelector(s);
          const grid = $1(".ppl .grid");
          for (let i = 0; i < 20; i++) {
            const p = document.createElement("div");
            p.className = "p" + (i === 13 ? " me" : "");
            grid.appendChild(p);
          }
          const tl = gsap.timeline({ paused: true });
          H.sceneIn(tl, R);
          // A: stopping, not talent
          H.draw(tl, $1(".drop"), C.a0 + 0.2, 1.6, 980);
          H.rise(tl, $1(".l1"), C.a0 + 0.2, { y: 10 });
          tl.fromTo($1(".xdot"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, C.quit + 0.2);
          H.rise(tl, $1(".l2"), C.quit + 0.3, { y: 10 });
          H.pop(tl, $1(".v1"), C.fail, { from: 0.6 });
          H.pop(tl, $1(".v2"), C.stop - 0.1, { from: 0.6 });
          H.draw(tl, $1(".go"), C.stop + 0.4, 1.4, 1600);
          H.rise(tl, $1(".l3"), C.stop + 1.4, { y: 10 });
          H.out(tl, $1(".gA"), C.rev - 0.6, { y: -40 });
          // B: 20 -> 15 review
          tl.fromTo($1(".phone"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, C.rev - 0.3);
          H.pop(tl, $1(".cafe-label"), C.rev + 0.1, { from: 0.7 });
          tl.fromTo($1(".sa"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.rev - 0.3);
          H.camTo(tl, $1(".sa"), [20, 212, 177, 240], 379, 1.6, C.n20 - 0.4, 1.2);
          H.ring(tl, $1(".sa"), [20, 212, 177, 240], C.n20 + 0.5);
          tl.fromTo($1(".ppl"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, C.n20 - 0.3);
          H.pop(tl, $(".ppl .p"), C.n20, { stagger: 0.03, from: 0.3 });
          H.count(tl, $1(".n20"), 0, 20, C.n20, 0.7);
          const ps = $(".ppl .p");
          const up = [0, 1, 2, 3, 5, 6, 7, 9, 10, 11, 12, 13, 15, 17, 18];
          up.forEach((k, i) => tl.to(ps[k], { backgroundColor: "#c8102e", duration: 0.12 }, C.n15 + i * 0.06));
          H.count(tl, $1(".n15"), 0, 15, C.n15, 0.9);
          tl.fromTo(ps[13], { scale: 1 }, { scale: 1.3, duration: 0.3, yoyo: true, repeat: 1 }, C.her);
          H.fadeOut(tl, $1(".sa"), C.tch - 0.2, 0.3);
          tl.fromTo($1(".sb"), { opacity: 0, yPercent: 20 }, { opacity: 1, yPercent: 0, duration: 0.5 }, C.tch - 0.2);
          H.camTo(tl, $1(".sb"), [20, 212, 196, 240], 379, 1.6, C.tch + 0.2, 1.2);
          H.ring(tl, $1(".sb"), [20, 212, 196, 240], C.time);
          tl.fromTo($1(".quote"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5 }, C.tch);
          H.rise(tl, $1(".quote .q2"), C.time - 0.2, { y: 16 });
          H.out(tl, $1(".gB"), C.anti - 0.5, { y: -30 });
          // C: no strong motivation
          H.fadeOut(tl, $1(".sb"), C.anti - 0.2, 0.3);
          tl.fromTo($1(".sc"), { opacity: 0, yPercent: 20 }, { opacity: 1, yPercent: 0, duration: 0.5 }, C.anti - 0.2);
          H.camTo(tl, $1(".sc"), [20, 213, 493, 273], 411, null, C.anti + 0.3, 1.2);
          H.ring(tl, $1(".sc"), [20, 213, 493, 273], C.anti + 1.3);
          H.slideX(tl, $1(".a1"), C.anti + 0.3, { x: 60 });
          H.slideX(tl, $1(".a2"), C.mo1 - 0.1, { x: 60 });
          H.slideX(tl, $1(".a3"), C.why - 0.3, { x: 60 });
          H.out(tl, $(".gP, .anti"), C.plan - 0.5, { y: -40 });
          // D: plan + 22.5h
          tl.fromTo($1(".plan"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, C.plan - 0.2);
          H.rise(tl, $1(".plan .l1"), C.pl5 - 0.5, { y: 20 });
          H.rise(tl, $1(".plan .l2"), C.test - 0.3, { y: 20 });
          H.rise(tl, $1(".plan .l3"), C.pl7 - 0.3, { y: 20 });
          H.pop(tl, $(".plan .ck"), C.pl7 + 0.6, { stagger: 0.2, from: 0.3 });
          tl.fromTo($1(".wk"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, C.h22 - 0.2);
          H.count(tl, $1(".wk .h"), 0, 22.5, C.h22, 1.2, { dec: 1 });
          H.stamp(tl, $1(".wk .st"), C.best);
          H.sceneOut(tl, R, C.D);
          window.__timelines["s11"] = tl;
        })();
      </script>

    </template>
  </body>
