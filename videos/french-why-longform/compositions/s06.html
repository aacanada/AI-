  <body>
    <template>


      <style>

        #s06-root .big .a { font-size: 62px; font-weight: 800; color: var(--muted); letter-spacing: -0.03em; }
        #s06-root .big .b { margin-top: 26px; font-size: 92px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.2; }
        #s06-root .rip { position: absolute; left: 50%; top: 470px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 6px solid var(--red); opacity: 0; }
      </style>
      <div id="s06-root" data-composition-id="s06" data-width="1920" data-height="1080">
        <div class="stage">
          <div class="kicker"><span class="k-num">05</span><span class="k-title">내 생활이 달라집니다</span></div>
          <div class="grp gP">
            <div class="phone"><div class="screen">
              <div class="shot a"><img src="assets/captures/c01_body.png" alt="" /></div>
              <div class="shot b"><img src="assets/captures/c03_b.png" alt="" /></div>
            </div></div>
            <div class="cafe-label"><i></i>AA Montreal 카페 실제 후기</div>
          </div>
          <div class="side s1">
            <div class="tlx">
              <div class="ln"></div><div class="lnf"></div>
              <div class="pt p1"><div class="dot">처음</div><div class="tx">불어 a, b, c, d도 헷갈림</div></div>
              <div class="pt p2"><div class="dot">8개월</div><div class="tx">아이 학교 선생님과<span class="red"> 불어 상담</span></div></div>
              <div class="pt p3"><div class="dot">✓</div><div class="tx">마트·카페에서 간단한 대화</div></div>
            </div>
          </div>
          <div class="low">
            <div class="row card r1">처음 왔을 때, 말이 안 통함</div>
            <div class="row card r2" style="display: block">자존감<div class="meter"><div class="mf"></div></div></div>
            <div class="row card r3"><svg class="cup" viewBox="0 0 24 24"><path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8zm12 2h2a2 2 0 0 1 0 4h-2" stroke="#2a221d" stroke-width="2" fill="none"/><path d="M8 3v3M12 3v3" stroke="#c8102e" stroke-width="2" stroke-linecap="round"/></svg>커피 한 잔 사러 가기도 어려움</div>
          </div>
          <div class="rip r1x"></div><div class="rip r2x"></div><div class="rip r3x"></div>
          <div class="big">
            <div class="a">언어는 시험 점수이기 전에,</div>
            <div class="b">이 도시에서 <span class="red">내가 할 수 있는</span></div>
            <div class="b"><span class="hl"><span class="hl-bg"></span>일의 크기</span>입니다</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const C = {"m1": 0.7667, "abcd": 2.9333, "m8": 5.3333, "tch": 7.0, "mart": 9.1667, "m2": 13.1667, "self": 16.6667, "coffee": 19.1667, "big": 22.0333, "size": 26.6, "L": [[0.7667, 12.3667], [13.1667, 21.0], [22.0333, 27.1667]], "D": 28.5};
      const H = (function () {
        const fmtNum = (v, o) => {
          o = o || {};
          const d = o.dec || 0;
          let s = d ? v.toFixed(d) : Math.round(v).toString();
          if (o.comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return (o.pre || "") + s + (o.suf || "");
        };
        return {
          // count-up number (seek-safe proxy, text written in onUpdate)
          count(tl, el, from, to, t, d, o) {
            const st = { v: from };
            el.textContent = fmtNum(from, o);
            tl.fromTo(st, { v: from }, { v: to, duration: d || 1.2, ease: "power2.out", onUpdate: () => (el.textContent = fmtNum(st.v, o)) }, t);
            tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: d || 1.2, ease: "power2.out" }, t);
          },
          pop(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.5, ease: o.ease || "back.out(1.8)", stagger: o.stagger || 0 }, t);
          },
          rise(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, y: o.y || 40 }, { opacity: 1, y: 0, duration: o.d || 0.55, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          slideX(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, x: o.x || -80 }, { opacity: 1, x: 0, duration: o.d || 0.6, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          out(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: o.y == null ? -30 : o.y, duration: o.d || 0.4, ease: "power2.in", immediateRender: false, stagger: o.stagger || 0 }, t);
          },
          fadeOut(tl, els, t, d) {
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: d || 0.4, ease: "power1.in", immediateRender: false }, t);
          },
          // marker sweep behind text: element .hl > .hl-bg
          mark(tl, el, t, d) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: "power2.inOut" }, t);
          },
          growX(tl, el, t, d, to) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: to == null ? 1 : to, duration: d || 1, ease: "power3.out" }, t);
          },
          growY(tl, el, t, d) {
            tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: d || 1, ease: "power3.out" }, t);
          },
          stamp(tl, el, t) {
            tl.fromTo(el, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, t);
          },
          // slow ambient breathing, finite repeats within scene duration
          breathe(tl, els, D, o) {
            o = o || {};
            const per = o.per || 3;
            const n = Math.max(1, Math.floor(D / per) - 1);
            tl.fromTo(els, { y: 0, rotation: 0 }, { y: o.y || -14, rotation: o.r || 0, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, 0.1);
          },
          // camera move on a capture: el is the inner image wrapper
          cam(tl, el, t, d, s, x, y) {
            tl.to(el, { scale: s, x: x, y: y, duration: d, ease: "power2.inOut" }, t);
          },
          // capture camera: move/zoom a .shot so a highlight band [x0,y0,x1,y1] (native px) is centred
          camTo(tl, shot, band, natH, s, t, d) {
            const k = 716 / 538, W = 716, HS = 520;
            if (!s) s = Math.max(1.12, Math.min(1.6, (0.94 * 538) / (band[2] - band[0])));
            const cx = ((band[0] + band[2]) / 2) * k, cy = ((band[1] + band[3]) / 2) * k;
            let x = W / 2 - cx * s, y = HS / 2 - cy * s;
            x = Math.min(0, Math.max(W - W * s, x));
            y = Math.min(0, Math.max(Math.min(0, HS - natH * k * s), y));
            const prev = shot.__cam || { scale: 1, x: 0, y: 0 };
            tl.fromTo(shot, { scale: prev.scale, x: prev.x, y: prev.y }, { scale: s, x: x, y: y, duration: d || 1.6, ease: "power2.inOut", immediateRender: !shot.__cam }, t);
            shot.__cam = { scale: s, x: x, y: y };
          },
          // red ring drawn around a highlight band inside a .shot
          ring(tl, shot, band, t) {
            const k = 716 / 538;
            const r = document.createElement("div");
            r.className = "ring";
            r.style.left = band[0] * k - 10 + "px";
            r.style.top = band[1] * k - 8 + "px";
            r.style.width = (band[2] - band[0]) * k + 20 + "px";
            r.style.height = (band[3] - band[1]) * k + 16 + "px";
            shot.appendChild(r);
            tl.fromTo(r, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
            return r;
          },
          draw(tl, path, t, d, len) {
            try { len = Math.ceil(path.getTotalLength()) + 4 || len; } catch (e) {}
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
            tl.fromTo(path, { strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 1, ease: "power2.inOut" }, t);
          },
          sceneIn(tl, root) {
            const k = root.querySelector(".kicker");
            if (k) {
              tl.fromTo(k.querySelector(".k-num"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
              tl.fromTo(k.querySelector(".k-title"), { opacity: 0, x: -20, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.18);
            }
          },
          sceneOut(tl, root, D) {
            const st = root.querySelector(".stage");
            if (st) tl.fromTo(st, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);
          },
        };
      })();

          const R = document.getElementById("s06-root");
          const $ = (s) => R.querySelectorAll(s);
          const $1 = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          H.sceneIn(tl, R);
          tl.fromTo($1(".phone"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, C.m1 - 0.4);
          H.pop(tl, $1(".cafe-label"), C.m1, { from: 0.7 });
          const A = $1(".shot.a"), B = $1(".shot.b");
          // member 1: A0 -> 8 months
          H.camTo(tl, A, [20, 212, 471, 240], 379, null, C.abcd - 0.6, 1.4);
          H.ring(tl, A, [20, 212, 471, 240], C.abcd + 0.6);
          H.rise(tl, $1(".tlx .ln"), C.m1 + 0.2, { y: 0 });
          H.slideX(tl, $1(".p1"), C.abcd, { x: 60 });
          tl.fromTo($1(".lnf"), { scaleY: 0 }, { scaleY: 0.5, duration: 1.0, ease: "power2.inOut" }, C.m8 - 0.8);
          H.pop(tl, $1(".p2 .dot"), C.m8);
          H.slideX(tl, $1(".p2 .tx"), C.tch - 0.2, { x: 40 });
          H.camTo(tl, A, [20, 308, 476, 336], 379, null, C.mart - 0.7, 1.2);
          H.ring(tl, A, [20, 308, 476, 336], C.mart + 0.4);
          tl.fromTo($1(".lnf"), { scaleY: 0.5 }, { scaleY: 1, duration: 0.8, ease: "power2.inOut", immediateRender: false }, C.mart - 0.4);
          H.slideX(tl, $1(".p3"), C.mart + 0.2, { x: 60 });
          H.out(tl, $1(".s1"), C.m2 - 0.5, { y: -30 });
          // member 2: self-esteem at the bottom
          tl.fromTo(B, { opacity: 0, yPercent: 25 }, { opacity: 1, yPercent: 0, duration: 0.6, ease: "power3.out" }, C.m2 - 0.4);
          H.camTo(tl, B, [20, 212, 481, 272], 411, null, C.self - 0.8, 1.4);
          H.ring(tl, B, [20, 212, 481, 272], C.self + 0.4);
          H.slideX(tl, $1(".low .r1"), C.m2 + 0.3, { x: 60 });
          H.slideX(tl, $1(".low .r2"), C.self - 0.4, { x: 60 });
          tl.fromTo($1(".meter .mf"), { scaleX: 0.85 }, { scaleX: 0.08, duration: 1.4, ease: "power2.in" }, C.self);
          H.slideX(tl, $1(".low .r3"), C.coffee - 0.2, { x: 60 });
          H.out(tl, $(".gP, .low"), C.big - 0.6, { y: -40 });
          // the line that matters
          H.rise(tl, $1(".big .a"), C.big - 0.1, { y: 30 });
          H.rise(tl, $(".big .b"), C.big + 1.4, { stagger: 0.6, y: 50 });
          H.mark(tl, $1(".big .hl-bg"), C.size - 0.6, 0.6);
          [".r1x", ".r2x", ".r3x"].forEach((c, i) => tl.fromTo($1(c), { opacity: 0.5, scale: 0.4 }, { opacity: 0, scale: 5.5, duration: 2.2, ease: "power1.out", immediateRender: false }, C.size - 0.4 + i * 0.45));
          H.sceneOut(tl, R, C.D);
          window.__timelines["s06"] = tl;
        })();
      </script>
