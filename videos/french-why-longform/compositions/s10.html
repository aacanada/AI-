      <script>
        (function () {
          const C = {"board": 0.6667, "map": 5.7333, "b1": 12.2, "b2": 15.4, "p1": 18.6667, "abcd": 21.4, "rep": 24.0333, "m8": 26.3667, "tal": 31.6333, "p2": 36.2667, "zero": 38.8333, "m89": 40.2667, "pass": 41.7333, "p3": 45.2333, "cmt": 47.1667, "y1": 50.2, "col": 55.4667, "end": 57.7333, "stop": 60.3667, "L": [[0.6667, 5.0], [5.7333, 17.8], [18.6667, 35.4667], [36.2667, 44.7333], [45.2333, 56.8333], [57.7333, 61.6333]], "D": 62.8};
      const H = (function () {
        const fmtNum = (v, o) => {
          o = o || {};
          const d = o.dec || 0;
          let s = d ? v.toFixed(d) : Math.round(v).toString();
          if (o.comma) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return (o.pre || "") + s + (o.suf || "");
        };
        return {
          // count-up number (seek-safe proxy, text written in onUpdate)
          count(tl, el, from, to, t, d, o) {
            const st = { v: from };
            el.textContent = fmtNum(from, o);
            tl.fromTo(st, { v: from }, { v: to, duration: d || 1.2, ease: "power2.out", onUpdate: () => (el.textContent = fmtNum(st.v, o)) }, t);
            tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: d || 1.2, ease: "power2.out" }, t);
          },
          pop(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.5, ease: o.ease || "back.out(1.8)", stagger: o.stagger || 0 }, t);
          },
          rise(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, y: o.y || 40 }, { opacity: 1, y: 0, duration: o.d || 0.55, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          slideX(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 0, x: o.x || -80 }, { opacity: 1, x: 0, duration: o.d || 0.6, ease: o.ease || "power3.out", stagger: o.stagger || 0 }, t);
          },
          out(tl, els, t, o) {
            o = o || {};
            tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: o.y == null ? -30 : o.y, duration: o.d || 0.4, ease: "power2.in", immediateRender: false, stagger: o.stagger || 0 }, t);
          },
          fadeOut(tl, els, t, d) {
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: d || 0.4, ease: "power1.in", immediateRender: false }, t);
          },
          // marker sweep behind text: element .hl > .hl-bg
          mark(tl, el, t, d) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d || 0.5, ease: "power2.inOut" }, t);
          },
          growX(tl, el, t, d, to) {
            tl.fromTo(el, { scaleX: 0 }, { scaleX: to == null ? 1 : to, duration: d || 1, ease: "power3.out" }, t);
          },
          growY(tl, el, t, d) {
            tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: d || 1, ease: "power3.out" }, t);
          },
          stamp(tl, el, t) {
            tl.fromTo(el, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.42, ease: "back.out(2.2)" }, t);
          },
          // slow ambient breathing, finite repeats within scene duration
          breathe(tl, els, D, o) {
            o = o || {};
            const per = o.per || 3;
            const n = Math.max(1, Math.floor(D / per) - 1);
            tl.fromTo(els, { y: 0, rotation: 0 }, { y: o.y || -14, rotation: o.r || 0, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, 0.1);
          },
          // camera move on a capture: el is the inner image wrapper
          cam(tl, el, t, d, s, x, y) {
            tl.to(el, { scale: s, x: x, y: y, duration: d, ease: "power2.inOut" }, t);
          },
          // capture camera: move/zoom a .shot so a highlight band [x0,y0,x1,y1] (native px) is centred
          camTo(tl, shot, band, natH, s, t, d) {
            const k = 716 / 538, W = 716, HS = 520;
            if (!s) s = Math.max(1.12, Math.min(1.6, (0.94 * 538) / (band[2] - band[0])));
            const cx = ((band[0] + band[2]) / 2) * k, cy = ((band[1] + band[3]) / 2) * k;
            let x = W / 2 - cx * s, y = HS / 2 - cy * s;
            x = Math.min(0, Math.max(W - W * s, x));
            y = Math.min(0, Math.max(Math.min(0, HS - natH * k * s), y));
            const prev = shot.__cam || { scale: 1, x: 0, y: 0 };
            tl.fromTo(shot, { scale: prev.scale, x: prev.x, y: prev.y }, { scale: s, x: x, y: y, duration: d || 1.6, ease: "power2.inOut", immediateRender: !shot.__cam }, t);
            shot.__cam = { scale: s, x: x, y: y };
          },
          // red ring drawn around a highlight band inside a .shot
          ring(tl, shot, band, t) {
            const k = 716 / 538;
            const r = document.createElement("div");
            r.className = "ring";
            r.style.left = band[0] * k - 10 + "px";
            r.style.top = band[1] * k - 8 + "px";
            r.style.width = (band[2] - band[0]) * k + 20 + "px";
            r.style.height = (band[3] - band[1]) * k + 16 + "px";
            shot.appendChild(r);
            tl.fromTo(r, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
            return r;
          },
          draw(tl, path, t, d, len) {
            try { len = Math.ceil(path.getTotalLength()) + 4 || len; } catch (e) {}
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
            tl.fromTo(path, { strokeDasharray: len + " " + len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 1, ease: "power2.inOut" }, t);
          },
          sceneIn(tl, root) {
            const k = root.querySelector(".kicker");
            if (k) {
              tl.fromTo(k.querySelector(".k-num"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
              tl.fromTo(k.querySelector(".k-title"), { opacity: 0, x: -20, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.18);
            }
          },
          sceneOut(tl, root, D) {
            const st = root.querySelector(".stage");
            if (st) tl.fromTo(st, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, D - 0.4);
          },
        };
      })();

          const R = document.getElementById("s10-root");
          const $ = (s) => R.querySelectorAll(s);
          const $1 = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          H.sceneIn(tl, R);
          const show = (sel, t) => tl.fromTo($1(sel), { opacity: 0, yPercent: 20 }, { opacity: 1, yPercent: 0, duration: 0.5, ease: "power3.out" }, t);
          const hide = (sel, t) => H.fadeOut(tl, $1(sel), t, 0.3);
          // board
          tl.fromTo($1(".board"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, C.board - 0.2);
          H.out(tl, $1(".board"), C.map - 0.4, { y: -40 });
          // B1/B2 mapping card first, then parked top-right
          tl.fromTo($1(".mapc"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.map);
          const rows = $(".mapc .r");
          H.slideX(tl, rows[0], C.b1 - 0.2, { x: -60 });
          H.slideX(tl, rows[1], C.b2 - 0.2, { x: -60 });
          H.rise(tl, $1(".mapc .sm"), C.b2 + 0.8, { y: 10 });
          tl.fromTo($1(".note"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, C.b1);
          tl.fromTo($1(".mapc"), { x: 0, y: 0, scale: 1 }, { x: 250, y: -140, scale: 0.55, duration: 0.8, ease: "power3.inOut", immediateRender: false }, C.p1 - 0.7);
          // person 1
          tl.fromTo($1(".phone"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, C.p1 - 0.4);
          H.pop(tl, $1(".cafe-label"), C.p1, { from: 0.7 });
          show(".s1t", C.p1 - 0.3);
          H.camTo(tl, $1(".s1t"), [20, 120, 420, 160], 413, 1.3, C.p1 + 0.3, 1.2);
          hide(".s1t", C.abcd - 0.3);
          show(".s1b", C.abcd - 0.3);
          H.camTo(tl, $1(".s1b"), [20, 212, 471, 240], 379, null, C.abcd + 0.2, 1.3);
          H.ring(tl, $1(".s1b"), [20, 212, 471, 240], C.abcd + 1.2);
          H.slideX(tl, $1(".pc1"), C.abcd, { x: 60 });
          tl.fromTo($(".pc1 .sp, .pc1 .ar"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.12 }, C.abcd + 0.3);
          tl.set($(".pc1 .sp, .pc1 .ar"), { opacity: 1 }, C.m8 + 0.4);
          hide(".s1b", C.m8 - 0.4);
          show(".s1c", C.m8 - 0.4);
          H.camTo(tl, $1(".s1c"), [118, 212, 438, 261], 400, null, C.m8, 1.3);
          H.ring(tl, $1(".s1c"), [118, 212, 438, 261], C.m8 + 1.0);
          tl.fromTo($1(".pc1 .res"), { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1 }, C.m8 + 0.9);
          hide(".s1c", C.tal - 0.3);
          show(".s1b", C.tal - 0.3);
          H.camTo(tl, $1(".s1b"), [20, 180, 480, 206], 379, null, C.tal, 1.0);
          H.ring(tl, $1(".s1b"), [20, 180, 480, 206], C.tal + 0.9);
          H.rise(tl, $1(".pc1 .qt"), C.tal + 0.6, { y: 20 });
          // person 2
          H.out(tl, $1(".pc1"), C.p2 - 0.5, { y: -30 });
          hide(".s1b", C.p2 - 0.4);
          show(".s2t", C.p2 - 0.4);
          H.camTo(tl, $1(".s2t"), [20, 120, 400, 160], 413, 1.3, C.p2 + 0.2, 1.0);
          hide(".s2t", C.zero - 0.5);
          show(".s2a", C.zero - 0.5);
          H.camTo(tl, $1(".s2a"), [28, 212, 438, 240], 379, null, C.zero - 0.1, 1.2);
          H.ring(tl, $1(".s2a"), [28, 212, 438, 240], C.zero + 0.6);
          H.slideX(tl, $1(".pc2"), C.zero - 0.3, { x: 60 });
          hide(".s2a", C.m89 - 0.5);
          show(".s2b", C.m89 - 0.5);
          H.camTo(tl, $1(".s2b"), [20, 212, 391, 240], 379, null, C.m89 - 0.1, 1.2);
          H.ring(tl, $1(".s2b"), [20, 212, 391, 240], C.m89 + 0.6);
          tl.fromTo($1(".pc2 .res"), { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1 }, C.pass);
          // person 3
          H.out(tl, $1(".pc2"), C.p3 - 0.5, { y: -30 });
          hide(".s2b", C.p3 - 0.4);
          show(".s3a", C.p3 - 0.4);
          H.camTo(tl, $1(".s3a"), [22, 212, 485, 272], 411, null, C.cmt - 0.6, 1.3);
          H.ring(tl, $1(".s3a"), [22, 212, 485, 272], C.cmt + 0.5);
          H.slideX(tl, $1(".pc3"), C.p3 - 0.2, { x: 60 });
          tl.fromTo($1(".pc3 .res"), { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1 }, C.col);
          // finale
          H.out(tl, $(".gP, .mapc"), C.end - 0.5, { y: -40 });
          H.rise(tl, $1(".fin .a"), C.end - 0.1, { y: 30 });
          tl.fromTo($1(".fin .a"), { "--k": 0 }, { "--k": 1, duration: 0.5, ease: "power2.inOut" }, C.end + 1.0);
          H.rise(tl, $1(".fin .b"), C.stop - 0.4, { y: 50 });
          H.pop(tl, $(".fin .dots span"), C.stop + 0.6, { stagger: 0.15, from: 0.6 });
          H.sceneOut(tl, R, C.D);
          window.__timelines["s10"] = tl;
        })();
      </script>

    </template>
