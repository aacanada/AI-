<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><style>
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("../assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 900; src: url("../assets/fonts/Pretendard-Black.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { font-family: "Pretendard", sans-serif; color: #fff; word-break: keep-all; position: relative; background: #0a1a33; }
.face { position: absolute; left: 380px; top: 0; width: 900px; height: 720px; background: url("face-facecam.jpg") 35% 90% / auto 800px no-repeat; }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a1a33 0%, #0a1a33 30%, rgba(10,26,51,0.88) 42%, rgba(10,26,51,0) 62%); }
.pill { position: absolute; left: 56px; top: 56px; padding: 12px 30px; border-radius: 999px; background: #d7263d; font-size: 36px; font-weight: 900; }
.big { position: absolute; left: 50px; top: 140px; font-size: 156px; font-weight: 900; line-height: 1.06; letter-spacing: -0.04em; text-shadow: 0 8px 30px rgba(0,0,0,0.5); }
.big b { color: #ffc83d; text-shadow: 0 0 40px rgba(255,200,61,0.55); }
.chip { position: absolute; left: 56px; top: 500px; padding: 14px 30px; border-radius: 20px; background: rgba(5,12,28,0.88); border: 4px solid #2ec4a6; font-size: 42px; font-weight: 900; }
.chip span { color: #ffc83d; }
.brand { position: absolute; left: 60px; bottom: 44px; font-size: 32px; font-weight: 900; letter-spacing: 0.12em; } .brand b { color: #d7263d; }
.tag { position: absolute; right: 40px; bottom: 40px; padding: 10px 22px; border-radius: 16px; background: rgba(5,12,28,0.8); font-size: 28px; font-weight: 800; color: #d4dcec; }
</style></head><body>
<div class="face"></div><div class="fade"></div>
<div class="pill">밴쿠버 자녀무상교육</div>
<div class="big"><div>사립인데</div><div><b>무상?</b></div></div>
<div class="chip">엄마 3과목 · 아이 학비 <span>0원</span></div>
<div class="brand"><b>AA</b> CANADA</div>
<div class="tag">알렉산더 컬리지 준학사</div>
</body></html>
