<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { font-family: "Pretendard", sans-serif; color: #fff; word-break: keep-all; position: relative;

.grid { position: absolute; inset: 0; opacity: 0.07; background-image: linear-gradient(#fff 2px, rgba(255,255,255,0) 2px), linear-gradient(90deg, #fff 2px, rgba(255,255,255,0) 2px); background-size: 80px 80px; }
.pill { position: absolute; left: 64px; top: 60px; padding: 12px 30px; border-radius: 999px; background: #d7263d; font-size: 36px; font-weight: 900; }
.big { position: absolute; left: 60px; top: 150px; font-size: 150px; font-weight: 900; line-height: 1.08; letter-spacing: -0.04em; }

.chip { position: absolute; left: 64px; top: 500px; padding: 14px 30px; border-radius: 20px; background: rgba(5,12,28,0.8); border: 4px solid #2ec4a6; font-size: 42px; font-weight: 900; }
.chip span { color: #ffc83d; }
.deg { position: absolute; right: 60px; top: 300px; width: 420px; padding: 26px 30px; border-radius: 22px; color: #0a1a33; background: linear-gradient(135deg, #fffaf0 0%, #f0e3c2 100%);
  border: 6px double #c48a00; transform: rotate(4deg); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
.deg small { display: block; font-size: 20px; font-weight: 900; letter-spacing: 0.16em; color: #7a5200; } .deg b { display: block; font-size: 44px; font-weight: 900; margin-top: 4px; }
.ok { position: absolute; right: 50px; top: 220px; padding: 8px 22px; border: 8px solid #2ec4a6; border-radius: 18px; color: #2ec4a6; font-size: 44px; font-weight: 900; transform: rotate(-10deg); background: rgba(10,26,51,0.9); }
.brand { position: absolute; right: 64px; top: 70px; font-size: 34px; font-weight: 900; letter-spacing: 0.12em; } .brand b { color: #d7263d; }
.sky { position: absolute; left: 0; bottom: 0; }
</style></head><body><div class="grid"></div>
