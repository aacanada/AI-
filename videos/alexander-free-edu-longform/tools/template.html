      K.pulse("#s11-btn", M.z_kakao + 0.5, TOTAL - 0.1);
      const nP = Math.max(1, Math.floor((TOTAL - M.z_kakao - 0.6) / 1.0));
      tl.fromTo("#s11-bring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.3, duration: 1.0, repeat: nP - 1, ease: "power2.out" }, M.z_kakao + 0.5);
      K.burst(M.z_kakao + 0.3, 760, 660, { n: 70, seed: 97, sp: 900 });
