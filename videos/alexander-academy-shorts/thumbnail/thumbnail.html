<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><style>
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("../assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 900; src: url("../assets/fonts/Pretendard-Black.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: "Pretendard", sans-serif; color: #fff; word-break: keep-all; position: relative;
  background: radial-gradient(900px 900px at 80% 15%, rgba(58,48,150,0.95) 0%, rgba(58,48,150,0) 70%),
              radial-gradient(800px 800px at 10% 85%, rgba(215,38,61,0.35) 0%, rgba(215,38,61,0) 70%),
              linear-gradient(180deg, #0b0f1f 0%, #1b1f4a 100%); }
.grid { position: absolute; inset: 0; opacity: 0.07; background-image: linear-gradient(#fff 2px, rgba(255,255,255,0) 2px), linear-gradient(90deg, #fff 2px, rgba(255,255,255,0) 2px); background-size: 90px 90px; }
.pill { position: absolute; top: 250px; left: 0; right: 0; margin: 0 auto; width: 560px; text-align: center; padding: 22px 0; border-radius: 999px; background: #d7263d; font-size: 50px; font-weight: 900; }
.lines { position: absolute; top: 450px; left: 0; right: 0; text-align: center; }
.l { font-size: 128px; font-weight: 900; line-height: 1.2; letter-spacing: -0.04em; }
.l .s { color: #a9b8ff; }
.l b { color: #ffc83d; font-size: 168px; text-shadow: 0 0 50px rgba(255,200,61,0.55); }
.chips { position: absolute; top: 1240px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.chip { padding: 18px 40px; border-radius: 24px; background: rgba(5,8,22,0.8); border: 4px solid #3a86ff; font-size: 52px; font-weight: 900; }
.chip.g { border-color: #2ec4a6; }
.chip span { color: #ffc83d; }
.brand { position: absolute; top: 1520px; left: 0; right: 0; text-align: center; font-size: 60px; font-weight: 900; letter-spacing: 0.12em; }
.brand b { color: #d7263d; }
</style></head><body><div class="grid"></div>
<div class="pill">밴쿠버 조기유학</div>
<div class="lines">
  <div class="l"><span class="s">고등학생이</span></div>
  <div class="l">대학 <b>7과목</b></div>
  <div class="l"><b>1년</b> 먼저 UBC</div>
</div>
<div class="chips"><div class="chip">추가 학비 없이 <span>21학점</span></div><div class="chip g">알렉산더 아카데미</div></div>
<div class="brand"><b>AA</b> CANADA</div>
</body></html>
