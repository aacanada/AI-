<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Selkirk RCIP thumbnail</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
@font-face{font-family:Pretendard;font-weight:800;src:url(assets/fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(assets/fonts/Pretendard-Black.woff2) format("woff2")}
@font-face{font-family:Yellowtail;font-weight:400;src:url(assets/fonts/Yellowtail-Regular.ttf) format("truetype")}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FAF6EF; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FAF6EF; color: #16324F; font-family: Pretendard, sans-serif; word-break: keep-all }
#root .abs { position: absolute }
#root .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(46,125,91,.22) 0%, rgba(46,125,91,0) 70%) }
#root .pol { position: absolute; background: #fff; padding: 18px 18px 70px; box-shadow: 0 24px 50px rgba(22,50,79,.3) }
#root .pol img { width: 100%; height: 100%; object-fit: cover; display: block }
#root .pol .cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-family: Yellowtail, cursive; font-size: 40px }
#root .strike { position: absolute; height: 26px; background: #E8572B; border-radius: 13px }
#root .sticker { position: absolute; background: #E8572B; color: #fff; font-weight: 900; font-size: 46px; padding: 16px 36px; border-radius: 99px; transform: rotate(-5deg) }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div class="glow" style="left:1100px;top:-400px;width:1200px;height:1200px"></div>
      <div class="abs" style="left:90px;top:90px;font-weight:900;font-size:44px;color:#2E7D5B;letter-spacing:.04em">셀커크 컬리지 × RCIP</div>
      <div class="abs" style="left:80px;top:170px;font-weight:900;font-size:250px;line-height:1;color:#9AA6B2">시골</div>
      <div class="strike" style="left:70px;top:280px;width:540px;transform:rotate(-4deg)"></div>
      <div class="abs" style="left:640px;top:200px;font-weight:900;font-size:150px;line-height:1">아닙니다</div>
      <div class="abs" style="left:80px;top:470px;font-weight:900;font-size:150px;line-height:1.08;letter-spacing:-.03em;color:#2E7D5B">휴양도시에서<br/>영주권까지</div>
      <div class="sticker" style="left:90px;top:840px">경력 0년도 지원 가능</div>
      <div class="pol" style="left:1340px;top:150px;width:500px;height:620px;transform:rotate(5deg)"><img src="assets/img/aerial-lake-campus.jpg" alt=""/><div class="cap">West Kootenay, BC</div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
