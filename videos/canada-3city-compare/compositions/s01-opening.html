<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><title>오프닝</title></head>
  <body>
    <template>
      <style>
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Medium.woff2") format("woff2");font-weight:500;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");font-weight:800;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Black.woff2") format("woff2");font-weight:900;font-style:normal;}

#s01-opening{position:absolute;inset:0;
  --paper:#F5F2EA; --paper2:#ECE7DA; --ink:#1C2431; --ink2:#4E5767; --rule:#C9C1AE;
  --van:#5B3FA0; --tor:#13845A; --mtl:#D2343F; --marker:#F7D046;font-family:"Pretendard",sans-serif;color:var(--ink);overflow:hidden;}
#s01-opening *{box-sizing:border-box;margin:0;padding:0;}
#s01-opening .stage{position:absolute;inset:0;padding:150px 120px 170px;}
#s01-opening .ghost{position:absolute;right:-40px;bottom:120px;font-size:300px;font-weight:900;color:var(--ink);opacity:.06;white-space:nowrap;letter-spacing:-.04em;line-height:1;}
#s01-opening .chap{display:flex;align-items:center;gap:26px;height:96px;}
#s01-opening .chap .n{width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;}
#s01-opening .chap h2{font-size:66px;font-weight:900;letter-spacing:-.02em;}
#s01-opening .chap .sub{font-size:34px;font-weight:600;color:var(--ink2);padding-left:24px;border-left:4px solid var(--rule);}
#s01-opening .van{--c:var(--van);} #s01-opening .tor{--c:var(--tor);} #s01-opening .mtl{--c:var(--mtl);}
#s01-opening .cc{color:var(--c);}
#s01-opening .pill{display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:800;color:var(--c);}
#s01-opening .pill::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--c);}
#s01-opening .mk{position:relative;display:inline-block;isolation:isolate;}
#s01-opening .mk .mkb{position:absolute;left:-8px;right:-8px;bottom:4%;height:46%;background:var(--marker);display:block;transform-origin:left center;transform:scaleX(0);border-radius:4px;}
#s01-opening .mk .mkt{position:relative;}
#s01-opening .card{position:relative;background:#FBF9F4;border:3px solid var(--rule);border-radius:22px;overflow:hidden;}
#s01-opening .card.cityc{border-color:var(--c);}
#s01-opening .card .bar{position:absolute;left:0;top:0;right:0;height:14px;background:var(--c);}
#s01-opening .note{font-size:34px;font-weight:600;color:var(--ink2);}
#s01-opening .big{font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
#s01-opening .tag{display:inline-flex;align-items:center;padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:32px;font-weight:700;}
#s01-opening .tag.lite{background:var(--paper2);color:var(--ink);border:3px solid var(--rule);}
#s01-opening .arrow{font-weight:900;color:var(--ink2);}
#s01-opening .src{position:absolute;right:120px;bottom:178px;font-size:22px;font-weight:600;color:var(--ink2);}


#s01-opening .kick{font-size:38px;font-weight:700;color:var(--ink2);}
#s01-opening h1{font-size:110px;font-weight:900;letter-spacing:-.035em;line-height:1.1;margin-top:14px;}
#s01-opening h1 .vs{color:var(--ink2);font-weight:700;font-size:72px;padding:0 14px;}
#s01-opening .subt{font-size:52px;font-weight:800;margin-top:22px;}
#s01-opening .chips{position:absolute;left:120px;top:470px;display:flex;gap:18px;}

#s01-opening .crow{position:absolute;left:120px;right:120px;top:560px;height:310px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;}
#s01-opening .crow .card{padding:40px 44px 0;}
#s01-opening .cn{font-size:70px;font-weight:900;letter-spacing:-.03em;line-height:1.15;}
#s01-opening .cp{font-size:30px;font-weight:600;color:var(--ink2);margin-top:8px;}
#s01-opening .card.empty{border:4px dashed var(--rule);background:transparent;display:flex;align-items:center;justify-content:center;}
#s01-opening .q{font-size:140px;font-weight:900;color:var(--rule);}
      </style>
      <div id="s01-opening" data-composition-id="s01-opening" data-width="1920" data-height="1080">
        
        <div class="stage">

<div class="kick" data-at="0.3" data-fx="up">캐나다 자녀동반유학</div>
<h1 data-at="0.7" data-fx="up"><span class="cc van">밴쿠버</span><span class="vs">vs</span><span class="cc tor">토론토</span><span class="vs">vs</span><span class="cc mtl">몬트리올</span></h1>
<div class="subt" data-at="1.3" data-fx="up"><span class="mk" data-at="2" data-fx="mark"><span class="mkb"></span><span class="mkt">8가지 기준</span></span>으로 비교해 봤어요</div>
<div class="chips"><div class="tag lite" data-at="27.29" data-fx="pop">자녀 교육환경</div><div class="tag lite" data-at="31.45" data-fx="pop">문화적 환경</div><div class="tag lite" data-at="34.2" data-fx="pop">생활 편의성</div><div class="tag" data-at="37.88" data-fx="pop">→ 결국 대도시</div></div>
<div class="crow"><div class="card cityc van" data-at="18.6" data-fx="pop"><div class="bar"></div><div class="cn cc">밴쿠버</div><div class="cp">브리티시컬럼비아 · BC</div></div><div class="card cityc tor" data-at="21" data-fx="pop"><div class="bar"></div><div class="cn cc">토론토</div><div class="cp">온타리오 · ON</div></div><div class="card empty" data-at="22" data-fx="fade"><div class="q">?</div></div></div>
        </div>
      </div>
      <script>
        (function () {
          var S = 0, D = 41.85, root = document.getElementById("s01-opening");
          var tl = gsap.timeline({ paused: true });
          var stage = root.querySelector(".stage"), ghost = root.querySelector(".ghost");
          tl.fromTo(stage, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          
          if (ghost) tl.fromTo(ghost, { x: 0 }, { x: -220, duration: D, ease: "none" }, 0);
          var FX = {
            up: [{ y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }],
            left: [{ x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            right: [{ x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            pop: [{ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }],
            fade: [{ opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }],
            barx: [{ scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }],
            bary: [{ scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out" }]
          };
          function fmt(v, el) {
            var dec = +(el.getAttribute("data-dec") || 0), s = v.toFixed(dec);
            if (el.hasAttribute("data-comma")) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
            return (el.getAttribute("data-pre") || "") + s + (el.getAttribute("data-suf") || "");
          }
          root.querySelectorAll("[data-at]").forEach(function (el) {
            var t = Math.max(0, +el.getAttribute("data-at") - S);
            (el.getAttribute("data-fx") || "up").split(" ").forEach(function (fx) {
              if (FX[fx]) tl.fromTo(el, FX[fx][0], FX[fx][1], t);
              else if (fx === "mark") { var b = el.querySelector(".mkb"); if (b) tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.15); }
              else if (fx === "count") {
                var o = { v: +(el.getAttribute("data-from") || 0) }, to = +el.getAttribute("data-to");
                el.textContent = fmt(o.v, el);
                tl.fromTo(o, { v: o.v }, { v: to, duration: 1.1, ease: "power2.out", onUpdate: function () { el.textContent = fmt(o.v, el); } }, t);
              } else if (fx === "ring") {
                var c = el.querySelector(".ringv"), C = 2 * Math.PI * +c.getAttribute("r"), p = +el.getAttribute("data-p");
                c.style.strokeDasharray = C; tl.fromTo(c, { strokeDashoffset: C }, { strokeDashoffset: C * (1 - p), duration: 1.2, ease: "power3.out" }, t);
              } else if (fx === "dim") tl.fromTo(el, { opacity: 1 }, { opacity: 0.22, duration: 0.5, ease: "power1.out", immediateRender: false }, t);
            });
          });
          root.querySelectorAll("[data-out]").forEach(function (el) {
            var t = +el.getAttribute("data-out") - S;
            tl.fromTo(el, { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", immediateRender: false }, t);
          });
          window.__timelines["s01-opening"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
