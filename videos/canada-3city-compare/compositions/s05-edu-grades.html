#s05-edu-grades{position:absolute;inset:0;

#s05-edu-grades .chap .n{width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;}

#s05-edu-grades .chap .sub{font-size:34px;font-weight:600;color:var(--ink2);padding-left:24px;border-left:4px solid var(--rule);}
#s05-edu-grades .van{--c:var(--van);} #s05-edu-grades .tor{--c:var(--tor);} #s05-edu-grades .mtl{--c:var(--mtl);}
#s05-edu-grades .cc{color:var(--c);}

#s05-edu-grades .card{position:relative;background:#FBF9F4;border:3px solid var(--rule);border-radius:22px;overflow:hidden;}

#s05-edu-grades .big{font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
#s05-edu-grades .tag{display:inline-flex;align-items:center;padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:32px;font-weight:700;}
#s05-edu-grades .tag.lite{background:var(--paper2);color:var(--ink);border:3px solid var(--rule);}
#s05-edu-grades .arrow{font-weight:900;color:var(--ink2);}
#s05-edu-grades .src{position:absolute;right:120px;bottom:178px;font-size:22px;font-weight:600;color:var(--ink2);}


#s05-edu-grades .lead{font-size:36px;font-weight:700;color:var(--ink2);margin-top:24px;}
#s05-edu-grades .cols{position:absolute;left:120px;right:120px;top:330px;height:540px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;}
#s05-edu-grades .card{padding:60px 40px 0;display:flex;flex-direction:column;gap:26px;}
#s05-edu-grades .card .pill{font-size:52px;}
#s05-edu-grades .k{font-size:44px;font-weight:900;line-height:1.3;}
#s05-edu-grades .s{font-size:32px;font-weight:700;color:var(--ink2);line-height:1.4;}
#s05-edu-grades .row{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:800;}
#s05-edu-grades .row b{display:inline-block;padding:6px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:28px;}
      </style>
      <div id="s05-edu-grades" data-composition-id="s05-edu-grades" data-width="1920" data-height="1080">
        
        <div class="stage">

<div class="chap" data-at="174.6" data-fx="left"><div class="n">1</div><h2>교육환경</h2><div class="sub">학년별로 많이 가는 도시</div></div>
<div class="lead" data-at="174.9" data-fx="up">유학업계에서 실제로 보면</div>
<div class="cols">
  <div class="card cityc van" data-at="177.2" data-fx="pop"><div class="bar"></div><div class="pill van" >밴쿠버</div><div class="k"><span class="mk" data-at="178.3" data-fx="mark"><span class="mkb"></span><span class="mkt">초등학생</span></span><br/>비율이 높은 편</div></div>
  <div class="card cityc tor" data-at="180.66" data-fx="pop"><div class="bar"></div><div class="pill tor" >토론토</div><div class="k"><span class="mk" data-at="182.2" data-fx="mark"><span class="mkb"></span><span class="mkt">중학생 이상</span></span><br/>학년이 높을수록</div></div>
  <div class="card cityc mtl" data-at="186.55" data-fx="pop"><div class="bar"></div><div class="pill mtl" >몬트리올</div><div class="s">숫자는 적지만</div>
    <div class="k" data-at="193.43" data-fx="up">영어+불어 둘 다 →<br/><span class="mk" data-at="195.5" data-fx="mark"><span class="mkb"></span><span class="mkt">저학년이 유리</span></span></div>
    <div class="row" data-at="200.89" data-fx="up"><b>단기</b>영어에 집중</div>
    <div class="row" data-at="204.86" data-fx="up"><b>장기</b>영어 + 불어</div></div>
</div>
        </div>
      </div>
      <script>
        (function () {
          var S = 174.39, D = 38.75, root = document.getElementById("s05-edu-grades");
          var tl = gsap.timeline({ paused: true });
          var stage = root.querySelector(".stage"), ghost = root.querySelector(".ghost");
          tl.fromTo(stage, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(stage, { x: 0, opacity: 1 }, { x: -90, opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, D - 0.45);
          if (ghost) tl.fromTo(ghost, { x: 0 }, { x: -220, duration: D, ease: "none" }, 0);
          var FX = {
            up: [{ y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }],
            left: [{ x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            right: [{ x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            pop: [{ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }],
            fade: [{ opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }],
            barx: [{ scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }],
            bary: [{ scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out" }]
          };
          function fmt(v, el) {
            var dec = +(el.getAttribute("data-dec") || 0), s = v.toFixed(dec);
            if (el.hasAttribute("data-comma")) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
            return (el.getAttribute("data-pre") || "") + s + (el.getAttribute("data-suf") || "");
          }
          root.querySelectorAll("[data-at]").forEach(function (el) {
            var t = Math.max(0, +el.getAttribute("data-at") - S);
            (el.getAttribute("data-fx") || "up").split(" ").forEach(function (fx) {
              if (FX[fx]) tl.fromTo(el, FX[fx][0], FX[fx][1], t);
              else if (fx === "mark") { var b = el.querySelector(".mkb"); if (b) tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.15); }
              else if (fx === "count") {
                var o = { v: +(el.getAttribute("data-from") || 0) }, to = +el.getAttribute("data-to");
                el.textContent = fmt(o.v, el);
                tl.fromTo(o, { v: o.v }, { v: to, duration: 1.1, ease: "power2.out", onUpdate: function () { el.textContent = fmt(o.v, el); } }, t);
              } else if (fx === "ring") {
                var c = el.querySelector(".ringv"), C = 2 * Math.PI * +c.getAttribute("r"), p = +el.getAttribute("data-p");
                c.style.strokeDasharray = C; tl.fromTo(c, { strokeDashoffset: C }, { strokeDashoffset: C * (1 - p), duration: 1.2, ease: "power3.out" }, t);
              } else if (fx === "dim") tl.fromTo(el, { opacity: 1 }, { opacity: 0.22, duration: 0.5, ease: "power1.out", immediateRender: false }, t);
            });
          });
          root.querySelectorAll("[data-out]").forEach(function (el) {
            var t = +el.getAttribute("data-out") - S;
            tl.fromTo(el, { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", immediateRender: false }, t);
          });
          window.__timelines["s05-edu-grades"] = tl;
        })();
      </script>
