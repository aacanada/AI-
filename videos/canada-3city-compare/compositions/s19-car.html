@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-style:normal;}

#s19-car .hb.in b{bottom:auto;top:50%;right:8px;margin:0;transform:translateY(-50%);font-size:20px;padding:2px 10px;}
#s19-car .hb.ink{--c:var(--ink);} #s19-car .hb.mark{--c:#E0B417;}
#s19-car .capt{position:absolute;left:14px;top:14px;z-index:2;background:var(--ink);color:var(--paper);font-size:20px;font-weight:800;padding:6px 14px;border-radius:8px;}
#s19-car .src{position:absolute;right:120px;bottom:178px;font-size:22px;font-weight:600;color:var(--ink2);}


#s19-car .two{position:absolute;left:120px;right:120px;top:290px;height:380px;display:grid;grid-template-columns:1fr 1fr;gap:50px;}
#s19-car .two .card{padding:56px 46px 0;}
#s19-car .pills{display:flex;gap:30px;}
#s19-car .pills .pill{font-size:48px;}
#s19-car .k{font-size:50px;font-weight:900;margin-top:30px;line-height:1.3;}
#s19-car .s{font-size:31px;font-weight:700;color:var(--ink2);margin-top:18px;}
#s19-car .strip{position:absolute;left:120px;right:120px;top:710px;display:flex;align-items:center;gap:22px;}
#s19-car .strip .tag{font-size:32px;}
#s19-car .eq{font-size:44px;font-weight:900;color:var(--ink2);}
      </style>
      <div id="s19-car" data-composition-id="s19-car" data-width="1920" data-height="1080">
        
        <div class="stage">

<div class="chap" data-at="1030.4" data-fx="left"><div class="n">8</div><h2>자동차</h2><div class="sub">구입이 필요할까?</div></div>
<div class="two">
  <div class="card" style="border-color:var(--ink)" data-at="1033.62" data-fx="pop"><div class="pills"><div class="pill van" >밴쿠버</div><div class="pill tor" >토론토</div></div><div class="k">보통 <span class="mk" data-at="1035" data-fx="mark"><span class="mkb"></span><span class="mkt">자동차 구입 필요</span></span></div></div>
  <div class="card cityc mtl" data-at="1037.8" data-fx="pop"><div class="bar"></div><div class="pill mtl" >몬트리올</div><div class="k">1~2년 단기라면<br/>안 사는 경우가 더 많아요</div><div class="s" data-at="1043.61" data-fx="up">꼭 필요할 땐 공유자동차 서비스</div></div>
</div>
<div class="strip"><div class="tag lite" data-at="1048.41" data-fx="pop">한국보다 비싼 보험료</div><div class="tag lite" data-at="1051.8" data-fx="pop">주차비</div><div class="eq" data-at="1053.11" data-fx="fade">=</div><div class="tag" data-at="1053.4" data-fx="pop">매달 나가는 기본 지출</div><div style="font-size:36px;font-weight:900;margin-left:16px" data-at="1056.82" data-fx="up"><span class="mk" data-at="1058" data-fx="mark"><span class="mkb"></span><span class="mkt">예산에 꼭 포함</span></span></div></div>
        </div>
      </div>
      <script>
        (function () {
          var S = 1030.17, D = 32.35, root = document.getElementById("s19-car");
          var tl = gsap.timeline({ paused: true });
          var stage = root.querySelector(".stage"), ghost = root.querySelector(".ghost");
          tl.fromTo(stage, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(stage, { x: 0, opacity: 1 }, { x: -90, opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, D - 0.45);
          if (ghost) tl.fromTo(ghost, { x: 0 }, { x: -220, duration: D, ease: "none" }, 0);
          var FX = {
            up: [{ y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }],
            left: [{ x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            right: [{ x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            pop: [{ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }],
            fade: [{ opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }],
            barx: [{ scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }],
            bary: [{ scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out" }]
          };
          function fmt(v, el) {
            var dec = +(el.getAttribute("data-dec") || 0), s = v.toFixed(dec);
            if (el.hasAttribute("data-comma")) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
            return (el.getAttribute("data-pre") || "") + s + (el.getAttribute("data-suf") || "");
          }
          root.querySelectorAll("[data-at]").forEach(function (el) {
            var t = Math.max(0, +el.getAttribute("data-at") - S);
            (el.getAttribute("data-fx") || "up").split(" ").forEach(function (fx) {
              if (FX[fx]) tl.fromTo(el, FX[fx][0], FX[fx][1], t);
              else if (fx === "mark") { var b = el.querySelector(".mkb"); if (b) tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.15); }
              else if (fx === "count") {
                var o = { v: +(el.getAttribute("data-from") || 0) }, to = +el.getAttribute("data-to");
                el.textContent = fmt(o.v, el);
                tl.fromTo(o, { v: o.v }, { v: to, duration: 1.1, ease: "power2.out", onUpdate: function () { el.textContent = fmt(o.v, el); } }, t);
              } else if (fx === "ring") {
                var c = el.querySelector(".ringv"), C = 2 * Math.PI * +c.getAttribute("r"), p = +el.getAttribute("data-p");
                c.style.strokeDasharray = C; tl.fromTo(c, { strokeDashoffset: C }, { strokeDashoffset: C * (1 - p), duration: 1.2, ease: "power3.out" }, t);
              } else if (fx === "dim") tl.fromTo(el, { opacity: 1 }, { opacity: 0.22, duration: 0.5, ease: "power1.out", immediateRender: false }, t);
            });
          });
          root.querySelectorAll("[data-out]").forEach(function (el) {
            var t = +el.getAttribute("data-out") - S;
            tl.fromTo(el, { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", immediateRender: false }, t);
          });
          
          window.__timelines["s19-car"] = tl;
        })();
      </script>
