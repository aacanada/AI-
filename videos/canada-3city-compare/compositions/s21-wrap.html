<!doctype html>

      <style>
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Medium.woff2") format("woff2");font-weight:500;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700;font-style:normal;}
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");font-weight:800;font-style:normal;}

#s21-wrap{position:absolute;inset:0;
  --paper:#F5F2EA; --paper2:#ECE7DA; --ink:#1C2431; --ink2:#4E5767; --rule:#C9C1AE;
  --van:#5B3FA0; --tor:#13845A; --mtl:#D2343F; --marker:#F7D046;font-family:"Pretendard",sans-serif;color:var(--ink);overflow:hidden;}
#s21-wrap *{box-sizing:border-box;margin:0;padding:0;}
#s21-wrap .stage{position:absolute;inset:0;padding:150px 120px 170px;}
#s21-wrap .ghost{position:absolute;right:-40px;bottom:120px;font-size:300px;font-weight:900;color:var(--ink);opacity:.06;white-space:nowrap;letter-spacing:-.04em;line-height:1;}
#s21-wrap .chap{display:flex;align-items:center;gap:26px;height:96px;}
#s21-wrap .chap .n{width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;}
#s21-wrap .chap h2{font-size:66px;font-weight:900;letter-spacing:-.02em;}
#s21-wrap .chap .sub{font-size:34px;font-weight:600;color:var(--ink2);padding-left:24px;border-left:4px solid var(--rule);}
#s21-wrap .van{--c:var(--van);} #s21-wrap .tor{--c:var(--tor);} #s21-wrap .mtl{--c:var(--mtl);}
#s21-wrap .cc{color:var(--c);}
#s21-wrap .pill{display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:800;color:var(--c);}
#s21-wrap .pill::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--c);}
#s21-wrap .mk{position:relative;display:inline-block;isolation:isolate;}
#s21-wrap .mk .mkb{position:absolute;left:-8px;right:-8px;bottom:4%;height:46%;background:var(--marker);display:block;transform-origin:left center;transform:scaleX(0);border-radius:4px;}
#s21-wrap .mk .mkt{position:relative;}
#s21-wrap .card{position:relative;background:#FBF9F4;border:3px solid var(--rule);border-radius:22px;overflow:hidden;}
#s21-wrap .card.cityc{border-color:var(--c);}
#s21-wrap .card .bar{position:absolute;left:0;top:0;right:0;height:14px;background:var(--c);}
#s21-wrap .note{font-size:34px;font-weight:600;color:var(--ink2);}
#s21-wrap .big{font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
#s21-wrap .tag{display:inline-flex;align-items:center;padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:32px;font-weight:700;}
#s21-wrap .tag.lite{background:var(--paper2);color:var(--ink);border:3px solid var(--rule);}
#s21-wrap .arrow{font-weight:900;color:var(--ink2);}
#s21-wrap .doc{position:absolute;background:#fff;border:3px solid var(--rule);border-radius:18px;overflow:hidden;box-shadow:0 26px 60px rgba(28,36,49,.22);}
#s21-wrap .doc .cam{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;}
#s21-wrap .doc img{display:block;width:100%;height:100%;}
#s21-wrap .hb{position:absolute;border:5px solid var(--c);border-radius:8px;box-shadow:0 0 0 4px rgba(255,255,255,.7);}
#s21-wrap .hb b{position:absolute;right:-5px;bottom:100%;margin-bottom:6px;white-space:nowrap;background:var(--c);color:#fff;font-size:22px;font-weight:800;padding:4px 12px;border-radius:8px;}
#s21-wrap .hb.in b{bottom:auto;top:50%;right:8px;margin:0;transform:translateY(-50%);font-size:20px;padding:2px 10px;}
#s21-wrap .hb.ink{--c:var(--ink);} #s21-wrap .hb.mark{--c:#E0B417;}
#s21-wrap .capt{position:absolute;left:14px;top:14px;z-index:2;background:var(--ink);color:var(--paper);font-size:20px;font-weight:800;padding:6px 14px;border-radius:8px;}
#s21-wrap .src{position:absolute;right:120px;bottom:178px;font-size:22px;font-weight:600;color:var(--ink2);}


#s21-wrap .h{font-size:64px;font-weight:900;}
#s21-wrap .crit{position:absolute;left:120px;right:120px;top:290px;}

#s21-wrap .crit{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
#s21-wrap .ct{display:flex;align-items:center;gap:26px;height:150px;padding:0 36px;background:#FBF9F4;border:3px solid var(--rule);border-radius:22px;}
#s21-wrap .ctn{width:76px;height:76px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;}
#s21-wrap .ct:last-child .ctn{background:var(--marker);color:var(--ink);}
#s21-wrap .ctt{font-size:42px;font-weight:800;}
#s21-wrap .ct{height:140px;}
#s21-wrap .msg{position:absolute;left:120px;right:120px;top:330px;}
#s21-wrap .m1{font-size:46px;font-weight:700;color:var(--ink2);}
#s21-wrap .m2{font-size:96px;font-weight:900;letter-spacing:-.03em;line-height:1.2;margin-top:34px;}
      </style>
      <div id="s21-wrap" data-composition-id="s21-wrap" data-width="1920" data-height="1080">
        
        <div class="stage">

<div class="h" data-at="1130.6" data-fx="up" data-out="1140.5">8가지 기준으로 비교해 봤습니다</div>
<div data-out="1140.5"><div class="crit"><div class="ct" data-at="1131.20" data-fx="pop"><span class="ctn">1</span><span class="ctt">교육환경</span></div><div class="ct" data-at="1131.50" data-fx="pop"><span class="ctn">2</span><span class="ctt">거주비</span></div><div class="ct" data-at="1131.80" data-fx="pop"><span class="ctn">3</span><span class="ctt">학비 (조기유학)</span></div><div class="ct" data-at="1132.10" data-fx="pop"><span class="ctn">4</span><span class="ctt">부모 학비 (무상교육)</span></div><div class="ct" data-at="1132.40" data-fx="pop"><span class="ctn">5</span><span class="ctt">문화적 환경</span></div><div class="ct" data-at="1132.70" data-fx="pop"><span class="ctn">6</span><span class="ctt">인구 구성</span></div><div class="ct" data-at="1133.00" data-fx="pop"><span class="ctn">7</span><span class="ctt">날씨</span></div><div class="ct" data-at="1133.30" data-fx="pop"><span class="ctn">8</span><span class="ctt">자동차</span></div><div class="ct" data-at="1133.60" data-fx="pop"><span class="ctn">+</span><span class="ctt">자녀 언어향상</span></div></div></div>
<div class="msg">
  <div class="m1" data-at="1140.89" data-fx="up">가정마다 중요한 기준은 다 다를 거예요</div>
  <div class="m2" data-at="1144.54" data-fx="up">우리 가족의<br/><span class="mk" data-at="1148.41" data-fx="mark"><span class="mkb"></span><span class="mkt">우선순위</span></span>부터 정해보세요</div>
</div>
        </div>
      </div>
      <script>
        (function () {
          var S = 1130.33, D = 27.39, root = document.getElementById("s21-wrap");
          var tl = gsap.timeline({ paused: true });
          var stage = root.querySelector(".stage"), ghost = root.querySelector(".ghost");
          tl.fromTo(stage, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo(stage, { x: 0, opacity: 1 }, { x: -90, opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, D - 0.45);
          if (ghost) tl.fromTo(ghost, { x: 0 }, { x: -220, duration: D, ease: "none" }, 0);
          var FX = {
            up: [{ y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }],
            left: [{ x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            right: [{ x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }],
            pop: [{ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }],
            fade: [{ opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }],
            barx: [{ scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }],
            bary: [{ scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out" }]
          };
          function fmt(v, el) {
            var dec = +(el.getAttribute("data-dec") || 0), s = v.toFixed(dec);
            if (el.hasAttribute("data-comma")) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
            return (el.getAttribute("data-pre") || "") + s + (el.getAttribute("data-suf") || "");
          }
          root.querySelectorAll("[data-at]").forEach(function (el) {
            var t = Math.max(0, +el.getAttribute("data-at") - S);
            (el.getAttribute("data-fx") || "up").split(" ").forEach(function (fx) {
              if (FX[fx]) tl.fromTo(el, FX[fx][0], FX[fx][1], t);
              else if (fx === "mark") { var b = el.querySelector(".mkb"); if (b) tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.15); }
              else if (fx === "count") {
                var o = { v: +(el.getAttribute("data-from") || 0) }, to = +el.getAttribute("data-to");
                el.textContent = fmt(o.v, el);
                tl.fromTo(o, { v: o.v }, { v: to, duration: 1.1, ease: "power2.out", onUpdate: function () { el.textContent = fmt(o.v, el); } }, t);
              } else if (fx === "ring") {
                var c = el.querySelector(".ringv"), C = 2 * Math.PI * +c.getAttribute("r"), p = +el.getAttribute("data-p");
                c.style.strokeDasharray = C; tl.fromTo(c, { strokeDashoffset: C }, { strokeDashoffset: C * (1 - p), duration: 1.2, ease: "power3.out" }, t);
              } else if (fx === "dim") tl.fromTo(el, { opacity: 1 }, { opacity: 0.22, duration: 0.5, ease: "power1.out", immediateRender: false }, t);
            });
          });
          root.querySelectorAll("[data-out]").forEach(function (el) {
            var t = +el.getAttribute("data-out") - S;
            tl.fromTo(el, { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", immediateRender: false }, t);
          });
          
          window.__timelines["s21-wrap"] = tl;
        })();
      </script>
    </template>
