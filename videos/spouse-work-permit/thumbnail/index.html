<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Black.woff2") format("woff2");font-weight:900;}
      @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");font-weight:800;}
      @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700;}
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:#18233A; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:"Pretendard",sans-serif; color:#F4EFE6; word-break:keep-all; }
      #bg { position:absolute; inset:0; background:radial-gradient(circle at 78% 40%, #2A3B5E 0%, #18233A 60%); }
      #grid { position:absolute; inset:0; opacity:.5;
        background-image:linear-gradient(rgba(244,239,230,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(244,239,230,.06) 2px,transparent 2px);
        background-size:90px 90px; }
      #leaf { position:absolute; right:-150px; top:-120px; width:900px; height:900px; opacity:.16; }
      #edge { position:absolute; left:0; top:0; bottom:0; width:28px; background:#C8281E; }
      #tag { position:absolute; left:100px; top:86px; display:flex; align-items:center; gap:18px;
        background:#C8281E; color:#FFF; font-size:52px; font-weight:900; padding:14px 34px; border-radius:14px; letter-spacing:-0.01em; }
      #l1 { position:absolute; left:96px; top:230px; font-size:230px; font-weight:900; letter-spacing:-0.055em; line-height:1; color:#FFFFFF; }
      #l2 { position:absolute; left:96px; top:500px; font-size:168px; font-weight:900; letter-spacing:-0.05em; line-height:1; color:#FFFFFF; }
      #l2 .hl { color:#18233A; background:#FFD43B; padding:0 22px 6px; border-radius:16px; }
      #sub { position:absolute; left:100px; top:760px; font-size:62px; font-weight:800; color:#F4EFE6; letter-spacing:-0.02em; }
      #sub b { color:#FFD43B; }
      .stamp { position:absolute; display:flex; align-items:center; justify-content:center; font-weight:900; white-space:nowrap;
        border:12px solid currentColor; border-radius:22px; padding:6px 34px; background:rgba(24,35,58,.6); }
      #ok { right:90px; top:715px; font-size:96px; color:#3DDC84; }
      #no { right:150px; top:890px; font-size:96px; color:#FF4D3D; }
      #brand { position:absolute; left:100px; bottom:70px; display:flex; align-items:center; gap:16px; font-size:46px; font-weight:900; color:#F4EFE6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="grid"></div>
      <svg id="leaf" viewBox="0 0 64 64"><path fill="#C8281E" d="M32 4l5 11 7-4-2 14 9-6 2 6 9-2-5 12 4 3-15 9 2 8-14-3v12h-4V52l-14 3 2-8-15-9 4-3-5-12 9 2 2-6 9 6-2-14 7 4z"/></svg>
      <div id="edge"></div>
      <div id="tag">🇨🇦 2025년 규정 변경</div>
      <div id="l1">배우자 워크퍼밋</div>
      <div id="l2">이제 <span class="hl">아무나 안 됩니다</span></div>
      <div id="sub">나는 될까? <b>학생비자 · 취업비자</b> 기준 총정리</div>
      <div class="stamp" id="ok" style="transform:rotate(-8deg)">가능 ✓</div>
      <div class="stamp" id="no" style="transform:rotate(6deg)">불가 ✕</div>
      <div id="brand"><svg width="54" height="54" viewBox="0 0 64 64"><path fill="#C8281E" d="M32 4l5 11 7-4-2 14 9-6 2 6 9-2-5 12 4 3-15 9 2 8-14-3v12h-4V52l-14 3 2-8-15-9 4-3-5-12 9 2 2-6 9 6-2-14 7 4z"/></svg>AA CANADA</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
