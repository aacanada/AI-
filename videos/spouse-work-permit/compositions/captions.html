      <div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="415.69">
        <div id="cap000" class="clip cap" data-start="1.24" data-duration="0.9" data-track-index="0"><span>안녕하세요,</span></div>
        <div id="cap001" class="clip cap" data-start="2.14" data-duration="4.63" data-track-index="0"><span>캐나다 유학과 이민을 안내하는 AA Canada입니다.</span></div>
        <div id="cap002" class="clip cap" data-start="7.66" data-duration="3.46" data-track-index="0"><span>캐나다 유학이나 취업을 준비하시는 가족분들께서</span></div>
        <div id="cap003" class="clip cap" data-start="11.12" data-duration="4.12" data-track-index="0"><span>상담하실 때 정말 많이 물어보시는 질문이 있습니다.</span></div>
        <div id="cap004" class="clip cap" data-start="15.24" data-duration="4.78" data-track-index="0"><span>"배우자도 캐나다에서 일할 수 있나요?"</span></div>
        <div id="cap005" class="clip cap" data-start="20.02" data-duration="8.15" data-track-index="0"><span>배우자가 일을 할 수 있으면 가족 전체 생활비 부담이 확 줄어드니까,</span></div>
        <div id="cap006" class="clip cap" data-start="28.17" data-duration="4.59" data-track-index="0"><span>당연히 궁금하실 수밖에 없습니다.</span></div>
        <div id="cap007" class="clip cap" data-start="32.76" data-duration="4.36" data-track-index="0"><span>그런데 2025년 1월에 규정이 크게 바뀌고,</span></div>
        <div id="cap008" class="clip cap" data-start="37.12" data-duration="4.83" data-track-index="0"><span>이후에도 세부 지침이 조금씩 업데이트되면서 예전</span></div>
        <div id="cap009" class="clip cap" data-start="41.95" data-duration="5.11" data-track-index="0"><span>정보를 보고 오시는 분들 사이에 혼선이 많습니다.</span></div>
        <div id="cap010" class="clip cap" data-start="47.06" data-duration="2.17" data-track-index="0"><span>오늘 영상에서 배우자 워크퍼밋의 기본 원리부터,</span></div>
        <div id="cap011" class="clip cap" data-start="49.23" data-duration="3.12" data-track-index="0"><span>누가 가능하고 누가 안 되는지까지 한 번에 정리해 드리겠습니다.</span></div>
        <div id="cap012" class="clip cap" data-start="53.91" data-duration="5.38" data-track-index="0"><span>배우자 오픈 워크퍼밋은 말 그대로 열려 있는 취업 허가입니다.</span></div>
        <div id="cap013" class="clip cap" data-start="59.29" data-duration="3.14" data-track-index="0"><span>특정 회사에 묶이지 않고,</span></div>
        <div id="cap014" class="clip cap" data-start="62.43" data-duration="5.96" data-track-index="0"><span>LMIA라는 노동시장영향평가도 필요 없이,</span></div>
        <div id="cap015" class="clip cap" data-start="68.39" data-duration="7.19" data-track-index="0"><span>캐나다 어느 지역 어느 직장에서든 일할 수 있습니다.</span></div>
        <div id="cap016" class="clip cap" data-start="75.58" data-duration="3.08" data-track-index="0"><span>풀타임도 가능합니다.</span></div>
        <div id="cap017" class="clip cap" data-start="78.66" data-duration="2.41" data-track-index="0"><span>여기서 가장 중요한 원리가 하나 있습니다.</span></div>
        <div id="cap018" class="clip cap" data-start="81.07" data-duration="2.57" data-track-index="0"><span>배우자 본인이 어떤 사람이냐가 아니라,</span></div>
        <div id="cap019" class="clip cap" data-start="83.64" data-duration="1.6" data-track-index="0"><span>캐나다에 와 있는 배우자,</span></div>
        <div id="cap020" class="clip cap" data-start="85.24" data-duration="4.09" data-track-index="0"><span>즉 주 신청자가 어떤 자격을 가졌느냐를 본다는 점입니다.</span></div>
        <div id="cap021" class="clip cap" data-start="89.33" data-duration="3.48" data-track-index="0"><span>주 신청자가 숙련된 인력이거나 고급 학위 과정에</span></div>
        <div id="cap022" class="clip cap" data-start="92.81" data-duration="3.78" data-track-index="0"><span>있으면 그 배우자에게 문을 열어주는 구조입니다.</span></div>
        <div id="cap023" class="clip cap" data-start="98.5" data-duration="3.69" data-track-index="0"><span>예전에는 학생이든 취업비자든 대부분의 배우자가</span></div>
        <div id="cap024" class="clip cap" data-start="102.19" data-duration="3.0" data-track-index="0"><span>오픈 워크퍼밋을 받을 수 있었습니다.</span></div>
        <div id="cap025" class="clip cap" data-start="105.19" data-duration="5.67" data-track-index="0"><span>그런데 2025년 1월 21일부터 대상이 크게 줄었습니다.</span></div>
        <div id="cap026" class="clip cap" data-start="110.86" data-duration="5.86" data-track-index="0"><span>그래서 예전 블로그나 유튜브 정보를 보고 "나도 되겠지" 하고 준비하셨다가</span></div>
        <div id="cap027" class="clip cap" data-start="116.72" data-duration="4.59" data-track-index="0"><span>안 된다는 걸 뒤늦게 알게 되는 경우가 생기고 있습니다.</span></div>
        <div id="cap028" class="clip cap" data-start="122.19" data-duration="3.31" data-track-index="0"><span>그리고 한 가지 더 중요한 점이 있습니다.</span></div>
        <div id="cap029" class="clip cap" data-start="125.5" data-duration="3.51" data-track-index="0"><span>심사는 입학하거나 취업한 날이 아니라,</span></div>
        <div id="cap030" class="clip cap" data-start="129.01" data-duration="5.35" data-track-index="0"><span>IRCC가 신청서를 받은 날의 규정을 기준으로 합니다.</span></div>
        <div id="cap031" class="clip cap" data-start="136.42" data-duration="3.46" data-track-index="0"><span>먼저 배우자가 취업비자를 가진 경우입니다.</span></div>
        <div id="cap032" class="clip cap" data-start="139.88" data-duration="3.27" data-track-index="0"><span>여기서는 직종의 숙련도를 보는데,</span></div>
        <div id="cap033" class="clip cap" data-start="143.15" data-duration="6.18" data-track-index="0"><span>캐나다 직업 분류인 NOC의 TEER 레벨로 판단합니다.</span></div>
        <div id="cap034" class="clip cap" data-start="149.33" data-duration="5.8" data-track-index="0"><span>TEER 0과 1은 관리직이나 학사 이상 수준의 전문직입니다.</span></div>
        <div id="cap035" class="clip cap" data-start="155.13" data-duration="4.53" data-track-index="0"><span>이 경우에는 직종 제한 없이 배우자가 신청할 수 있습니다.</span></div>
        <div id="cap036" class="clip cap" data-start="159.66" data-duration="5.06" data-track-index="0"><span>TEER 2와 3은 컬리지나 기술 수준의 직종인데,</span></div>
        <div id="cap037" class="clip cap" data-start="164.72" data-duration="4.1" data-track-index="0"><span>여기는 모든 직종이 되는 게 아닙니다.</span></div>
        <div id="cap038" class="clip cap" data-start="168.82" data-duration="6.78" data-track-index="0"><span>IRCC가 따로 지정한 직종 목록에 있는 경우에만 가능합니다.</span></div>
        <div id="cap039" class="clip cap" data-start="175.6" data-duration="1.45" data-track-index="0"><span>보건의료, 건설,</span></div>
        <div id="cap040" class="clip cap" data-start="177.05" data-duration="8.01" data-track-index="0"><span>자연·응용과학처럼 인력이 부족하거나 정부가 우선순위를 두는 분야들입니다.</span></div>
        <div id="cap041" class="clip cap" data-start="186.07" data-duration="1.4" data-track-index="0"><span>TEER 4와 5,</span></div>
        <div id="cap042" class="clip cap" data-start="187.47" data-duration="4.1" data-track-index="0"><span>이른바 저숙련 직종은 원칙적으로 안 됩니다.</span></div>
        <div id="cap043" class="clip cap" data-start="191.57" data-duration="3.6" data-track-index="0"><span>그리고 많은 분들이 놓치시는 조건이 하나 있습니다.</span></div>
        <div id="cap044" class="clip cap" data-start="195.17" data-duration="4.12" data-track-index="0"><span>배우자의 워크퍼밋이 신청서를 접수하는 날로부터</span></div>
        <div id="cap045" class="clip cap" data-start="199.29" data-duration="3.61" data-track-index="0"><span>16개월 이상 남아 있어야 합니다.</span></div>
        <div id="cap046" class="clip cap" data-start="202.9" data-duration="3.05" data-track-index="0"><span>직종이 TEER 0이나 1이라도,</span></div>
        <div id="cap047" class="clip cap" data-start="205.95" data-duration="5.72" data-track-index="0"><span>허가 기간이 16개월 미만으로 남았다면 신청이 안 됩니다.</span></div>
        <div id="cap048" class="clip cap" data-start="211.67" data-duration="7.39" data-track-index="0"><span>그래서 워크퍼밋 연장 시점과 배우자 신청 시점을 같이 설계하셔야 합니다.</span></div>
        <div id="cap049" class="clip cap" data-start="220.22" data-duration="3.64" data-track-index="0"><span>다음은 배우자가 학생비자인 경우입니다.</span></div>
        <div id="cap050" class="clip cap" data-start="223.86" data-duration="7.01" data-track-index="0"><span>학생의 경우는 직종이 아니라 어떤 수준의 학위 과정을 공부하느냐를 봅니다.</span></div>
        <div id="cap051" class="clip cap" data-start="230.87" data-duration="6.17" data-track-index="0"><span>가능한 경우는 세 가지입니다.</span></div>
        <div id="cap052" class="clip cap" data-start="237.67" data-duration="2.78" data-track-index="0"><span>16개월 이상의 석사 과정, 박사 과정,</span></div>
        <div id="cap053" class="clip cap" data-start="240.45" data-duration="4.19" data-track-index="0"><span>그리고 IRCC가 인정한 전문학위 과정입니다.</span></div>
        <div id="cap054" class="clip cap" data-start="244.64" data-duration="5.82" data-track-index="0"><span>전문학위는 법학, 의학, 약학, 간호, 교육, 공학 같은 분야입니다.</span></div>
        <div id="cap055" class="clip cap" data-start="250.46" data-duration="4.27" data-track-index="0"><span>정확한 목록은 IRCC 사이트에서 꼭 확인하세요.</span></div>
        <div id="cap056" class="clip cap" data-start="254.73" data-duration="2.64" data-track-index="0"><span>반대로 안 되는 경우입니다.</span></div>
        <div id="cap057" class="clip cap" data-start="257.37" data-duration="5.88" data-track-index="0"><span>컬리지 과정은 디플로마든 어드밴스드 디플로마든 해당이 안 됩니다.</span></div>
        <div id="cap058" class="clip cap" data-start="263.25" data-duration="4.08" data-track-index="0"><span>일반 학사 과정도 해당이 안 됩니다.</span></div>
        <div id="cap059" class="clip cap" data-start="267.33" data-duration="3.61" data-track-index="0"><span>어학 과정도 마찬가지입니다.</span></div>
        <div id="cap060" class="clip cap" data-start="270.94" data-duration="3.53" data-track-index="0"><span>그리고 최근 추가된 조건이 있습니다.</span></div>
        <div id="cap061" class="clip cap" data-start="274.47" data-duration="3.01" data-track-index="0"><span>2026년 3월 지침 업데이트로,</span></div>
        <div id="cap062" class="clip cap" data-start="277.48" data-duration="6.82" data-track-index="0"><span>학생이 마지막 학기에 있으면 배우자 신청이 거절될 수 있게 됐습니다.</span></div>
        <div id="cap063" class="clip cap" data-start="284.3" data-duration="5.8" data-track-index="0"><span>졸업을 앞둔 시점에는 신청 타이밍을 반드시 확인하셔야 합니다.</span></div>
        <div id="cap064" class="clip cap" data-start="290.1" data-duration="8.0" data-track-index="0"><span>자녀는 이 카테고리로 오픈 워크퍼밋을 받을 수 없다는 점도 기억해 주세요.</span></div>
        <div id="cap065" class="clip cap" data-start="299.29" data-duration="5.51" data-track-index="0"><span>상담하다 보면 자주 나오는 오해가 세 가지 있습니다.</span></div>
        <div id="cap066" class="clip cap" data-start="304.8" data-duration="4.01" data-track-index="0"><span>첫째, "취업비자니까 무조건 되겠지." 아닙니다.</span></div>
        <div id="cap067" class="clip cap" data-start="308.81" data-duration="4.01" data-track-index="0"><span>직종 레벨과 16개월 조건을 둘 다 봅니다.</span></div>
        <div id="cap068" class="clip cap" data-start="312.82" data-duration="4.03" data-track-index="0"><span>둘째, "학사 공부하면 되는 걸로 알았는데요."</span></div>
        <div id="cap069" class="clip cap" data-start="316.85" data-duration="5.27" data-track-index="0"><span>일반 학사는 안 되고, 인정된 전문학위만 해당됩니다.</span></div>
        <div id="cap070" class="clip cap" data-start="322.95" data-duration="0.39" data-track-index="0"><span>셋째,</span></div>
        <div id="cap071" class="clip cap" data-start="323.34" data-duration="5.12" data-track-index="0"><span>"컬리지 다니다가 졸업하면 배우자 워크퍼밋은 그때 받으면 되죠?"</span></div>
        <div id="cap072" class="clip cap" data-start="328.46" data-duration="5.31" data-track-index="0"><span>졸업 후 PGWP를 받으면 이제는 취업비자 소지자가 되는 거라서,</span></div>
        <div id="cap073" class="clip cap" data-start="333.77" data-duration="4.89" data-track-index="0"><span>그때는 직종 TEER 레벨 기준으로 다시 판단합니다.</span></div>
        <div id="cap074" class="clip cap" data-start="338.66" data-duration="3.57" data-track-index="0"><span>학생일 때와 기준이 완전히 달라집니다.</span></div>
        <div id="cap075" class="clip cap" data-start="343.27" data-duration="4.09" data-track-index="0"><span>그러면 가족 단위로 예산을 짜실 때는 어떻게 하셔야 할까요?</span></div>
        <div id="cap076" class="clip cap" data-start="347.36" data-duration="1.02" data-track-index="0"><span>가장 중요한 건,</span></div>
        <div id="cap077" class="clip cap" data-start="348.38" data-duration="5.94" data-track-index="0"><span>배우자 워크퍼밋을 당연히 받는다고 가정하고 생활비를 계산하지 않는 것입니다.</span></div>
        <div id="cap078" class="clip cap" data-start="354.93" data-duration="4.58" data-track-index="0"><span>먼저 주 신청자의 과정이나 직종이 해당되는지 확인하시고,</span></div>
        <div id="cap079" class="clip cap" data-start="359.51" data-duration="6.72" data-track-index="0"><span>해당이 안 된다면 배우자 수입이 없는 경우를 기준으로 예산을 세우셔야 합니다.</span></div>
        <div id="cap080" class="clip cap" data-start="366.23" data-duration="4.78" data-track-index="0"><span>배우자 수입이 생기면 그건 여유 자금이 되는 겁니다.</span></div>
        <div id="cap081" class="clip cap" data-start="371.01" data-duration="4.08" data-track-index="0"><span>그리고 해당이 되더라도 신청 시점, 남은 허가 기간,</span></div>
        <div id="cap082" class="clip cap" data-start="375.09" data-duration="3.77" data-track-index="0"><span>마지막 학기 여부를 꼭 확인하셔야 합니다.</span></div>
        <div id="cap083" class="clip cap" data-start="379.85" data-duration="0.94" data-track-index="0"><span>정리하면,</span></div>
        <div id="cap084" class="clip cap" data-start="380.79" data-duration="5.15" data-track-index="0"><span>배우자 워크퍼밋은 취업비자는 직종 레벨과 남은 기간,</span></div>
        <div id="cap085" class="clip cap" data-start="385.94" data-duration="4.81" data-track-index="0"><span>학생비자는 학위 수준을 보고 결정됩니다.</span></div>
        <div id="cap086" class="clip cap" data-start="390.75" data-duration="2.19" data-track-index="0"><span>규정이 자주 바뀌는 만큼,</span></div>
        <div id="cap087" class="clip cap" data-start="392.94" data-duration="5.35" data-track-index="0"><span>내 상황에 맞는지는 신청 전에 꼭 확인하셔야 합니다.</span></div>
