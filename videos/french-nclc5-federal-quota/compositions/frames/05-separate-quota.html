      (function () {

        function q(name) { return host.querySelector('[class~="' + FID + '-' + name + '"]'); }
        function qa(name) { return host.querySelectorAll('[class~="' + FID + '-' + name + '"]'); }

        var tl = gsap.timeline({ paused: true });
        var DUR = 11.331;

        // Voice cues (seconds from frame start)
        var T = { title: 0.1, token: 1.3, cards: 3.1, quota: 5.9, dim: 7.3, travel: 8.4 };

        // Scene 1 — title slam (kinetic-beat-slam: distinct entrance per phrase on one beat grid)

        var BEATS = [T.title, T.title + PULSE, T.title + PULSE * 2];

          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" }, BEATS[0]);
        tl.fromTo(q("w2"), { x: 240, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, BEATS[1]);
        tl.fromTo(q("underline"), { scaleX: 0, transformOrigin: "0% 50%" },
          { scaleX: 1, duration: 0.4, ease: "circ.out" }, BEATS[2]);
        tl.fromTo(q("accent"), { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, BEATS[0] + 0.1);

        // Scene 2 — nominee token appears on "주정부가"
        tl.fromTo(q("disc"), { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, T.token);
        tl.fromTo(q("tag"), { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T.token + 0.25);

        // Scene 2 — split-tilt cards on "노미니를 주면": opposite wings, mirrored rotateY, stacked
        var TILT = 10, OVER = 10, SLIDE = 460, ENTRY = 0.95;
        tl.fromTo(q("card-top"), { x: -SLIDE, rotationY: TILT + OVER, scale: 0.85, opacity: 0 },
          { x: 0, rotationY: TILT, scale: 1, opacity: 1, duration: ENTRY, ease: "power3.out" }, T.cards);
        tl.fromTo(q("card-bot"), { x: SLIDE, rotationY: -TILT - OVER, scale: 0.85, opacity: 0 },
          { x: 0, rotationY: -TILT, scale: 1, opacity: 1, duration: ENTRY, ease: "power3.out" }, T.cards + 0.2);
        tl.fromTo(qa("copy"), { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, stagger: 0.08, ease: "power2.out" }, T.cards + 0.5);
        tl.set(q("num-b"), { yPercent: 100 }, 0);

        // Counter-phase idle float (explicit, finite) — top up while bottom down; returns to 0 before travel
        var AMP = 5, HALF = 0.95, idle0 = T.cards + 1.3;
        var topF = q("float-top"), botF = q("float-bot");
        for (var i = 0; i < 4; i++) {
          var s = (i % 2 === 0) ? 1 : 0;
          tl.to(topF, { y: -AMP * s, duration: HALF, ease: "sine.inOut" }, idle0 + i * HALF);
          tl.to(botF, { y: AMP * s, duration: HALF, ease: "sine.inOut" }, idle0 + i * HALF);
        }

        // Scene 3 — "-0" tally holds; red ✕ badge spring-pops on the top card's edge
        tl.fromTo(q("tally-v"), { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out" }, T.quota);
        tl.to(q("tally-v"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, T.quota + 0.18);
        tl.fromTo(q("badge-x"), { scale: 0, opacity: 0, rotation: -8 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" }, T.quota + 0.1);
        // "빠지지 않습니다" — top card dims
        tl.to(q("card-top"), { opacity: 0.5, duration: 0.6, ease: "power2.out" }, T.dim);

        // Scene 4 — nominee travels down into the bottom (federal) card
        var TRAVEL = 0.95;
        tl.to(q("tag"), { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, T.travel);
        tl.to(q("token"), { x: 278, y: 850, scale: 0.72, duration: TRAVEL, ease: "power2.inOut" }, T.travel);
        tl.fromTo(q("bloom"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, T.travel + 0.4);
        tl.fromTo(q("hilite"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.travel + TRAVEL - 0.1);
        tl.fromTo(q("slot"), { scale: 1 }, { scale: 1.12, duration: 0.2, ease: "power2.out" }, T.travel + TRAVEL - 0.05);
        tl.to(q("slot"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, T.travel + TRAVEL + 0.15);

        // counter ticks 5,000 → 4,999
        var tick = T.travel + TRAVEL + 0.05;
        tl.fromTo(q("num-a"), { yPercent: 0 }, { yPercent: -100, duration: 0.45, ease: "power3.inOut" }, tick);
        tl.fromTo(q("num-b"), { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "power3.inOut" }, tick);
