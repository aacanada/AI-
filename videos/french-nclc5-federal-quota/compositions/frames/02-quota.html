    var start = cumulative;

    return { el: el, start: start };

    tl.fromTo(w.el, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, w.start);
  });

  /* ---------- Scene 2 (2.5–6.4s): quota box draws in (svg-path-draw), label flips to 쿼터 ---------- */
  var boxPath = $("#q02-boxpath");
  var len = boxPath.getTotalLength() * 1.02;
  boxPath.style.strokeDasharray = len + "";

  tl.fromTo($("#q02-shackle"), { y: -6 }, { y: 0, duration: 0.2, ease: "power2.in" }, 5.85);

  function rand() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  var inside = [];
  for (var r = 0; r < 8; r++) {
    for (var c = 0; c < 10; c++) {
      inside.push({
        x: 337.5 + c * 45 + (rand() - 0.5) * 8,
        y: 672 + r * 45 + (rand() - 0.5) * 8,
        row: r
      });
    }
  }
  // fill bottom-up: bottom rows land first
  inside.sort(function (a, b) { return (b.row - a.row) || (a.x - b.x); });

  // overflow: rejection-sampled around and below the box, avoiding title, tab, chip
  function blocked(x, y) {
    if (x < 48 || x > 1032 || y < 470 || y > 1560) return true;
    if (x > BOX.x0 - 22 && x < BOX.x1 + 22 && y > BOX.y0 - 22 && y < BOX.y1 + 22) return true;
    if (x > 340 && x < 740 && y > 528 && y < 672) return true;          // tab
    if (x > 150 && x < 930 && y > 1140 && y < 1296) return true;         // chip
    return false;
  }
  var outside = [];
  var tries = 0;
  while (outside.length < 165 && tries < 20000) {
    tries++;
    var px = 48 + rand() * 984;
    var py = 470 + rand() * 1090;
    if (blocked(px, py)) continue;
    var ok = true;
    for (var k = 0; k < outside.length; k++) {
      var dx = outside[k].x - px, dy = outside[k].y - py;
      if (dx * dx + dy * dy < 37 * 37) { ok = false; break; }
    }
    if (ok) outside.push({ x: px, y: py });

  // center-outward order: nearest the box first
  outside.forEach(function (d) { d.dist = Math.hypot(d.x - BOX.cx, d.y - BOX.cy); });
  outside.sort(function (a, b) { return a.dist - b.dist; });

  inside.forEach(function (d, i) {

    var fy = side === 0 ? -(d.y + 40) : -(260 + rand() * 260);
