  <script>
    (function () {
      var ID = "03-score-race";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var PITCH = 128;
      var SORTED = [92, 88, 85, 81, 77, 73, 69];        // final slot order
      var ARRIVAL = [81, 69, 92, 77, 85, 73, 88];       // shuffled order they cascade in
      var AVATAR = '<svg viewBox="0 0 24 24" fill="#1e2bfa"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.6 8.5-7.6s8.5 3 8.5 7.6z"/></svg>';

      var host = q(".s03-cards");
      var cards = {};
      SORTED.forEach(function (score, slot) {
        var el = document.createElement("div");
        el.className = "s03-card";
        el.style.top = slot * PITCH + "px";
        el.innerHTML =
          '<div class="s03-card-hl"></div>' +
          '<div class="s03-avatar">' + AVATAR + '</div>' +
          '<div class="s03-score">' + score + '</div>' +
          '<div class="s03-track"><span class="s03-fill"></span></div>';
        host.appendChild(el);
        cards[score] = { el: el, slot: slot };
      });

      var tl = gsap.timeline({ paused: true });

      // slow camera drift under the whole shot
      tl.fromTo(q(".s03-cam"), { scale: 1 }, { scale: 1.03, duration: 11.703, ease: "none" }, 0);

      // ---- Scene 1 (0.0–2.6): per-word title, then cobalt line on "주정부가" (2.0)
      tl.fromTo(q(".s03-accent-line"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo(qa(".s03-word"),
        { opacity: 0, y: 46, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.32 }, 0.1);
      tl.fromTo(q(".s03-line2"),
        { opacity: 0, y: 70, scale: 0.92, transformOrigin: "left bottom" },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 2.0);

      // ---- Scene 2 (2.6–6.8): shuffled cascade, then FLIP re-sort on "높은 점수부터" (3.6)
      ARRIVAL.forEach(function (score, i) {
        var c = cards[score];
        var off = (i - c.slot) * PITCH; // sits at arrival slot first
        var at = 2.6 + i * 0.09;
        tl.fromTo(c.el, { opacity: 0, x: -90, y: off }, { opacity: 1, x: 0, y: off, duration: 0.5, ease: "power3.out" }, at);
        tl.fromTo(c.el.querySelector(".s03-fill"), { scaleX: 0 }, { scaleX: score / 100, duration: 0.7, ease: "power3.out" }, at + 0.1);
      });
      ARRIVAL.forEach(function (score, i) {
        var c = cards[score];
        tl.to(c.el, { y: 0, duration: 0.95, ease: "power3.inOut" }, 3.6 + c.slot * 0.03);
      });
      tl.fromTo(qa(".s03-rank"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 4.45);
      // "높은 점수부터 뽑는" — the top of the ranking lights up
      [92, 88, 85].forEach(function (score, k) {
        tl.fromTo(cards[score].el.querySelector(".s03-card-hl"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.9 + k * 0.12);
      });
      tl.fromTo(qa(".s03-rank").slice(0, 3), { color: "#9a9a9a" }, { color: "#1e2bfa", duration: 0.4, ease: "power2.out", stagger: 0.12 }, 4.9);

      // ---- Scene 3 (6.8–9.0): red cut-off line appears at the bottom, climbs card by card, counts 68 -> 84
      var cut = q(".s03-cut");
      var STOPS = [887, 759, 631, 503, 375];     // gaps below 69 / 73 / 77 / 81 / 85
      tl.fromTo(cut, { y: STOPS[0], opacity: 0 }, { y: STOPS[0], opacity: 1, duration: 0.2, ease: "none" }, 6.9);
      tl.fromTo(q(".s03-cut-line"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 6.9);
      tl.fromTo(q(".s03-cut-pill"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 7.0);

      var dimOrder = [69, 73, 77, 81];
      for (var s = 1; s < STOPS.length; s++) {
        var t0 = 7.4 + (s - 1) * 0.4;
        tl.to(cut, { y: STOPS[s], duration: 0.34, ease: "power2.inOut" }, t0);
        tl.to(cards[dimOrder[s - 1]].el, { opacity: 0.25, duration: 0.3, ease: "power2.out" }, t0 + 0.14);
        tl.to(qa(".s03-rank")[cards[dimOrder[s - 1]].slot], { opacity: 0.25, duration: 0.3, ease: "power2.out" }, t0 + 0.14);
      }

      // count-up with dynamic scale (value + scale share timing and ease)
      var num = q(".s03-cut-num");
      var state = { v: 68 };
      tl.to(state, {
        v: 84, duration: 1.55, ease: "power1.inOut",
        onUpdate: function () { num.textContent = Math.round(state.v); }
      }, 7.4);
      tl.fromTo(num, { scale: 0.6 }, { scale: 1, duration: 1.55, ease: "power1.inOut" }, 7.4);

      // ---- Scene 4 (9.0–11.7): "-3점" marker circles the first card under the line, then holds
      tl.fromTo(q(".s03-ring"), { scale: 0, rotation: -12, opacity: 1 }, { scale: 1, rotation: -4, duration: 0.6, ease: "back.out(1.7)" }, 9.05);
      tl.fromTo(q(".s03-gap"), { opacity: 0, x: -30, scale: 0.7, rotation: 0 }, { opacity: 1, x: 0, scale: 1, rotation: -3, duration: 0.5, ease: "back.out(1.8)" }, 9.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
