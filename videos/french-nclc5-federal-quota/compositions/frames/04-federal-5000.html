    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var DUR = 9.567;

        // Slow continuous camera zoom-in under the whole shot
        tl.fromTo("#f04-stage", { scale: 1 }, { scale: 1.045, duration: DUR, ease: "none" }, 0);

        // Scene 1 — eyebrow pill springs in on "2026년"
        tl.fromTo("#f04-accent-line", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo("#f04-eyebrow", { scale: 0.6, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.8)" }, 0.3);

        // Headline per-word reveal on "중요한 발표"
        tl.fromTo("#f04-headline .f04-word",
          { y: 50, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.16 },
          2.5);

        // Scene 2 — card slides up into the middle; glow blooms behind it
        tl.fromTo("#f04-card", { y: -355, opacity: 0, scale: 0.96 }, { y: -435, opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 4.3);
        tl.fromTo("#f04-glow", { opacity: 0, scale: 0.85 }, { opacity: 0.28, scale: 1, duration: 1.0, ease: "power2.out" }, 4.1);
        var glow = document.getElementById("f04-glow");
        var phase = { p: 0 };
        tl.to(phase, {
          p: Math.PI * 2 * 1.5,
          duration: DUR - 5.1,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            glow.style.opacity = String(0.28 + s * 0.03);
            glow.style.transform = "scale(" + (1 + s * 0.02) + ")";
          }
        }, 5.1);

        // Scene 3 — card glides down to make room; hero number counts 0 → 5,000 with scale growth
        tl.to("#f04-card", { y: 0, scale: 0.94, duration: 0.7, ease: "power3.inOut" }, 7.3);

        var counter = document.getElementById("f04-counter");
        var state = { value: 0 };
        var COUNT_AT = 7.4, COUNT_DUR = 1.5, START_SCALE = 0.5;
        tl.fromTo("#f04-count-wrap", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, COUNT_AT);
        tl.fromTo(state, { value: 0 }, {
          value: 5000,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            counter.textContent = Math.round(state.value).toLocaleString("en-US");
          }
        }, COUNT_AT);
        tl.fromTo(counter, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);

        // Label settles under the number on "따로 마련한"
        tl.fromTo("#f04-label", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 8.4);

        window.__timelines["04-federal-5000"] = tl;
      })();
    </script>
