#captions .cue span{background:#16324F;color:#FAF6EF;font-family:Pretendard,sans-serif;font-weight:700;font-size:40px;line-height:1.3;padding:12px 30px;border-radius:14px;word-break:keep-all;max-width:1500px;text-align:center}

      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="825.07">
  <div class="cue clip" id="cap-0" data-start="1.68" data-duration="4.27"><span>캐나다 시골 영주권 루트, 한 번쯤 들어 보셨을 겁니다.</span></div>
  <div class="cue clip" id="cap-1" data-start="6.46" data-duration="4.15"><span>그런데 '시골'이라는 말 때문에 망설여지셨다면, 오늘 영상은</span></div>
  <div class="cue clip" id="cap-2" data-start="10.65" data-duration="1.48"><span>끝까지 봐 주세요.</span></div>
  <div class="cue clip" id="cap-3" data-start="12.76" data-duration="5.27"><span>오늘 소개할 곳은, 캐나다 사람들이 휴가 때 일부러 찾아가는 도시들입니다.</span></div>
  <div class="cue clip" id="cap-4" data-start="18.56" data-duration="4.45"><span>호수와 설산, 스키장과 카페, 그리고 영주권까지.</span></div>
  <div class="cue clip" id="cap-5" data-start="23.68" data-duration="4.12"><span>이 지역 공립 컬리지를 졸업하고 현지에서 취업한 저희</span></div>
  <div class="cue clip" id="cap-6" data-start="27.84" data-duration="5.51"><span>학생들은, RNIP, 그리고 지금의 RCIP로 영주권을 받았습니다.</span></div>
  <div class="cue clip" id="cap-7" data-start="34.0" data-duration="4.45"><span>오늘은 그 학교, 셀커크 컬리지와 RCIP 제도를 처음부터</span></div>
  <div class="cue clip" id="cap-8" data-start="38.49" data-duration="2.32"><span>끝까지 정리해 드리겠습니다.</span></div>
  <div class="cue clip" id="cap-9" data-start="42.08" data-duration="4.1"><span>저희 AA Canada는 이 학교에, RNIP라는 제도가</span></div>
  <div class="cue clip" id="cap-10" data-start="46.22" data-duration="3.15"><span>운영되던 시절부터 학생을 보내 왔습니다.</span></div>
  <div class="cue clip" id="cap-11" data-start="49.88" data-duration="5.08"><span>RNIP는 '농촌·북부 이민 시범사업'인데요, 캐나다 정부가</span></div>
  <div class="cue clip" id="cap-12" data-start="55.0" data-duration="5.33"><span>인구가 적은 지역에 영주권 추천 권한을 나눠 준 제도입니다.</span></div>
  <div class="cue clip" id="cap-13" data-start="60.94" data-duration="5.19"><span>이 제도가 성과를 내면서, 2025년부터는 RCIP, '농촌</span></div>
  <div class="cue clip" id="cap-14" data-start="66.17" data-duration="5.44"><span>커뮤니티 이민 시범사업'으로 이름을 바꿔 이어지고 있습니다.</span></div>
  <div class="cue clip" id="cap-15" data-start="72.22" data-duration="4.73"><span>그동안 저희가 보낸 학생들 중에, 학업을 중단하지 않고 졸업한</span></div>
  <div class="cue clip" id="cap-16" data-start="76.99" data-duration="5.12"><span>뒤 현지에서 취업한 분들은 모두 이 제도로 영주권을 받았습니다.</span></div>
  <div class="cue clip" id="cap-17" data-start="82.76" data-duration="4.67"><span>물론 이건 저희 학생들의 지난 사례이고, 모든 분의 결과를</span></div>
  <div class="cue clip" id="cap-18" data-start="87.47" data-duration="4.34"><span>보장하는 말은 아닙니다. 제도는 해마다 바뀌니까요.</span></div>
  <div class="cue clip" id="cap-19" data-start="92.68" data-duration="4.59"><span>그래도 한 학교, 한 지역에 오랫동안 학생을 보내 보면, 이</span></div>
  <div class="cue clip" id="cap-20" data-start="97.31" data-duration="3.16"><span>루트가 왜 잘 되는지 구조가 보입니다.</span></div>
  <div class="cue clip" id="cap-21" data-start="101.16" data-duration="4.38"><span>그리고 이 학교에는 십 년 넘게 국제학생을 돌봐 온 한국인</span></div>
  <div class="cue clip" id="cap-22" data-start="105.58" data-duration="4.52"><span>코디네이터 선생님이 계십니다. 현지에서 혼자가 아니라는 것,</span></div>
  <div class="cue clip" id="cap-23" data-start="110.14" data-duration="2.01"><span>생각보다 큰 차이입니다.</span></div>
  <div class="cue clip" id="cap-24" data-start="115.08" data-duration="2.59"><span>먼저, 여기가 어디인지부터 보겠습니다.</span></div>
  <div class="cue clip" id="cap-25" data-start="118.32" data-duration="4.96"><span>캐나다 서쪽 브리티시컬럼비아주, 그중에서도 남동쪽, 미국</span></div>
  <div class="cue clip" id="cap-26" data-start="123.32" data-duration="4.41"><span>국경과 가까운 '웨스트 쿠트니'라는 지역입니다.</span></div>
  <div class="cue clip" id="cap-27" data-start="128.62" data-duration="4.42"><span>캘거리에서 차로 7시간, 밴쿠버에서 8시간, 켈로나에서는</span></div>
  <div class="cue clip" id="cap-28" data-start="133.08" data-duration="1.65"><span>4시간 거리입니다.</span></div>
  <div class="cue clip" id="cap-29" data-start="135.18" data-duration="2.75"><span>지역 전체 인구는 8만 명 정도이고요.</span></div>
  <div class="cue clip" id="cap-30" data-start="138.52" data-duration="4.26"><span>셀커크 컬리지는 이 지역에 여러 캠퍼스가 있는데, 국제학생이</span></div>
  <div class="cue clip" id="cap-31" data-start="142.82" data-duration="2.29"><span>공부하는 곳은 두 도시입니다.</span></div>
  <div class="cue clip" id="cap-32" data-start="145.62" data-duration="2.45"><span>바로 넬슨과 캐슬가입니다.</span></div>
  <div class="cue clip" id="cap-33" data-start="150.84" data-duration="2.14"><span>첫 번째 도시, 넬슨입니다.</span></div>
  <div class="cue clip" id="cap-34" data-start="153.02" data-duration="5.0"><span>넬슨은 1880년대 은광 마을로 시작한 도시인데요, 지금도</span></div>
  <div class="cue clip" id="cap-35" data-start="158.06" data-duration="4.85"><span>다운타운 베이커 스트리트에는 19세기 붉은 벽돌 건물들이</span></div>
  <div class="cue clip" id="cap-36" data-start="162.95" data-duration="2.1"><span>그대로 남아 있습니다.</span></div>
  <div class="cue clip" id="cap-37" data-start="165.76" data-duration="3.23"><span>그래서 '쿠트니의 여왕 도시', Queen City라는</span></div>
  <div class="cue clip" id="cap-38" data-start="169.03" data-duration="1.3"><span>별명으로 불립니다.</span></div>
  <div class="cue clip" id="cap-39" data-start="171.9" data-duration="3.97"><span>캐나다 여행 매체들이 '가장 매력적인 작은 도시'를 꼽을 때</span></div>
  <div class="cue clip" id="cap-40" data-start="175.91" data-duration="2.16"><span>빠지지 않는 곳이기도 하고요.</span></div>
  <div class="cue clip" id="cap-41" data-start="178.98" data-duration="4.5"><span>겨울에는 근처 화이트워터 스키장에서 파우더 스키를 타고,</span></div>
  <div class="cue clip" id="cap-42" data-start="183.52" data-duration="5.19"><span>여름에는 쿠트니 호수에서 카약과 패들보드, 래프팅을 즐깁니다.</span></div>
  <div class="cue clip" id="cap-43" data-start="189.5" data-duration="5.06"><span>예술가와 환경운동가, 여러 전문직 종사자들이 일부러 이사 오는</span></div>
  <div class="cue clip" id="cap-44" data-start="194.6" data-duration="6.4"><span>도시이고, 인구에 비해 카페와 레스토랑, 수제 맥주집이 정말 많습니다.</span></div>
  <div class="cue clip" id="cap-45" data-start="201.04" data-duration="3.77"><span>그러니까 이 지역은, 어쩔 수 없이 가는 시골이 아닙니다.</span></div>
  <div class="cue clip" id="cap-46" data-start="205.36" data-duration="4.09"><span>캐나다 사람들이 휴가를 오고, 은퇴하고 싶어 하는 곳입니다.</span></div>
  <div class="cue clip" id="cap-47" data-start="210.98" data-duration="2.07"><span>두 번째 도시, 캐슬가입니다.</span></div>
  <div class="cue clip" id="cap-48" data-start="213.6" data-duration="3.78"><span>캐슬가는 웨스트 쿠트니의 한가운데에 있는 도시로, 셀커크</span></div>
  <div class="cue clip" id="cap-49" data-start="217.42" data-duration="2.79"><span>컬리지 메인 캠퍼스가 이곳에 있습니다.</span></div>
  <div class="cue clip" id="cap-50" data-start="221.24" data-duration="4.2"><span>컬럼비아강과 쿠트니강이 만나는 곳이고, 지역 공항이 있어서</span></div>
  <div class="cue clip" id="cap-51" data-start="225.48" data-duration="3.13"><span>밴쿠버나 캘거리로 바로 갈 수 있습니다.</span></div>
  <div class="cue clip" id="cap-52" data-start="229.36" data-duration="4.74"><span>병원과 요양시설, 보육시설, 산업체가 모여 있는, 말 그대로</span></div>
  <div class="cue clip" id="cap-53" data-start="234.14" data-duration="2.09"><span>일하기 좋은 도시입니다.</span></div>
  <div class="cue clip" id="cap-54" data-start="236.94" data-duration="4.31"><span>한국인은 거의 없는 지역이지만, 캐슬가에는 한인마트가 있어서</span></div>
  <div class="cue clip" id="cap-55" data-start="241.29" data-duration="2.58"><span>장 보는 걱정은 덜 수 있습니다.</span></div>
  <div class="cue clip" id="cap-56" data-start="244.64" data-duration="4.03"><span>오히려 한국인이 적다는 건, 영어 환경에 제대로 들어간다는</span></div>
  <div class="cue clip" id="cap-57" data-start="248.71" data-duration="1.48"><span>장점이기도 합니다.</span></div>
  <div class="cue clip" id="cap-58" data-start="250.96" data-duration="6.05"><span>그럼 이 두 도시의 중심에 있는 학교, 셀커크 컬리지를 보시겠습니다.</span></div>
  <div class="cue clip" id="cap-59" data-start="261.94" data-duration="5.03"><span>셀커크 컬리지는 1966년에 세워진, BC주 공립 컬리지입니다.</span></div>
  <div class="cue clip" id="cap-60" data-start="267.44" data-duration="4.69"><span>사립이 아니라 공립이라는 점, 졸업 후 취업비자인 PGWP</span></div>
  <div class="cue clip" id="cap-61" data-start="272.17" data-duration="3.9"><span>대상 과정이 많다는 점이 가장 큰 장점입니다.</span></div>
  <div class="cue clip" id="cap-62" data-start="276.52" data-duration="4.48"><span>수업은 소규모로 진행되고, 무료 튜터링과 커리어 상담, 비자와</span></div>
  <div class="cue clip" id="cap-63" data-start="281.04" data-duration="2.61"><span>의료 지원까지 받을 수 있습니다.</span></div>
  <div class="cue clip" id="cap-64" data-start="284.68" data-duration="4.67"><span>학생 만족도는 93퍼센트, 강의 품질에 만족한다는 응답은</span></div>
  <div class="cue clip" id="cap-65" data-start="289.39" data-duration="1.58"><span>96퍼센트입니다.</span></div>
  <div class="cue clip" id="cap-66" data-start="292.08" data-duration="5.95"><span>전체 학생 가운데 국제학생은 470여 명으로, 국제학생 비율도 적당합니다.</span></div>
  <div class="cue clip" id="cap-67" data-start="298.86" data-duration="4.43"><span>학비는 캐나다 다른 공립 컬리지보다 낮은 편이고, 생활비도</span></div>
  <div class="cue clip" id="cap-68" data-start="303.33" data-duration="3.0"><span>대도시와 비교하면 확실히 저렴합니다.</span></div>
  <div class="cue clip" id="cap-69" data-start="307.18" data-duration="4.08"><span>기숙사는 캐슬가와 넬슨 두 곳에 있고, 캐나다 가정에서 지내는</span></div>
  <div class="cue clip" id="cap-70" data-start="311.3" data-duration="2.27"><span>홈스테이도 선택할 수 있습니다.</span></div>
  <div class="cue clip" id="cap-71" data-start="314.16" data-duration="4.39"><span>그리고 한 가지 기억해 두실 게 있습니다. 셀커크는 지역</span></div>
  <div class="cue clip" id="cap-72" data-start="318.59" data-duration="5.5"><span>업체와 연결되는 코업, 즉 현장 실습 프로그램이 잘 되어 있는데요.</span></div>
  <div class="cue clip" id="cap-73" data-start="324.48" data-duration="4.67"><span>이 코업과 실습이, 나중에 영주권을 추천해 줄 고용주를 만나는</span></div>
  <div class="cue clip" id="cap-74" data-start="329.19" data-duration="1.32"><span>통로가 됩니다.</span></div>
  <div class="cue clip" id="cap-75" data-start="332.28" data-duration="3.39"><span>이제 오늘의 핵심, RCIP를 설명드리겠습니다.</span></div>
  <div class="cue clip" id="cap-76" data-start="336.8" data-duration="4.58"><span>RCIP는 한 문장으로 말하면, 캐나다 연방정부가 인구가 적은</span></div>
  <div class="cue clip" id="cap-77" data-start="341.42" data-duration="4.29"><span>지역에 영주권 추천 권한을 직접 나눠 주는 제도입니다.</span></div>
  <div class="cue clip" id="cap-78" data-start="346.74" data-duration="3.97"><span>지역이 필요한 사람을, 지역이 직접 고르는 겁니다.</span></div>
  <div class="cue clip" id="cap-79" data-start="351.2" data-duration="4.87"><span>웨스트 쿠트니는 이전 RNIP 때부터 참여해 온 지역이고,</span></div>
  <div class="cue clip" id="cap-80" data-start="356.11" data-duration="5.88"><span>넬슨, 캐슬가, 트레일, 로슬랜드 같은 도시들이 여기에 포함됩니다.</span></div>
  <div class="cue clip" id="cap-81" data-start="362.39" data-duration="1.09"><span>흐름은 이렇습니다.</span></div>
  <div class="cue clip" id="cap-82" data-start="363.89" data-duration="4.57"><span>셀커크 컬리지를 졸업하고, 졸업 후 취업비자로 지역의 '지정</span></div>
  <div class="cue clip" id="cap-83" data-start="368.5" data-duration="2.86"><span>고용주'에게 정규직으로 취업합니다.</span></div>
  <div class="cue clip" id="cap-84" data-start="371.93" data-duration="4.39"><span>그러면 지역 RCIP 위원회가 점수를 매겨서 추천서를</span></div>
  <div class="cue clip" id="cap-85" data-start="376.36" data-duration="4.8"><span>발급하고, 이 추천서로 연방정부에 영주권을 신청합니다.</span></div>
  <div class="cue clip" id="cap-86" data-start="382.25" data-duration="1.61"><span>기본 요건도 보겠습니다.</span></div>
  <div class="cue clip" id="cap-87" data-start="384.29" data-duration="4.77"><span>첫째, 지정 고용주의 풀타임 정규직 잡오퍼가 있어야 합니다.</span></div>
  <div class="cue clip" id="cap-88" data-start="389.77" data-duration="5.43"><span>둘째, 직업 등급에 맞는 영어 점수가 필요합니다. 등급이 높은</span></div>
  <div class="cue clip" id="cap-89" data-start="395.24" data-duration="6.66"><span>직업은 CLB 6, 중간 등급은 CLB 5, 그 아래는 CLB 4입니다.</span></div>
  <div class="cue clip" id="cap-90" data-start="402.77" data-duration="4.07"><span>셋째, 학력과 정착 자금, 그리고 이 지역에 계속 살겠다는</span></div>
  <div class="cue clip" id="cap-91" data-start="406.88" data-duration="1.5"><span>의사가 필요합니다.</span></div>
  <div class="cue clip" id="cap-92" data-start="409.19" data-duration="4.67"><span>넷째, 원래는 1년의 경력이 필요한데요, 지역 공립 교육기관</span></div>
  <div class="cue clip" id="cap-93" data-start="413.9" data-duration="3.06"><span>졸업생은 이 경력 요건이 면제됩니다.</span></div>
  <div class="cue clip" id="cap-94" data-start="418.33" data-duration="6.11"><span>점수는 잡오퍼, 경력, 언어, 학력, 거주 의사, 이렇게 다섯</span></div>
  <div class="cue clip" id="cap-95" data-start="424.48" data-duration="5.64"><span>항목을 각 25점씩, 총 125점 만점으로 평가합니다.</span></div>
  <div class="cue clip" id="cap-96" data-start="434.45" data-duration="3.6"><span>그럼 이 제도가 왜 좋은지, 숫자로 보겠습니다.</span></div>
  <div class="cue clip" id="cap-97" data-start="438.09" data-duration="4.78"><span>첫째, 경력이 없어도 지원할 수 있습니다. 셀커크 컬리지는 이</span></div>
  <div class="cue clip" id="cap-98" data-start="442.91" data-duration="5.75"><span>지역의 유일한 공립 교육기관이라서, 졸업생은 경력 요건을 면제받습니다.</span></div>
  <div class="cue clip" id="cap-99" data-start="449.53" data-duration="5.7"><span>둘째, 62퍼센트. RNIP 시절 이 지역 주신청자 302명</span></div>
  <div class="cue clip" id="cap-100" data-start="455.27" data-duration="4.21"><span>가운데 188명이 셀커크 졸업생이었습니다.</span></div>
  <div class="cue clip" id="cap-101" data-start="460.41" data-duration="5.54"><span>셋째, 979명. 가족까지 포함해서 이 지역에서 영주권 추천을</span></div>
  <div class="cue clip" id="cap-102" data-start="465.99" data-duration="1.69"><span>받은 인원입니다.</span></div>
  <div class="cue clip" id="cap-103" data-start="468.57" data-duration="5.22"><span>넷째, 90퍼센트. 영주권을 받은 뒤에도 이 지역에 계속 사는</span></div>
  <div class="cue clip" id="cap-104" data-start="473.83" data-duration="5.93"><span>사람의 비율입니다. 81퍼센트는 같은 고용주와 계속 일하고 있고요.</span></div>
  <div class="cue clip" id="cap-105" data-start="480.43" data-duration="4.04"><span>다섯째, 2026년 웨스트 쿠트니의 추천 쿼터는</span></div>
  <div class="cue clip" id="cap-106" data-start="484.51" data-duration="1.47"><span>200명입니다.</span></div>
  <div class="cue clip" id="cap-107" data-start="487.25" data-duration="4.32"><span>익스프레스 엔트리는 전국 단위 경쟁입니다. 나이, 학력, 영어</span></div>
  <div class="cue clip" id="cap-108" data-start="491.61" data-duration="2.27"><span>점수가 높은 사람이 유리하죠.</span></div>
  <div class="cue clip" id="cap-109" data-start="494.35" data-duration="4.78"><span>반면 RCIP는 이 지역 안에서만 경쟁하고, 이 지역 학교를</span></div>
  <div class="cue clip" id="cap-110" data-start="499.17" data-duration="4.9"><span>나와 이 지역에서 일하는 사람을 지역이 더 선호합니다.</span></div>
  <div class="cue clip" id="cap-111" data-start="504.11" data-duration="4.52"><span>그리고 90퍼센트가 떠나지 않는다는 건, 영주권만 받고 떠나는</span></div>
  <div class="cue clip" id="cap-112" data-start="508.67" data-duration="4.37"><span>곳이 아니라, 받고 나서도 살고 싶은 곳이라는 뜻입니다.</span></div>
  <div class="cue clip" id="cap-113" data-start="518.09" data-duration="4.02"><span>그렇다면 어떤 전공을 선택해야 할까요. 2026년 웨스트</span></div>
  <div class="cue clip" id="cap-114" data-start="522.15" data-duration="2.57"><span>쿠트니 선발 기준으로 보겠습니다.</span></div>
  <div class="cue clip" id="cap-115" data-start="525.55" data-duration="5.75"><span>올해 웨스트 쿠트니는 6개 우선 산업과 25개 우선 직군을 정했습니다.</span></div>
  <div class="cue clip" id="cap-116" data-start="531.83" data-duration="4.81"><span>그중에서도 보건, 그리고 교육과 사회서비스 분야가 점수표에서</span></div>
  <div class="cue clip" id="cap-117" data-start="536.68" data-duration="2.56"><span>가장 높은 20점을 받습니다.</span></div>
  <div class="cue clip" id="cap-118" data-start="540.21" data-duration="4.37"><span>특히 두 직군에는 5점 가산점이 따로 붙고, 고용주 한 곳이</span></div>
  <div class="cue clip" id="cap-119" data-start="544.62" data-duration="3.16"><span>추천받을 수 있는 인원 제한도 없습니다.</span></div>
  <div class="cue clip" id="cap-120" data-start="548.33" data-duration="3.19"><span>바로 요양보호사, 그리고 보육교사입니다.</span></div>
  <div class="cue clip" id="cap-121" data-start="552.27" data-duration="4.34"><span>그래서 저희가 추천하는 1순위 전공은, 헬스케어 어시스턴트</span></div>
  <div class="cue clip" id="cap-122" data-start="556.65" data-duration="1.31"><span>디플로마입니다.</span></div>
  <div class="cue clip" id="cap-123" data-start="558.61" data-duration="4.71"><span>캐슬가 캠퍼스 2년 과정이고, 요양보호사 직군으로 바로</span></div>
  <div class="cue clip" id="cap-124" data-start="563.36" data-duration="4.71"><span>이어집니다. 다만 입학 영어 기준이 IELTS 전 영역</span></div>
  <div class="cue clip" id="cap-125" data-start="568.11" data-duration="2.43"><span>6.0으로 가장 높습니다.</span></div>
  <div class="cue clip" id="cap-126" data-start="571.71" data-duration="4.33"><span>2순위는 얼리 러닝 앤 차일드케어, 보육교사 디플로마입니다.</span></div>
  <div class="cue clip" id="cap-127" data-start="577.17" data-duration="4.25"><span>역시 캐슬가 2년 과정이고, 가산점과 인원 제한 없음, 두</span></div>
  <div class="cue clip" id="cap-128" data-start="581.46" data-duration="4.25"><span>가지 혜택을 똑같이 받습니다. 자녀와 함께 오시는 부모님께</span></div>
  <div class="cue clip" id="cap-129" data-start="585.75" data-duration="2.09"><span>특히 잘 맞는 전공입니다.</span></div>
  <div class="cue clip" id="cap-130" data-start="588.93" data-duration="4.01"><span>3순위는 넬슨 캠퍼스의 컬리너리 아츠, 요리 과정입니다.</span></div>
  <div class="cue clip" id="cap-131" data-start="593.49" data-duration="5.85"><span>휴양도시라 레스토랑과 리조트 수요가 꾸준하고, 요리사도 우선 직군입니다.</span></div>
  <div class="cue clip" id="cap-132" data-start="599.91" data-duration="4.32"><span>다만 가산점이 없고, 14개월 과정이라 졸업생 경력 면제가</span></div>
  <div class="cue clip" id="cap-133" data-start="604.27" data-duration="4.6"><span>적용되지 않을 수 있어서, 졸업 후 1년 경력을 쌓고 지원하는</span></div>
  <div class="cue clip" id="cap-134" data-start="608.91" data-duration="1.85"><span>루트로 보셔야 합니다.</span></div>
  <div class="cue clip" id="cap-135" data-start="611.75" data-duration="4.3"><span>이 밖에 사회복지 계열 디플로마와 교육보조 과정도 있지만,</span></div>
  <div class="cue clip" id="cap-136" data-start="616.09" data-duration="3.89"><span>해당 직군이 우선 리스트에 있는지는 상담 때 꼭 함께</span></div>
  <div class="cue clip" id="cap-137" data-start="620.02" data-duration="1.57"><span>확인하셔야 합니다.</span></div>
  <div class="cue clip" id="cap-138" data-start="622.56" data-duration="4.54"><span>정리하면, 2026년 웨스트 쿠트니가 가장 원하는 사람은</span></div>
  <div class="cue clip" id="cap-139" data-start="627.14" data-duration="2.76"><span>요양보호사와 보육교사입니다.</span></div>
  <div class="cue clip" id="cap-140" data-start="629.94" data-duration="4.2"><span>그리고 셀커크 컬리지에는, 이 두 직군으로 바로 이어지는</span></div>
  <div class="cue clip" id="cap-141" data-start="634.18" data-duration="4.2"><span>2년제 공립 디플로마가 있습니다. 이 조합이, 저희가 이</span></div>
  <div class="cue clip" id="cap-142" data-start="638.42" data-duration="2.67"><span>학교를 계속 추천하는 이유입니다.</span></div>
  <div class="cue clip" id="cap-143" data-start="643.58" data-duration="3.37"><span>자녀와 함께 오시는 가족이라면 이 부분이 중요합니다.</span></div>
  <div class="cue clip" id="cap-144" data-start="647.36" data-duration="3.55"><span>부모님이 셀커크 컬리지 학생비자를 받으면, 자녀는 공립</span></div>
  <div class="cue clip" id="cap-145" data-start="650.95" data-duration="2.6"><span>초중고를 무상으로 다닐 수 있습니다.</span></div>
  <div class="cue clip" id="cap-146" data-start="654.2" data-duration="5.91"><span>학교 안내 기준으로, 1년 이상 학생비자라면 전공과 관계없이 가능합니다.</span></div>
  <div class="cue clip" id="cap-147" data-start="660.68" data-duration="4.54"><span>날씨도 걱정하실 필요가 없습니다. 겨울 평균 기온이 영하</span></div>
  <div class="cue clip" id="cap-148" data-start="665.26" data-duration="4.24"><span>7도에서 영상 1도 정도로, 캐나다 내륙에서는 온화한</span></div>
  <div class="cue clip" id="cap-149" data-start="669.54" data-duration="3.61"><span>편입니다. 여름은 23도에서 32도이고요.</span></div>
  <div class="cue clip" id="cap-150" data-start="674.62" data-duration="3.99"><span>렌트비와 교통비, 자동차 보험료까지, 생활비는 대도시와</span></div>
  <div class="cue clip" id="cap-151" data-start="678.65" data-duration="2.1"><span>비교하면 확실히 낮습니다.</span></div>
  <div class="cue clip" id="cap-152" data-start="681.44" data-duration="5.41"><span>그리고 무엇보다, 아이들이 자라기에 안전하고 친절한 작은 도시들입니다.</span></div>
  <div class="cue clip" id="cap-153" data-start="688.68" data-duration="3.14"><span>좋은 얘기만 드리면 안 되겠죠. 꼭 아셔야 할 것도</span></div>
  <div class="cue clip" id="cap-154" data-start="691.86" data-duration="1.23"><span>말씀드리겠습니다.</span></div>
  <div class="cue clip" id="cap-155" data-start="693.7" data-duration="6.13"><span>첫째, 경쟁이 세졌습니다. 2026년에는 신청이 몰려서, 9월</span></div>
  <div class="cue clip" id="cap-156" data-start="699.87" data-duration="5.77"><span>선발의 최소 점수가 125점 만점에 93점이었습니다. 예전</span></div>
  <div class="cue clip" id="cap-157" data-start="705.68" data-duration="6.14"><span>RNIP 때보다 확실히 치열합니다. 그래서 가산점이 붙는 전공</span></div>
  <div class="cue clip" id="cap-158" data-start="711.86" data-duration="2.75"><span>선택이 더 중요해졌습니다.</span></div>
  <div class="cue clip" id="cap-159" data-start="715.08" data-duration="5.16"><span>둘째, 2027년에는 기준이 바뀔 예정입니다. 웨스트 쿠트니는</span></div>
  <div class="cue clip" id="cap-160" data-start="720.28" data-duration="4.86"><span>2026년 9월 선발을 끝으로 기존 신청자 풀을 정리했고,</span></div>
  <div class="cue clip" id="cap-161" data-start="725.18" data-duration="4.7"><span>2027년 일정과 직군은 아직 발표되지 않았습니다. 지금</span></div>
  <div class="cue clip" id="cap-162" data-start="729.92" data-duration="5.17"><span>입학하시면 졸업 무렵의 기준을 따르게 되니까, 해마다 리스트가</span></div>
  <div class="cue clip" id="cap-163" data-start="735.13" data-duration="4.8"><span>바뀌어도 수요가 꾸준한 보건, 보육 전공이 안전합니다.</span></div>
  <div class="cue clip" id="cap-164" data-start="740.94" data-duration="4.31"><span>셋째, 중단 없이 졸업하는 것이 전제입니다. 저희 성공 사례는</span></div>
  <div class="cue clip" id="cap-165" data-start="745.29" data-duration="4.05"><span>모두 학업을 끝까지 마치고 지역에서 취업한 분들입니다.</span></div>
  <div class="cue clip" id="cap-166" data-start="750.51" data-duration="4.9"><span>넷째, 고용주가 지정 고용주여야 합니다. 그래서 실습과 코업</span></div>
  <div class="cue clip" id="cap-167" data-start="755.45" data-duration="4.41"><span>기간에 지정 고용주와 관계를 쌓는 것이 중요합니다.</span></div>
  <div class="cue clip" id="cap-168" data-start="763.03" data-duration="3.35"><span>마지막으로 전체 로드맵을 정리해 드리겠습니다.</span></div>
  <div class="cue clip" id="cap-169" data-start="766.93" data-duration="5.33"><span>상담과 전공 선택, 입학 지원, 입학허가서와 주정부 확인서</span></div>
  <div class="cue clip" id="cap-170" data-start="772.3" data-duration="1.72"><span>발급, 학생비자.</span></div>
  <div class="cue clip" id="cap-171" data-start="774.81" data-duration="4.37"><span>필요하면 영어 과정을 먼저 듣고, 2년 디플로마와 실습을 마친</span></div>
  <div class="cue clip" id="cap-172" data-start="779.22" data-duration="2.68"><span>뒤, 졸업 후 취업비자를 받습니다.</span></div>
  <div class="cue clip" id="cap-173" data-start="782.69" data-duration="4.49"><span>지정 고용주에게 정규직으로 취업하고, RCIP 지역 추천을</span></div>
  <div class="cue clip" id="cap-174" data-start="787.22" data-duration="2.34"><span>받아, 영주권을 신청합니다.</span></div>
  <div class="cue clip" id="cap-175" data-start="790.91" data-duration="4.21"><span>2027년 가을학기 지원은 이미 시작됐고, 대부분 9월</span></div>
  <div class="cue clip" id="cap-176" data-start="795.16" data-duration="2.48"><span>입학이라 정원이 빨리 찹니다.</span></div>
  <div class="cue clip" id="cap-177" data-start="798.17" data-duration="3.89"><span>캐나다 영주권, 꼭 대도시에서 경쟁해야 하는 건 아닙니다.</span></div>
  <div class="cue clip" id="cap-178" data-start="802.51" data-duration="4.22"><span>휴가 오고 싶은 도시에서 공부하고, 그 도시가 직접 영주권을</span></div>
  <div class="cue clip" id="cap-179" data-start="806.77" data-duration="2.15"><span>추천해 주는 길이 있습니다.</span></div>
  <div class="cue clip" id="cap-180" data-start="809.67" data-duration="4.23"><span>내 나이와 영어 점수, 가족 상황에 맞는 전공이 궁금하시면,</span></div>
  <div class="cue clip" id="cap-181" data-start="813.94" data-duration="3.06"><span>AA Canada로 상담 신청해 주세요.</span></div>
  <div class="cue clip" id="cap-182" data-start="817.39" data-duration="0.75"><span>감사합니다.</span></div>
