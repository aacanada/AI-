      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="105.3">
  <div class="cue clip" id="cap-0" data-start="0.4" data-duration="4.68"><span>캐나다 시골 영주권 루트, 한 번쯤 들어 보셨을 겁니다.</span></div>
  <div class="cue clip" id="cap-1" data-start="5.16" data-duration="5.41"><span>그런데 '시골'이라는 말 때문에 망설여지셨다면, 오늘 영상은</span></div>
  <div class="cue clip" id="cap-2" data-start="10.65" data-duration="1.93"><span>끝까지 봐 주세요.</span></div>
  <div class="cue clip" id="cap-3" data-start="12.66" data-duration="6.33"><span>오늘 소개할 곳은, 캐나다 사람들이 휴가 때 일부러 찾아가는 도시들입니다.</span></div>
  <div class="cue clip" id="cap-4" data-start="19.07" data-duration="4.5"><span>호수와 설산, 스키장과 카페, 그리고 영주권까지.</span></div>
  <div class="cue clip" id="cap-5" data-start="23.65" data-duration="4.5"><span>이 지역 공립 컬리지를 졸업하고 현지에서 취업한 저희</span></div>
  <div class="cue clip" id="cap-6" data-start="28.22" data-duration="6.14"><span>학생들은, RNIP, 그리고 지금의 RCIP로 영주권을 받았습니다.</span></div>
  <div class="cue clip" id="cap-7" data-start="34.45" data-duration="5.05"><span>오늘은 그 학교, 셀커크 컬리지와 RCIP 제도를 처음부터</span></div>
  <div class="cue clip" id="cap-8" data-start="39.57" data-duration="2.85"><span>끝까지 정리해 드리겠습니다.</span></div>
  <div class="cue clip" id="cap-9" data-start="42.7" data-duration="2.6"><span>첫 번째 도시, 넬슨입니다.</span></div>
  <div class="cue clip" id="cap-10" data-start="45.38" data-duration="5.09"><span>넬슨은 1880년대 은광 마을로 시작한 도시인데요, 지금도</span></div>
  <div class="cue clip" id="cap-11" data-start="50.55" data-duration="4.92"><span>다운타운 베이커 스트리트에는 19세기 붉은 벽돌 건물들이</span></div>
  <div class="cue clip" id="cap-12" data-start="55.55" data-duration="2.24"><span>그대로 남아 있습니다.</span></div>
  <div class="cue clip" id="cap-13" data-start="57.87" data-duration="4.92"><span>그래서 '쿠트니의 여왕 도시', Queen City라는</span></div>
  <div class="cue clip" id="cap-14" data-start="62.86" data-duration="2.06"><span>별명으로 불립니다.</span></div>
  <div class="cue clip" id="cap-15" data-start="65.01" data-duration="4.92"><span>캐나다 여행 매체들이 '가장 매력적인 작은 도시'를 꼽을 때</span></div>
  <div class="cue clip" id="cap-16" data-start="70.0" data-duration="2.78"><span>빠지지 않는 곳이기도 하고요.</span></div>
  <div class="cue clip" id="cap-17" data-start="72.86" data-duration="4.92"><span>겨울에는 근처 화이트워터 스키장에서 파우더 스키를 타고,</span></div>
  <div class="cue clip" id="cap-18" data-start="77.85" data-duration="5.45"><span>여름에는 쿠트니 호수에서 카약과 패들보드, 래프팅을 즐깁니다.</span></div>
  <div class="cue clip" id="cap-19" data-start="83.39" data-duration="5.27"><span>예술가와 환경운동가, 여러 전문직 종사자들이 일부러 이사 오는</span></div>
  <div class="cue clip" id="cap-20" data-start="88.74" data-duration="5.99"><span>도시이고, 인구에 비해 카페와 레스토랑, 수제 맥주집이 정말 많습니다.</span></div>
  <div class="cue clip" id="cap-21" data-start="94.81" data-duration="4.74"><span>그러니까 이 지역은, 어쩔 수 없이 가는 시골이 아닙니다.</span></div>
  <div class="cue clip" id="cap-22" data-start="99.62" data-duration="5.09"><span>캐나다 사람들이 휴가를 오고, 은퇴하고 싶어 하는 곳입니다.</span></div>
      </div>
