        (function () {
          const tl = gsap.timeline({ paused: true });

          function whip(sel, at, dy) {

            tl.fromTo(sel, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at);

          function drop(sel, at, rot) {
            tl.fromTo(sel, { opacity: 0, y: 130, rotation: rot * 2.4, scale: 0.92 }, { opacity: 1, y: 0, rotation: rot, scale: 1, duration: 0.9, ease: "back.out(1.4)" }, at);

          // A 0–8
          tl.fromTo("#n-a-glow", { scale: 0.8 }, { scale: 1.1, duration: 8, ease: "sine.inOut" }, 0);

          rise("#n-a-sub2", 2.2);

          // B 8–20

          rise("#n-b-yearlab", B + 1.5);

          // C 20–28
          const C = 20;
          drop("#n-c-card", C + 0.2, 3);
          tl.fromTo("#n-c-img", { scale: 1.12 }, { scale: 1.0, duration: 7.8, ease: "sine.out" }, C + 0.2);
          tl.fromTo("#n-c-mark", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, C + 0.6);
          whip("#n-c-q", C + 1.0, 80);
          rise("#n-c-src", C + 2.4);

          // D 28–42

          rise("#n-d-label", D + 0.2);
          whip("#n-d-title", D + 0.5, 70);
          tl.fromTo("#n-d-w", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, D + 1.2);

          tl.fromTo("#n-d-s", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, D + 5.5);
          tl.fromTo("#n-d-simg", { scale: 1.2 }, { scale: 1.0, duration: 8.5, ease: "sine.out" }, D + 5.5);

          // E 42–54

          rise("#n-e-label", E + 0.2);

          drop("#n-e-c1", E + 1.4, -4);

          drop("#n-e-c3", E + 3.4, -2);
          rise("#n-e-who", E + 5.2);

          // F 54–63
