    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var DUR = 4.565;
        // one beat array off the voiceover cues
        var BEATS = { modu: 0.22, hapchimyeon: 0.5, canada: 1.5, apdo: 2.48, jeoryeom: 3.0 };

        // Scene 1 — chips appear in a row at y≈450
        var chips = ["#f06-chip-rent", "#f06-chip-tuition", "#f06-chip-car"];
        chips.forEach(function (sel, i) {
          var el = document.querySelector(sel);
          var tx = Number(el.dataset.targetX);
          tl.fromTo(el,
            { xPercent: -50, yPercent: -50, x: tx, y: 30, scale: 0.7, opacity: 0 },
            { x: tx, y: 0, scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2)" },
            BEATS.modu + i * 0.05);
        });

        // piggy bank settles in below
        tl.fromTo("#f06-piggy",
          { y: 40, scale: 0.85, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          0.34);

        // on "합치면" — converge (center-outward-expansion reversed): outer chips slide to center
        chips.forEach(function (sel, i) {
          var el = document.querySelector(sel);
          tl.to(el, { x: 0, scale: 0.82, duration: 0.42, ease: "power3.out" }, BEATS.hapchimyeon + Math.abs(i - 1) * 0.04);
        });
        // ...then drop through the coin slot, staggered
        chips.forEach(function (sel, i) {
          tl.to(sel, { y: 165, scale: 0.28, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.98 + i * 0.09);
        });
        // piggy reacts to each coin, final squash-settle
        tl.to("#f06-piggy", { scaleY: 0.92, scaleX: 1.06, duration: 0.1, ease: "power2.out" }, 1.38);
        tl.to("#f06-piggy", { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1, 0.45)" }, 1.48);

        // Scene 2 — "캐나다 어느 도시보다": per-word staggered fade/blur
        tl.fromTo("#f06-sub .f06-w",
          { y: 26, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.16 },
          BEATS.canada);

        // "압도적으로" — kinetic-beat-slam: scale+blur slam
        tl.fromTo("#f06-hero",
          { scale: 1.6, opacity: 0, filter: "blur(18px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
          BEATS.apdo);

        // "저렴" — distinct entrance: rise + rotate
        tl.fromTo("#f06-cheap",
          { y: 90, rotation: 5, opacity: 0 },
          { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
          BEATS.jeoryeom);
        // finale dressing — cobalt underline sweep
        tl.fromTo("#f06-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "expo.out" },
          BEATS.jeoryeom + 0.3);

        // small muted tag settles beside the piggy bank
        tl.fromTo("#f06-tag",
          { x: -20, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
          BEATS.jeoryeom + 0.12);

        // Hold — quiet breath on the whole stage, ends exactly at DUR
        tl.fromTo("#f06-stage", { scale: 1 }, { scale: 1.015, duration: DUR - 3.6, ease: "sine.inOut" }, 3.6);

        window.__timelines["06-cheapest"] = tl;
      })();
