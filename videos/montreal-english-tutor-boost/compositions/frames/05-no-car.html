      position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;

    }
    .f05-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    /* Scene 1 — eyebrow + family glyph */
    .f05-accent {
      position: absolute; left: 510px; top: 232px; width: 60px; height: 4px;
      border-radius: 2px; background: #1e2bfa;
    }
    .f05-eyebrow-row {
      position: absolute; left: 0; top: 280px; width: 1080px; height: 100px;
      display: flex; align-items: center; justify-content: center; gap: 22px;
    }
    .f05-family { width: 84px; height: 96px; }
    .f05-family circle, .f05-family path {
      fill: none; stroke: #1e2bfa; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
    }
    .f05-eyebrow {
      font-size: 44px; font-weight: 700; letter-spacing: 0.08em; color: #1e2bfa;
      white-space: nowrap;
    }

    /* Metro / bus line diagram (behind car) */
    .f05-metro { position: absolute; left: 0; top: 470px; width: 1080px; height: 460px; }
    .f05-metro .f05-line {
      fill: none; stroke: #1e2bfa; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round;
    }
    .f05-metro .f05-line-b { stroke-opacity: 0.55; }
    .f05-metro .f05-line-c { stroke-opacity: 0.3; }
    .f05-metro .f05-stop { fill: #fdfae7; stroke: #1e2bfa; stroke-width: 7; }

    /* Car */
    .f05-car-plate {
      position: absolute; left: 290px; top: 548px; width: 500px; height: 304px;
      border-radius: 14px; background: #fdfae7;
    }
    .f05-car { position: absolute; left: 315px; top: 585px; width: 450px; height: 248px; }
    .f05-car path, .f05-car circle {
      fill: none; stroke: #111111; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    }
    .f05-x { position: absolute; left: 380px; top: 540px; width: 320px; height: 320px; }
    .f05-x line { stroke: #dc2626; stroke-width: 26; stroke-linecap: round; }

    /* Hero */
    .f05-hero {
      position: absolute; left: 0; top: 975px; width: 1080px; text-align: center;
      font-size: 132px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; color: #111111;
      white-space: nowrap;
    }
    .f05-tag-wrap { position: absolute; left: 0; top: 1150px; width: 1080px; display: flex; justify-content: center; }
    .f05-tag {
      padding: 14px 34px; border-radius: 100px; background: rgba(30,43,250,0.08);
      color: #1e2bfa; font-size: 40px; font-weight: 700; white-space: nowrap;
    }

    /* Cost cards */
    .f05-card {
      position: absolute; width: 300px; height: 150px;
      border-radius: 14px; border: 1.5px solid rgba(30,43,250,0.2);
      background: linear-gradient(rgba(30,43,250,0.04), rgba(30,43,250,0.04)), #fdfae7;
      display: flex; align-items: center; justify-content: center;
    }
    .f05-card-l { left: 90px; top: 1360px; }
    .f05-card-r { left: 690px; top: 1360px; }
    .f05-card-label { position: relative; font-size: 56px; font-weight: 700; color: #111111; letter-spacing: -0.02em; }
    .f05-strike {
      position: absolute; left: -16px; top: 50%; width: calc(100% + 32px); height: 8px; margin-top: -4px;
      border-radius: 4px; background: #dc2626; transform-origin: 0% 50%;
    }

    /* Saving pill */
    .f05-save-wrap { position: absolute; left: 0; top: 1392px; width: 1080px; display: flex; justify-content: center; }
    .f05-save {
      padding: 18px 48px; border-radius: 100px; background: #1e2bfa; color: #fdfae7;
      font-size: 60px; font-weight: 800; white-space: nowrap;
    }

    .f05-progress {
      position: absolute; left: 0; bottom: 0; width: 600px; height: 3px; background: #1e2bfa;
    }
  </style>

  <div id="root" data-composition-id="05-no-car" data-width="1080" data-height="1920" data-start="0" data-duration="7.213">
    <div id="f05-bg" class="clip f05-bg" data-start="0" data-duration="7.213" data-track-index="0"></div>

    <div id="f05-stage" class="clip f05-stage" data-start="0" data-duration="7.213" data-track-index="1">
      <div id="f05-accent" class="f05-accent"></div>
      <div class="f05-eyebrow-row">
        <svg id="f05-family" class="f05-family" viewBox="0 0 84 96" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="16" r="11" />
          <path d="M 8 92 L 8 52 Q 8 36 26 36 Q 44 36 44 52 L 44 92" />
          <circle cx="66" cy="44" r="8" />
          <path d="M 54 92 L 54 70 Q 54 60 66 60 Q 78 60 78 70 L 78 92" />
        </svg>
        <div id="f05-eyebrow" class="f05-eyebrow">자녀 동반 가족</div>
      </div>

      <svg id="f05-metro" class="f05-metro" viewBox="0 0 1080 460" xmlns="http://www.w3.org/2000/svg">

        <path id="f05-line-b" class="f05-line f05-line-b" d="M 60 250 H 1020" />
        <path id="f05-line-c" class="f05-line f05-line-c" d="M 60 420 H 560 L 640 340 H 1020" />
        <g id="f05-stops-a">
          <circle class="f05-stop" cx="60" cy="60" r="16" />
          <circle class="f05-stop" cx="230" cy="60" r="16" />
          <circle class="f05-stop" cx="860" cy="140" r="16" />

        </g>
        <g id="f05-stops-b">
          <circle class="f05-stop" cx="60" cy="250" r="16" />
          <circle class="f05-stop" cx="200" cy="250" r="16" />
          <circle class="f05-stop" cx="880" cy="250" r="16" />
          <circle class="f05-stop" cx="1020" cy="250" r="16" />
        </g>
        <g id="f05-stops-c">
          <circle class="f05-stop" cx="60" cy="420" r="16" />
          <circle class="f05-stop" cx="240" cy="420" r="16" />

        <path id="f05-car-body" d="M 82 168 L 44 168 Q 28 168 28 152 L 28 122 Q 28 104 48 101 L 100 94 L 140 52 Q 150 42 166 42 L 254 42 Q 270 42 280 54 L 318 94 L 352 100 Q 372 104 372 124 L 372 152 Q 372 168 356 168 L 318 168 M 254 168 L 146 168" />
        <path id="f05-car-win-l" d="M 116 94 L 152 58 L 194 58 L 194 94 Z" />

      <div id="f05-hero" class="f05-hero">차 없이 생활</div>
      <div class="f05-tag-wrap"><div id="f05-tag" class="f05-tag">거의 유일한 도시</div></div>

      <div id="f05-card-l" class="f05-card f05-card-l">

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-no-car"]');
      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return root.querySelectorAll(sel); };

      // svg-path-draw setup: measured lengths
      function prepDraw(el) {
        var len = 0;
        try { len = el.getTotalLength(); } catch (e) { len = 0; }
        if (!len) { el.setAttribute("pathLength", "100"); len = 100; }
        len = len * 1.02;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        return len;
      }
      var drawEls = qa("#f05-car path, #f05-car circle, #f05-metro .f05-line, #f05-family circle, #f05-family path");
      drawEls.forEach(prepDraw);

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.5s) ----
      tl.fromTo(q("#f05-accent"), { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo(q("#f05-eyebrow"), { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.to(qa("#f05-family circle, #f05-family path"), { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.08 }, 0.45);

      // car draws in on "함께" (0.88s)
      tl.fromTo(q("#f05-car-plate"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.1);
      tl.to(q("#f05-car-body"), { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 0.35);
      tl.to(qa("#f05-car-wheel-l, #f05-car-wheel-r"), { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 }, 0.85);
      tl.to(qa("#f05-car-win-l, #f05-car-win-r"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, 1.02);

      // ---- Scene 2 (1.5–4.6s) ----
      // red X slams: "차" (1.58) / "없이" (1.78)
      tl.fromTo(q("#f05-x-a"), { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.out" }, 1.58);
      tl.fromTo(q("#f05-x-b"), { opacity: 0, scale: 1.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.out" }, 1.78);
      tl.to(q("#f05-car"), { keyframes: { x: [0, -10, 8, -4, 0] }, duration: 0.3, ease: "none" }, 1.62);
      tl.to(qa("#f05-car path, #f05-car circle"), { stroke: "#9a9a9a", duration: 0.4, ease: "power1.out" }, 1.9);

      // metro/bus lines draw across behind, on "생활할" (2.08)
      tl.to(q("#f05-line-a"), { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 2.08);
      tl.to(q("#f05-line-b"), { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 2.68);
      tl.to(q("#f05-line-c"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.0);
      tl.fromTo(qa("#f05-stops-a circle"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.07 }, 2.3);
      tl.fromTo(qa("#f05-stops-b circle"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.07 }, 2.85);
      tl.fromTo(qa("#f05-stops-c circle"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.07 }, 3.15);

      // hero "차 없이 생활" on "유일한" (3.22), tag at 3.64
      tl.fromTo(q("#f05-hero"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.22);
      tl.fromTo(q("#f05-tag"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 3.64);

      // ---- Scene 3 (4.6–7.21s) ----
      // cost cards pop off the car, strike, fall away to mirrored wings (comparison-split adapt)
      // card resting position is 1360 top; car centre ~ y 700 → start offset
      function costCard(card, strike, t, dx, tilt) {
        tl.fromTo(card,
          { opacity: 0, x: dx, y: -720, scale: 0.4, rotation: 0, rotationY: 0, transformPerspective: 900 },
          { opacity: 1, x: dx * 0.6, y: -800, scale: 1, duration: 0.25, ease: "back.out(2)" }, t);
        tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, t + 0.2);
        tl.to(card, { x: 0, y: 0, rotation: tilt, rotationY: tilt * 1.6, duration: 0.6, ease: "power2.in" }, t + 0.3);
        tl.to(card, { opacity: 0.55, duration: 0.3, ease: "power1.out" }, t + 0.75);
      }
      costCard(q("#f05-card-l"), q("#f05-strike-l"), 4.70, 300, -10);
      costCard(q("#f05-card-r"), q("#f05-strike-r"), 5.26, -300, 10);

      // "절약" pill on "아낍니다" (5.68) — the one overshoot
      tl.fromTo(q("#f05-save"), { opacity: 0, scale: 0.3, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.4)" }, 5.68);
      // hold to end
      tl.to({}, { duration: 0.01 }, 7.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-no-car"] = tl;
    })();
  </script>
</template>
