<script>
(function () {
  var DUR = 8.091;
  var tl = gsap.timeline({ paused: true });

  // --- svg-path-draw setup: measure every drawable stroke ---
  function prep(el) {
    var len = el.getTotalLength() * 1.05;
    el.style.strokeDasharray = len + "";
    el.style.strokeDashoffset = len + "";
    return el;
  }
  var shaft = prep(document.getElementById("f07-arrow-shaft"));
  var tip = prep(document.getElementById("f07-arrow-tip"));

  // ===== Scene 1 (0.0–2.6s): piggy -> arrow -> tutor header -> note =====
  // "아낀" 0.08s — piggy bank pops in
  tl.fromTo("#f07-piggy",
    { opacity: 0, scale: 0.7, transformOrigin: "50% 60%" },
    { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.08);
  // arrow draws right toward the header slot
  tl.to(shaft, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.45);
  tl.to(tip, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.82);

  // "원어민" 1.00s — header card lands
  tl.fromTo("#f07-head",
    { opacity: 0, x: -28, scale: 0.97, transformOrigin: "0% 50%" },
    { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 1.0);
  tl.fromTo("#f07-head-title",
    { opacity: 0, y: 18 },
    { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.08);
  // "튜터를" 1.38s — person+book glyph pops
  tl.fromTo("#f07-head-icon",
    { opacity: 0, scale: 0.5 },
    { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.38);

  // "붙이면" 1.90s — small muted note settles
  tl.fromTo("#f07-note",
    { opacity: 0, y: 14 },
    { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.9);

  // empty skeleton slots for the 2x2 grid establish the region (dim)
  var cards = ["#f07-c1", "#f07-c2", "#f07-c3", "#f07-c4"];
  cards.forEach(function (sel, i) {
    tl.fromTo(sel,
      { opacity: 0, scale: 0.96, y: 16 },
      { opacity: 0.35, scale: 0.96, y: 0, duration: 0.5, ease: "power2.out" }, 2.2 + i * 0.06);
  });

  // ===== Scene 2 (2.6–8.09s): cards light up one by one =====
  var cues = [3.6, 4.66, 5.42, 6.34]; // "1:1" · "학교" · "영어도" · "빨라집니다"
  cards.forEach(function (sel, i) {
    var t = cues[i];
    var card = document.querySelector(sel);
    var icon = card.querySelector(".f07-icon");
    var title = card.querySelector(".f07-title");
    var sub = card.querySelector(".f07-sub");
    var lines = card.querySelectorAll(".f07-icon .f07-ln");
    var dots = card.querySelectorAll(".f07-icon .f07-dot");

    // initial hidden content states (fromTo -> set at build time)
    tl.fromTo(icon, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t);
    tl.fromTo(title, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.08);
    tl.fromTo(sub, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.16);

    // card shell lights up: scale 0.96 -> 1 + opacity
    tl.to(card, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, t);

    // icon strokes draw in
    lines.forEach(function (ln, k) {
      prep(ln);
      tl.to(ln, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, t + 0.05 + k * 0.08);
    });
    if (dots.length) {
      tl.fromTo(dots, { opacity: 0, scale: 0, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)", stagger: 0.06 }, t + 0.35);
    }

    // accent line hidden until the 6.6s sweep
    tl.fromTo(card.querySelector(".f07-accent"), { scaleX: 0 },
      { scaleX: 1, duration: 0.45, ease: "power2.out" }, 6.6 + i * 0.07);
  });

  // gentle push-in through the hold
  tl.fromTo("#f07-cam", { scale: 1 }, { scale: 1.025, duration: DUR - 2.6, ease: "none" }, 2.6);

  // pad timeline to the full frame length
  tl.set({}, {}, DUR);

  window.__timelines = window.__timelines || {};
  window.__timelines["07-tutor"] = tl;
})();
</script>
