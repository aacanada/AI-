<script>
(function () {
  window.__timelines = window.__timelines || {};
  var D = 4.768;
  // One cue array drives every reveal — VO word onsets.
  var CUE = {
    canada: 0.24,
    edu: 0.62,
    english: 1.64,
    fast: 2.32,
    city: 2.78,
    where: 3.16
  };
  var tl = gsap.timeline({ paused: true });

  // Macro camera: slow push-in under the whole shot (no exit).
  tl.fromTo("#f01-stage", { scale: 1 }, { scale: 1.035, duration: D, ease: "none" }, 0);
  tl.fromTo("#f01-band", { x: -30 }, { x: 30, duration: D, ease: "none" }, 0);

  // Scene 1 — eyebrow pill settles, then 4 city chips rise index-staggered.
  tl.fromTo("#f01-accent-line", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, CUE.canada);
  tl.fromTo("#f01-eyebrow", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, CUE.canada);
  tl.fromTo(".f01-chip", { y: 60, opacity: 0, scale: 0.92 },
    { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.09 }, CUE.edu);

  // Scene 2 — kinetic-beat-slam: distinct entrance per line on the cue grid.
  tl.fromTo("#f01-l1", { scale: 1.5, filter: "blur(16px)", opacity: 0, transformOrigin: "0% 50%" },
    { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" }, CUE.english);
  tl.fromTo("#f01-l2", { x: -320, opacity: 0 },
    { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, CUE.fast);

  // Scene 3 — third line rises, then the "?" payoff pops + chips foreshadow Montreal.
  tl.fromTo("#f01-l3", { y: 90, rotation: 6, opacity: 0, transformOrigin: "0% 100%" },
    { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, CUE.city);
  tl.fromTo("#f01-qdisc", { scale: 0, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, CUE.where);
  tl.fromTo("#f01-qmark", { scale: 0.2, rotation: -18, opacity: 0 },
    { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(2)" }, CUE.where);
  tl.fromTo(".f01-chip-dim", { opacity: 1 }, { opacity: 0.4, duration: 0.4, ease: "power2.out" }, CUE.where + 0.1);
  tl.fromTo("#f01-ring", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, CUE.where + 0.1);
  tl.fromTo("#f01-mtl-label", { color: "#111111" }, { color: "#1e2bfa", duration: 0.3, ease: "power2.out" }, CUE.where + 0.1);
  tl.fromTo("#f01-chip-mtl", { scale: 1 }, { scale: 1.06, duration: 0.45, ease: "power3.out" }, CUE.where + 0.1);

  window.__timelines["01-hook"] = tl;
})();
