  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">

      <canvas id="fx" class="clip" data-layout-allow-overlap width="1080" height="1920" data-start="0" data-duration="__TOTAL__" data-track-index="5"></canvas>
      <div id="brand" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="6"><b>AA</b> CANADA · 핼리팩스 자녀무상교육</div>
      __CAPTIONS__
      <audio id="narration" class="clip" src="assets/audio/narration.wav" data-start="0" data-duration="__TOTAL__" data-track-index="9" data-volume="1"></audio>
      <audio id="music-bed" class="clip" src="assets/bgm/bed.wav" data-start="0" data-duration="__TOTAL__" data-track-index="10" data-volume="0.3"></audio>
      __SFX__
    </div>
    <script>
      const TIMING = __TIMING__;
      const M = __MARKS__;
      const S = TIMING.scenes, TOTAL = TIMING.total;
      const C = (i, j) => S[i].captions[j].start;          // chunk i,j starts speaking
      const E = (i, j) => S[i].captions[j].speech_end;     // chunk i,j finishes speaking
      const ST = (i) => S[i].start;
      const TR = (i) => S[i].start - 0.25;                  // shader transition into scene i
      const AEND = (i) => S[i].audio_end;

      const tl = HyperShader.init({
        bgColor: "#0b1730",
        accentColor: "#ffd23f",
        scenes: S.map((s) => s.id),
        transitions: [
          { time: TR(1), shader: "flash-through-white", duration: 0.5 },
          { time: TR(2), shader: "whip-pan", duration: 0.5 },
          { time: TR(3), shader: "glitch", duration: 0.45 },
          { time: TR(4), shader: "cinematic-zoom", duration: 0.5 },
          { time: TR(5), shader: "chromatic-split", duration: 0.5 },
          { time: TR(6), shader: "light-leak", duration: 0.6 },
        ],
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // ---------- helpers ----------
      const pop = (sel, t, extra) => tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.9 },
        Object.assign({ opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, extra || {}), t);
      const kin = (sel, t, stg) => tl.fromTo(sel, { opacity: 0, rotationX: 90, y: 60, filter: "blur(12px)" },
        { opacity: 1, rotationX: 0, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: stg || 0.03 }, t);
      const sweep = (sel, t, d) => tl.fromTo(sel, { x: -600, rotation: 25 }, { x: 1500, rotation: 25, duration: d || 1.0, ease: "power2.inOut" }, t);
      const ring = (sel, t) => tl.fromTo(sel, { opacity: 1, scale: 0 }, { opacity: 0, scale: 3, duration: 0.75, ease: "power2.out" }, t);
      const draw = (sel, t, d, extra) => tl.fromTo(sel, { strokeDashoffset: 1 }, Object.assign({ strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, extra || {}), t);
      const fnIn = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t);
      function shake(sel, t, a) {
        a = a || 8;
        [[a, -a * 0.7], [-a * 0.85, a * 0.6], [a * 0.6, a * 0.8], [-a * 0.4, -a * 0.4], [0, 0]]
          .forEach((p, k) => tl.to(sel, { x: p[0], y: p[1], duration: 1 / 30, ease: "none" }, t + k / 30));
      }
      function slam(sel, t, from) {  // big scale-in that lands at t + 0.3

      function stamp(sel, t, rot) {  // lands at t + 0.28

      }

      // ---------- deterministic particles (seeded PRNG, drawn from timeline time) ----------
      const FX = document.getElementById("fx"), g = FX.getContext("2d");
      function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const GOLD = ["#ffd23f", "#ffe58a", "#ffb800", "#ffffff"];
      const SYS = [];
      function burst(t0, x, y, o) {
        o = o || {}; const r = rng(o.seed || 7), cols = o.colors || GOLD, ps = [];
        for (let k = 0; k < (o.n || 90); k++) {
          const a = o.cone ? -Math.PI / 2 + (r() - 0.5) * o.cone : r() * Math.PI * 2, sp = (o.sp || 1100) * (0.3 + r() * 0.8);
          ps.push({ vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: (o.size || 9) * (0.5 + r()), c: cols[k % cols.length], l: (o.life || 1.2) * (0.55 + r() * 0.45), sq: r() < 0.5 });
        }
        SYS.push({ t0, x, y, ps, grav: o.grav == null ? 1500 : o.grav, drag: o.drag || 2.4, kind: "burst" });
      }
      function rain(t0, t1, n, seed) {
        const r = rng(seed), ps = [];
        for (let k = 0; k < n; k++) ps.push({ x: r() * 1080, y0: 480 + r() * 300, d: r() * (t1 - t0 - 0.8), v: 140 + r() * 160, s: 4 + r() * 7, w: r() * 6, c: GOLD[k % 4] });
        SYS.push({ t0, t1, ps, kind: "rain" });
      }
      function drawFx(t) {
        g.clearRect(0, 0, 1080, 1920);
        for (const s of SYS) {
          if (s.kind === "burst") {
            const dt = t - s.t0; if (dt < 0 || dt > 2) continue;
            const k = (1 - Math.exp(-s.drag * dt)) / s.drag;
            for (const p of s.ps) {
              if (dt > p.l) continue;
              const x = s.x + p.vx * k, y = s.y + p.vy * k + 0.5 * s.grav * dt * dt * 0.6, a = 1 - dt / p.l, sz = p.s * (0.4 + 0.6 * a);
              g.globalAlpha = a; g.fillStyle = p.c;
              if (p.sq) { g.fillRect(x - sz / 2, y - sz / 2, sz, sz); } else { g.beginPath(); g.arc(x, y, sz / 2, 0, 6.2832); g.fill(); }
            }
          } else {
            const dt = t - s.t0; if (dt < 0 || t > s.t1) continue;
            for (const p of s.ps) {
              const lt = dt - p.d; if (lt < 0) continue;
              const a = Math.min(1, lt * 2.5) * Math.max(0, Math.min(1, (s.t1 - t) * 3));
              g.globalAlpha = a * 0.85; g.fillStyle = p.c; g.beginPath();
              g.arc(p.x + Math.sin(lt * 2 + p.w) * 18, p.y0 + p.v * lt, p.s / 2, 0, 6.2832); g.fill();
            }
          }
        }
        g.globalAlpha = 1;
      }

      // ---------- global: drifting mesh, parallax grid, bokeh ----------
      tl.fromTo(".mesh", { x: -60, y: 0 }, { x: 60, y: -180, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo(".gridl", { y: 0 }, { y: -360, duration: TOTAL, ease: "none" }, 0);
      document.querySelectorAll(".bk").forEach((el) => tl.fromTo(el, { y: 0 }, { y: -520 * parseFloat(el.dataset.sp), duration: TOTAL, ease: "none" }, 0));
      // captions
      S.forEach((s, i) => s.captions.forEach((c, j) =>
        tl.fromTo(`#cap-${i}-${j}-box`, { opacity: 0, scale: 0.9, y: -12 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(2)" }, c.start)));
      // every scene drifts in with a slow camera push (the shader transition is the handoff)
      S.forEach((s, i) => { if (i) tl.fromTo(`#${s.id}-cam`, { scale: 1.08 }, { scale: 1, duration: 1.2, ease: "power3.out" }, TR(i)); });

      // ===== S1 hook: $10,000 → $0 =====
      tl.fromTo("#s1-hook-cam", { scale: 1.04 }, { scale: 1, duration: 2.4, ease: "power2.out" }, 0);
      tl.fromTo("#s1-tag", { rotationY: -8, y: 10 }, { rotationY: 6, y: -16, duration: 2.2, ease: "sine.inOut" }, 0);

      const tZoom = M.halifax - 0.75;
      tl.to("#s2-mapsvg", { scale: 3, x: -405, y: -168, transformOrigin: "905px 468px", duration: 1.0, ease: "power3.inOut" }, tZoom);
      tl.to("#s2-mapcap", { opacity: 0, duration: 0.3 }, tZoom);
      tl.fromTo("#s2-ns", { attr: { opacity: 0, r: 4 } }, { attr: { opacity: 1, r: 12 }, duration: 0.4 }, tZoom + 0.8);
      tl.fromTo("#s2-pin", { y: -520, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "bounce.out" }, M.halifax - 0.05);
      ring("#s2-ring", M.halifax + 0.45);

      tl.fromTo("#s2-card", { rotationY: -90, x: -140, opacity: 0, boxShadow: "-80px 40px 60px rgba(0,0,0,0)" },
        { rotationY: 0, x: 0, opacity: 1, boxShadow: "0px 40px 70px rgba(0,0,0,0.5)", duration: 0.75, ease: "back.out(1.3)" }, M.visa - 0.2);
      sweep("#s2-sweep", M.visa + 0.6, 0.9);
      pop("#s2-school", C(1, 2) - 0.05);
      tl.to("#s2-school .win", { attr: { fill: "#ffd23f" }, duration: 0.12, stagger: 0.07 }, C(1, 2) + 0.35);
      const hit2 = M.free + 0.3;
      stamp("#s2-stamp", hit2 - 0.28, -12);
      burst(hit2, 790, 1210, { n: 70, seed: 21, sp: 700, size: 7, colors: ["#2ec27e", "#c8f5df", "#ffffff"], grav: 600, life: 0.8 });
      shake("#s2-rule-cam", hit2, 9);
      fnIn("#s2-fn", C(1, 2) + 0.6);

      // ===== S3 no university needed =====
      tl.fromTo("#s3-l", { x: -620, rotationY: 40, opacity: 0 }, { x: 0, rotationY: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, TR(2) + 0.1);
      tl.fromTo("#s3-r", { x: 620, rotationY: -40, opacity: 0 }, { x: 0, rotationY: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, TR(2) + 0.25);
      pop("#s3-x", C(2, 1) + 0.1);
      tl.to("#s3-l", { opacity: 0.72, duration: 0.3 }, C(2, 1) + 0.1);
      const tOk = M.ok;
      tl.to("#s3-gray", { opacity: 0, duration: 0.35 }, tOk - 0.15);
      tl.to("#s3-r", { backgroundColor: "#14523c", borderColor: "#2ec27e", scale: 1.04, duration: 0.35, ease: "back.out(2)" }, tOk - 0.1);
      pop("#s3-ok", tOk);
      draw("#s3-ok path", tOk + 0.15, 0.35);
      sweep("#s3-sweep", tOk + 0.2, 0.8);
      burst(tOk + 0.25, 795, 1075, { n: 60, seed: 31, sp: 800, size: 7, colors: ["#2ec27e", "#ffd23f", "#ffffff"], life: 0.9 });
      const hit3 = M.nocond + 0.3;
      stamp("#s3-stamp", hit3 - 0.28, -7);
      burst(hit3, 540, 1230, { n: 110, seed: 33, sp: 1200 });
      shake("#s3-school-cam", hit3, 10);
      fnIn("#s3-fn", hit3 + 0.3);

      // ===== S4 40 → 50 weeks =====
      tl.fromTo("#s4-head", { opacity: 0, y: 50, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, TR(3) + 0.2);
      tl.fromTo(".w-d0", { y: -4 * 180 }, { y: -4 * 180, duration: 0.01 }, 0);

      sweep("#s4-sweep", C(3, 3) + 0.65, 0.9);
      const hit4 = M.year + 0.15;
      stamp("#s4-stamp", hit4 - 0.28, -10);
      burst(hit4, 370, 1150, { n: 60, seed: 43, sp: 700, size: 6, colors: ["#e63946", "#ffffff", "#ffd23f"], grav: 600, life: 0.8 });
      shake("#s4-weeks-cam", hit4, 7);

      pop("#s4-ck", hit4 + 1.15);
      draw("#s4-ck path", hit4 + 1.3, 0.3);
      const tEv = AEND(3) + 0.35;
      tl.fromTo("#s4-evid", { rotationY: 70, rotationX: 10, opacity: 0, y: 60 }, { rotationY: 0, rotationX: 0, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" }, tEv);
      tl.to("#s4-mk", { scaleX: 1, duration: 0.6, ease: "power2.out" }, tEv + 0.55);
      tl.to("#s4-evid", { rotationY: -70, opacity: 0, duration: 0.35, ease: "power2.in" }, tEv + 2.0);

      // ===== S5 price receipt =====
      tl.fromTo(".printer", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, TR(4) + 0.2);
      tl.fromTo("#s5-pimg", { opacity: 0 }, { opacity: 0.4, duration: 0.6 }, ST(4) + 0.3);
      tl.fromTo("#s5-rcpt", { yPercent: -100 }, { yPercent: 0, duration: 1.5, ease: "steps(15)" }, C(4, 0) + 0.05);
      tl.fromTo("#s5-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, M.roll - 0.35);
      const PH = 124;
      [[".p-d1", 1, 11, 0.9], [".p-d2", 5, 11, 1.0], [".p-d4", 2, 14, 1.1], [".p-d5", 0, 10, 1.2], [".p-d6", 0, 10, 1.3]]
        .forEach(([sel, a, b, d]) => tl.fromTo(sel, { y: -a * PH }, { y: -b * PH, duration: d, ease: "power3.out" }, M.roll - 0.1));
      tl.fromTo(".rc-big", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, M.roll + 1.2);
      burst(M.roll + 1.25, 540, 960, { n: 70, seed: 51, sp: 900, size: 7, life: 0.9 });
      tl.fromTo("#s5-badge", { opacity: 0, scale: 0, rotation: -220 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.55, ease: "back.out(1.8)" }, M.pct - 0.15);
      burst(M.pct + 0.35, 936, 712, { n: 60, seed: 53, sp: 800, size: 7, colors: ["#e63946", "#ffd23f", "#ffffff"], life: 0.9 });
      tl.fromTo("#s5-vac", { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, M.pct + 0.6);
      tl.fromTo("#s5-vac", { scale: 1 }, { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1 }, M.pct + 0.6);
      fnIn("#s5-fn", C(4, 2) + 0.4);
      const tSharp = E(4, 2) + 0.15;
      tl.to("#s5-pimg", { filter: "blur(0px)", opacity: 1, scale: 1.06, duration: 0.25 }, tSharp);
      tl.to("#s5-pimg", { filter: "blur(5px)", opacity: 0.4, scale: 1, duration: 0.3 }, tSharp + 1.05);

      // ===== S6 why parents like it =====

      const t930 = M["930"];
      tl.fromTo("#s6-hh", { rotation: 210, svgOrigin: "220 220" }, { rotation: 285, svgOrigin: "220 220", duration: 0.9, ease: "power3.inOut" }, t930 - 0.3);
      tl.fromTo("#s6-mh", { rotation: 0, svgOrigin: "220 220" }, { rotation: 900, svgOrigin: "220 220", duration: 0.9, ease: "power3.inOut" }, t930 - 0.3);
      pop("#s6-t1", t930 + 0.55);
      pop("#s6-f1", C(5, 0) + 0.3); pop("#s6-a1", t930 + 0.2); pop("#s6-f2", t930 + 0.5);
      const tEnd = C(5, 1) - 0.05;

      tl.to("#s6-mh", { rotation: 2610, duration: 1.2, ease: "power2.inOut" }, tEnd);
      tl.to("#s6-arc", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, tEnd);
      pop("#s6-t2", M.end + 0.1); pop("#s6-a2", M.end - 0.1); pop("#s6-f3", M.end + 0.15);
      tl.to("#s6-a", { x: -160, opacity: 0, scale: 0.92, duration: 0.35, ease: "power2.in" }, C(5, 2) - 0.2);
      tl.fromTo("#s6-b .pp", { opacity: 0, scale: 0, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)", stagger: { each: 0.035, from: "center" } }, C(5, 2) + 0.05);
      pop("#s6-b .ppl-l", M.parents);

      tl.fromTo("#s6-c", { opacity: 0 }, { opacity: 1, duration: 0.2 }, C(5, 3) - 0.1);
      tl.fromTo("#s6-c .cmp-r", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.12 }, C(5, 3));
      [0, 1, 2].forEach((k) => {
        const t = M.cheap + 0.2 + k * 0.4, row = `#s6-r${k + 1}`;

        pop(`${row} .mc`, t - 0.05, { duration: 0.3 });
        draw(`${row} .mc path`, t + 0.05, 0.25);
      });
      const tFly = AEND(5) + 0.3;
      tl.fromTo("#s6-fly", { rotationY: -75, rotationX: 12, opacity: 0, y: 80 }, { rotationY: 0, rotationX: 0, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" }, tFly);
      tl.to("#s6-mk", { scaleX: 1, duration: 0.6, ease: "power2.out" }, tFly + 0.55);
      tl.to("#s6-fly", { rotationY: 75, opacity: 0, duration: 0.35, ease: "power2.in" }, tFly + 1.95);

      // ===== S7 CTA =====
      draw("#s7-cta .harbor .ln", TR(6) + 0.2, 1.3, { stagger: 0.12 });
      tl.fromTo("#s7-lamp", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, ST(6) + 0.9);
      tl.fromTo("#s7-beam", { rotation: 158, opacity: 0 }, { rotation: 236, opacity: 1, duration: 1.6, ease: "sine.inOut" }, ST(6) + 0.95);
      tl.to("#s7-beam", { rotation: 168, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, ST(6) + 2.55);
      kin("#s7-logo .ch", C(6, 0) + 0.15, 0.05);
      tl.fromTo("#s7-leak", { x: -300, y: 200, opacity: 0 }, { x: 1300, y: -200, opacity: 0.9, duration: 1.6, ease: "power1.inOut" }, C(6, 0) + 0.1);
      tl.to("#s7-leak", { opacity: 0, duration: 0.6 }, C(6, 0) + 1.3);
      pop("#s7-sub", C(6, 0) + 0.75); pop("#s7-cities", C(6, 0) + 0.95);
      pop("#s7-btn", M.aa - 0.1, { ease: "back.out(2.2)" });
      const nPulse = Math.max(1, Math.floor((TOTAL - (M.aa + 0.5)) / 1.0));
      tl.to("#s7-btn", { scale: 1.06, duration: 0.5, yoyo: true, repeat: nPulse * 2 - 1, ease: "sine.inOut" }, M.aa + 0.45);
      tl.fromTo("#s7-bring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.35, duration: 1.0, repeat: nPulse - 1, ease: "power2.out" }, M.aa + 0.45);
      burst(M.aa + 0.3, 540, 1010, { n: 50, seed: 71, sp: 700, size: 6, life: 0.8 });
      fnIn("#s7-fn", C(6, 1) + 0.8);
      rain(TOTAL - 2.4, TOTAL, 70, 77);

      const FXP = { t: 0 };
      tl.fromTo(FXP, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => drawFx(FXP.t) }, 0);
    </script>
